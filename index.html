<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<title>Vibely Music</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ionicons/7.2.2/ionicons.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f2f2f7;
    --bg3: #e5e5ea;
    --text: #000000;
    --text2: #8e8e93;
    --accent: #7c4dff;
    --card: #ffffff;
    --border: rgba(60,60,67,0.12);
    --player-bg: #ffffff;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  [data-theme="dark"] {
    --bg: #000000;
    --bg2: #1c1c1e;
    --bg3: #2c2c2e;
    --text: #ffffff;
    --text2: #98989f;
    --accent: #bb86fc;
    --card: #1c1c1e;
    --border: rgba(84,84,88,0.36);
    --player-bg: #1c1c1e;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
  html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif; }

  ion-icon { pointer-events:none; }

  #app { display:flex; flex-direction:column; height:100vh; background:var(--bg); }

  /* TOPO — mesmo tamanho de texto/ícone, mas menos espaço vazio à volta */
  #topbar {
    padding-top: var(--safe-top);
    padding-bottom:2px;
    padding-left:20px; padding-right:20px;
    display:flex; align-items:center; justify-content:space-between;
    background:var(--bg);
    position:sticky; top:0; z-index:20;
    min-height:38px;
  }
  #topbar h1 { font-size:24px; font-weight:800; letter-spacing:-0.6px; color:var(--text); line-height:1; }
  #theme-btn {
    width:36px; height:36px; border-radius:18px; border:none;
    background:var(--bg2); color:var(--text);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  #theme-btn ion-icon { font-size:18px; }

  #main-content { flex:1; overflow-y:auto; overflow-x:hidden; padding-bottom:150px; padding-top:8px; -webkit-overflow-scrolling:touch; }

  /* SEARCH */
  #search-bar { padding:0 20px 16px; }
  #search-wrap {
    display:flex; gap:10px; align-items:center;
    background:var(--bg2); border-radius:18px; padding:13px 18px;
  }
  #search-wrap ion-icon { font-size:19px; color:var(--text2); }
  #search-wrap input {
    flex:1; border:none; background:transparent; color:var(--text);
    font-size:16px; outline:none; font-weight:500;
  }
  #search-wrap input::placeholder { color:var(--text2); }

  /* SECTIONS */
  .section { padding:6px 20px 0; margin-bottom:26px; }
  .section-title { font-size:22px; font-weight:800; margin-bottom:14px; letter-spacing:-0.4px; }

  /* CARDS GRANDES */
  .scroll-row { display:flex; gap:16px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
  .scroll-row::-webkit-scrollbar { display:none; }

  .card-lg { flex:0 0 168px; cursor:pointer; }
  .card-lg .thumb-wrap {
    width:168px; height:168px; border-radius:24px; overflow:hidden;
    background:var(--bg3); position:relative; box-shadow:0 6px 16px rgba(0,0,0,0.12);
  }
  .card-lg img { width:100%; height:100%; object-fit:cover; }
  .card-lg .play-overlay {
    position:absolute; bottom:10px; right:10px;
    width:38px; height:38px; border-radius:19px;
    background:rgba(255,255,255,0.9); backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center;
  }
  [data-theme="dark"] .card-lg .play-overlay { background:rgba(30,30,30,0.85); }
  .card-lg .play-overlay ion-icon { font-size:18px; color:var(--accent); }
  .card-lg .card-title { font-size:15px; font-weight:700; margin-top:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-lg .card-sub { font-size:13px; color:var(--text2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* LISTA DE RESULTADOS */
  #results-list, #related-list, #recent-list { padding:0 20px; display:flex; flex-direction:column; gap:12px; }

  .result-item {
    display:flex; gap:14px; align-items:center;
    background:var(--card); border-radius:20px; padding:10px;
    cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.05);
  }
  .result-thumb { width:64px; height:64px; border-radius:16px; object-fit:cover; background:var(--bg3); flex-shrink:0; }
  .result-info { flex:1; min-width:0; }
  .result-title { font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .result-sub { font-size:13px; color:var(--text2); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .result-dur { font-size:12px; color:var(--text2); margin-top:2px; }
  .result-play-btn {
    width:44px; height:44px; border-radius:22px; background:var(--accent);
    border:none; color:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .result-play-btn ion-icon { font-size:19px; }

  /* LOADING / EMPTY */
  .spinner { display:flex; justify-content:center; padding:40px; }
  .spinner ion-icon { font-size:32px; color:var(--accent); animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .empty { text-align:center; color:var(--text2); padding:40px 20px; font-size:15px; }
  .empty ion-icon { font-size:34px; display:block; margin:0 auto 10px; opacity:.5; }

  /* MINI PLAYER */
  #mini-player {
    position:fixed; bottom:82px; left:0; right:0;
    background:var(--player-bg);
    padding:14px 20px;
    z-index:40; display:none;
    border-radius:24px;
    margin:0 12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.14);
  }
  #mini-player.active { display:block; }

  #player-top { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
  #player-thumb { width:52px; height:52px; border-radius:16px; object-fit:cover; background:var(--bg3); flex-shrink:0; }
  #player-info { flex:1; min-width:0; }
  #player-title { font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #player-artist { font-size:12px; color:var(--text2); margin-top:2px; }

  #player-controls { display:flex; align-items:center; gap:16px; }
  #btn-play-pause {
    width:46px; height:46px; border-radius:23px; background:var(--accent);
    border:none; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  #btn-play-pause ion-icon { font-size:22px; }
  #btn-next, #btn-prev {
    width:38px; height:38px; border-radius:19px; background:var(--bg2);
    border:none; color:var(--text); display:flex; align-items:center; justify-content:center;
  }
  #btn-next ion-icon, #btn-prev ion-icon { font-size:18px; }

  #progress-wrap { display:flex; align-items:center; gap:10px; }
  #progress-bar { flex:1; height:5px; background:var(--bg3); border-radius:5px; cursor:pointer; }
  #progress-fill { height:100%; background:var(--accent); border-radius:5px; width:0%; transition:width .3s; }
  .time-label { font-size:11px; color:var(--text2); min-width:34px; text-align:center; font-weight:600; }

  /* BOTTOM BAR */
  #bottom-bar {
    position:fixed; bottom:0; left:0; right:0;
    display:flex;
    background:var(--card);
    padding-top:10px;
    padding-bottom:calc(var(--safe-bottom) + 8px);
    box-shadow:0 -2px 16px rgba(0,0,0,0.08);
    z-index:30;
  }
  .bb-item {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:transparent; border:none; color:var(--text2);
    padding:2px 0;
  }
  .bb-item ion-icon { font-size:23px; }
  .bb-item span { font-size:10.5px; font-weight:600; }
  .bb-item.active { color:var(--accent); }
  .bb-item .bb-icon-wrap {
    width:44px; height:26px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s;
  }
  .bb-item.active .bb-icon-wrap { background:var(--bg2); }

  .view { display:none; }
  .view.active { display:block; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>Vibely</h1>
    <button id="theme-btn"><ion-icon name="moon"></ion-icon></button>
  </div>

  <div id="main-content">

    <div id="view-home" class="view active">
      <div class="section">
        <div class="section-title">Em alta</div>
        <div class="scroll-row" id="trending-row"><div class="spinner"><ion-icon name="reload"></ion-icon></div></div>
      </div>
      <div class="section">
        <div class="section-title">Recentes</div>
        <div id="recent-list"></div>
      </div>
    </div>

    <div id="view-search" class="view">
      <div id="search-bar">
        <div id="search-wrap">
          <ion-icon name="search"></ion-icon>
          <input type="text" id="search-input" placeholder="Pesquisar músicas, artistas..." autocomplete="off"/>
        </div>
      </div>
      <div id="results-list"></div>
    </div>

    <div id="view-related" class="view">
      <div class="section">
        <div class="section-title">A seguir</div>
        <div id="related-list" class="empty"><ion-icon name="musical-notes"></ion-icon>Reproduz uma música para ver sugestões</div>
      </div>
    </div>

  </div>

  <div id="mini-player">
    <div id="player-top">
      <img id="player-thumb" src="" alt=""/>
      <div id="player-info">
        <div id="player-title">—</div>
        <div id="player-artist">—</div>
      </div>
      <div id="player-controls">
        <button id="btn-prev"><ion-icon name="play-skip-back"></ion-icon></button>
        <button id="btn-play-pause"><ion-icon name="play"></ion-icon></button>
        <button id="btn-next"><ion-icon name="play-skip-forward"></ion-icon></button>
      </div>
    </div>
    <div id="progress-wrap">
      <span class="time-label" id="time-current">0:00</span>
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <span class="time-label" id="time-total">0:00</span>
    </div>
  </div>

  <div id="bottom-bar">
    <button class="bb-item active" data-tab="home">
      <div class="bb-icon-wrap"><ion-icon name="home"></ion-icon></div>
      <span>Início</span>
    </button>
    <button class="bb-item" data-tab="search">
      <div class="bb-icon-wrap"><ion-icon name="search"></ion-icon></div>
      <span>Pesquisar</span>
    </button>
    <button class="bb-item" data-tab="related">
      <div class="bb-icon-wrap"><ion-icon name="list"></ion-icon></div>
      <span>A seguir</span>
    </button>
  </div>
</div>

<script>
const BASE = 'http://localhost:8080';
const isApp = typeof Android !== 'undefined' && Android.isInsideApp();

// ─── TEMA ────────────────────────────────────────────────
let dark = false;
const themeBtn = document.getElementById('theme-btn');

function applyTheme(d, notifyNative = true) {
  dark = d;
  document.documentElement.setAttribute('data-theme', d ? 'dark' : '');
  themeBtn.innerHTML = `<ion-icon name="${d ? 'sunny' : 'moon'}"></ion-icon>`;
  localStorage.setItem('theme', d ? 'dark' : 'light');
  if (notifyNative && isApp && typeof Android.setStatusBarTheme === 'function') {
    Android.setStatusBarTheme(!d);
  }
}
applyTheme(localStorage.getItem('theme') === 'dark');
themeBtn.addEventListener('click', () => applyTheme(!dark));

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') applyTheme(dark);
});

// ─── BOTTOM BAR ──────────────────────────────────────────
const bbItems = document.querySelectorAll('.bb-item');
const views = document.querySelectorAll('.view');
bbItems.forEach(btn => {
  btn.addEventListener('click', () => {
    bbItems.forEach(t => t.classList.remove('active'));
    views.forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'search') {
      setTimeout(() => document.getElementById('search-input').focus(), 100);
    }
  });
});

// ─── RECENTES ────────────────────────────────────────────
function getRecents() {
  try { return JSON.parse(localStorage.getItem('recents') || '[]'); } catch { return []; }
}
function addRecent(track) {
  let r = getRecents().filter(t => t.id !== track.id);
  r.unshift(track);
  r = r.slice(0, 20);
  localStorage.setItem('recents', JSON.stringify(r));
}
function renderRecents() {
  const list = document.getElementById('recent-list');
  const recents = getRecents();
  if (!recents.length) {
    list.innerHTML = '<div class="empty"><ion-icon name="time-outline"></ion-icon>Ainda sem músicas recentes</div>';
    return;
  }
  list.innerHTML = recents.map(t => trackItemHTML(t)).join('');
  list.querySelectorAll('.result-item').forEach((el, i) => {
    el.addEventListener('click', () => { currentQueue = recents; play(recents[i], i); });
    el.querySelector('.result-play-btn').addEventListener('click', e => {
      e.stopPropagation(); currentQueue = recents; play(recents[i], i);
    });
  });
}

// ─── TRENDING ────────────────────────────────────────────
async function loadTrending() {
  const row = document.getElementById('trending-row');
  if (!isApp) {
    row.innerHTML = '<div class="empty" style="padding:20px 0"><ion-icon name="alert-circle-outline"></ion-icon>Só disponível no app</div>';
    return;
  }
  try {
    const res = await fetch(BASE + '/search?q=top+music+2025');
    const data = await res.json();
    if (!data.length) { row.innerHTML = '<div class="empty">Sem resultados</div>'; return; }
    row.innerHTML = data.slice(0,12).map(t => `
      <div class="card-lg" data-id="${t.id}">
        <div class="thumb-wrap">
          <img src="${t.thumbnail}" loading="lazy" onerror="this.src=''"/>
          <div class="play-overlay"><ion-icon name="play"></ion-icon></div>
        </div>
        <div class="card-title">${esc(t.title)}</div>
        <div class="card-sub">${esc(t.artist)}</div>
      </div>
    `).join('');
    row.querySelectorAll('.card-lg').forEach((el, i) => {
      el.addEventListener('click', () => { currentQueue = data; play(data[i], i); });
    });
  } catch(e) {
    row.innerHTML = '<div class="empty">Erro ao carregar</div>';
  }
}

// ─── PESQUISA ────────────────────────────────────────────
const searchInput = document.getElementById('search-input');
const resultsList = document.getElementById('results-list');
let searchQueue = [];
let searchTimeout;

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => doSearch(searchInput.value), 500);
});
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(searchInput.value); });

async function doSearch(q) {
  if (!q.trim()) { resultsList.innerHTML = ''; return; }
  resultsList.innerHTML = '<div class="spinner"><ion-icon name="reload"></ion-icon></div>';
  if (!isApp) {
    resultsList.innerHTML = '<div class="empty"><ion-icon name="alert-circle-outline"></ion-icon>Servidor só disponível no app</div>';
    return;
  }
  try {
    const res = await fetch(BASE + '/search?q=' + encodeURIComponent(q));
    const data = await res.json();
    searchQueue = data;
    if (!data.length) { resultsList.innerHTML = '<div class="empty">Sem resultados</div>'; return; }
    resultsList.innerHTML = data.map(t => trackItemHTML(t)).join('');
    resultsList.querySelectorAll('.result-item').forEach((el, i) => {
      el.addEventListener('click', () => { currentQueue = searchQueue; play(data[i], i); });
      el.querySelector('.result-play-btn').addEventListener('click', e => {
        e.stopPropagation(); currentQueue = searchQueue; play(data[i], i);
      });
    });
  } catch(e) {
    resultsList.innerHTML = '<div class="empty">Erro na pesquisa</div>';
  }
}

// ─── RELACIONADOS ────────────────────────────────────────
let relatedQueue = [];
async function loadRelated(id) {
  const list = document.getElementById('related-list');
  list.innerHTML = '<div class="spinner"><ion-icon name="reload"></ion-icon></div>';
  if (!isApp) { list.innerHTML = '<div class="empty">Só no app</div>'; return; }
  try {
    const res = await fetch(BASE + '/related?id=' + id);
    const data = await res.json();
    relatedQueue = data;
    if (!data.length) { list.innerHTML = '<div class="empty">Sem sugestões</div>'; return; }
    list.innerHTML = data.map(t => trackItemHTML(t)).join('');
    list.querySelectorAll('.result-item').forEach((el, i) => {
      el.addEventListener('click', () => { currentQueue = relatedQueue; play(data[i], i); });
      el.querySelector('.result-play-btn').addEventListener('click', e => {
        e.stopPropagation(); currentQueue = relatedQueue; play(data[i], i);
      });
    });
  } catch(e) {
    list.innerHTML = '<div class="empty">Erro ao carregar</div>';
  }
}

// ─── PLAYER ──────────────────────────────────────────────
let currentTrack = null;
let currentQueueIndex = 0;
let currentQueue = [];
let audio = new Audio();
let isPlaying = false;

const miniPlayer = document.getElementById('mini-player');
const playerThumb = document.getElementById('player-thumb');
const playerTitle = document.getElementById('player-title');
const playerArtist = document.getElementById('player-artist');
const btnPlayPause = document.getElementById('btn-play-pause');
const btnNext = document.getElementById('btn-next');
const btnPrev = document.getElementById('btn-prev');
const progressFill = document.getElementById('progress-fill');
const progressBar = document.getElementById('progress-bar');
const timeCurrent = document.getElementById('time-current');
const timeTotal = document.getElementById('time-total');

async function play(track, queueIndex) {
  if (!isApp) { alert('Player só disponível no app Vibely'); return; }
  currentTrack = track;
  if (queueIndex !== undefined) currentQueueIndex = queueIndex;

  playerTitle.textContent = track.title || '—';
  playerArtist.textContent = track.artist || '—';
  playerThumb.src = track.thumbnail || '';
  miniPlayer.classList.add('active');
  btnPlayPause.innerHTML = '<ion-icon name="hourglass-outline"></ion-icon>';
  progressFill.style.width = '0%';
  timeCurrent.textContent = '0:00';
  timeTotal.textContent = fmtTime(track.duration || 0);

  addRecent(track);
  renderRecents();
  loadRelated(track.id);

  try {
    const res = await fetch(BASE + '/stream?id=' + track.id);
    const { streamUrl } = await res.json();
    if (!streamUrl) throw new Error('sem stream');
    audio.pause();
    audio.src = streamUrl;
    audio.load();
    await audio.play();
    isPlaying = true;
    btnPlayPause.innerHTML = '<ion-icon name="pause"></ion-icon>';
  } catch(e) {
    btnPlayPause.innerHTML = '<ion-icon name="play"></ion-icon>';
    console.error('Erro stream:', e);
  }
}

btnPlayPause.addEventListener('click', () => {
  if (!currentTrack) return;
  if (isPlaying) {
    audio.pause(); isPlaying = false;
    btnPlayPause.innerHTML = '<ion-icon name="play"></ion-icon>';
  } else {
    audio.play(); isPlaying = true;
    btnPlayPause.innerHTML = '<ion-icon name="pause"></ion-icon>';
  }
});

btnNext.addEventListener('click', () => {
  if (!currentQueue.length) return;
  currentQueueIndex = (currentQueueIndex + 1) % currentQueue.length;
  play(currentQueue[currentQueueIndex], currentQueueIndex);
});

btnPrev.addEventListener('click', () => {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (!currentQueue.length) return;
  currentQueueIndex = (currentQueueIndex - 1 + currentQueue.length) % currentQueue.length;
  play(currentQueue[currentQueueIndex], currentQueueIndex);
});

audio.addEventListener('ended', () => {
  if (!currentQueue.length) return;
  currentQueueIndex = (currentQueueIndex + 1) % currentQueue.length;
  play(currentQueue[currentQueueIndex], currentQueueIndex);
});

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = pct + '%';
  timeCurrent.textContent = fmtTime(Math.floor(audio.currentTime));
  timeTotal.textContent = fmtTime(Math.floor(audio.duration));
});

progressBar.addEventListener('click', e => {
  if (!audio.duration) return;
  const rect = progressBar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

// ─── UTILS ───────────────────────────────────────────────
function fmtTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60), sec = s % 60;
  return m + ':' + String(sec).padStart(2, '0');
}
function esc(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function trackItemHTML(t) {
  return `
    <div class="result-item">
      <img class="result-thumb" src="${t.thumbnail}" loading="lazy" onerror="this.src=''"/>
      <div class="result-info">
        <div class="result-title">${esc(t.title)}</div>
        <div class="result-sub">${esc(t.artist)}</div>
        <div class="result-dur">${fmtTime(t.duration)}${t.views ? ' · ' + t.views : ''}</div>
      </div>
      <button class="result-play-btn"><ion-icon name="play"></ion-icon></button>
    </div>
  `;
}

// ─── INIT ────────────────────────────────────────────────
renderRecents();
loadTrending();
</script>
</body>
</html>
