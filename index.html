<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<meta name="theme-color" content="#FFFFFF"/>
<title>Vibely Music</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ionicons/7.2.2/ionicons.js"></script>
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #F5F5F5;
    --surface2: #ECECEE;
    --floating: #FFFFFF;
    --text: #1C1C1E;
    --text2: #6E6E73;
    --accent: #2596be;
    --accent-rgb: 37,150,190;
    --on-accent: #FFFFFF;
    --accent-container: rgba(37,150,190,0.16);
    --border: #ECECEE;
    --outline: #DCDCE0;
    --danger: #FF3B30;
    --shadow-strong: 0 2px 10px rgba(0,0,0,0.08);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --top-extra: 46px;
    --spring: cubic-bezier(0.32, 0.72, 0, 1);
    --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    --big-bounce: cubic-bezier(0.22, 1.9, 0.36, 1);
    /* curvas nativas do Material */
    --emphasized: cubic-bezier(0.2, 0, 0, 1);
    --emphasized-decel: cubic-bezier(0.05, 0.7, 0.1, 1);
    --emphasized-accel: cubic-bezier(0.3, 0, 0.8, 0.15);
    --np-c1: #2596be;
    --np-c2: #16607a;
  }
  [data-theme="dark"] {
    --bg: #0D0D0D;
    --surface: #1F1F1F;
    --surface2: #2A2A2C;
    --floating: #1F1F1F;
    --text: #F2F2F2;
    --text2: #9B9B9F;
    --on-accent: #FFFFFF;
    --border: #3A3A3C;
    --outline: #48484A;
    --danger: #FF453A;
    --shadow-strong: 0 4px 16px rgba(0,0,0,0.35);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
  html, body {
    height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .3s ease, color .3s ease;
  }
  button { font-family:inherit; cursor:pointer; }
  ion-icon { pointer-events:none; }

  .tap { transition:transform .2s var(--emphasized), opacity .2s ease; }
  .tap:active { transform:scale(.95); opacity:.85; }

  #app { position:relative; display:flex; flex-direction:column; height:100vh; background:var(--bg); }

  /* ─── LOADER NATIVO ─── */
  .loader { display:flex; align-items:center; justify-content:center; padding:44px 0; }
  .loader svg { width:36px; height:36px; animation:loaderRotate 1.4s linear infinite; transform-origin:center; }
  .loader circle {
    fill:none; stroke:var(--accent); stroke-width:3.4; stroke-linecap:round;
    stroke-dasharray:1, 200; stroke-dashoffset:0;
    animation:loaderDash 1.4s ease-in-out infinite;
  }
  @keyframes loaderRotate { 100% { transform:rotate(360deg); } }
  @keyframes loaderDash {
    0%   { stroke-dasharray:1, 200; stroke-dashoffset:0; }
    50%  { stroke-dasharray:90, 200; stroke-dashoffset:-35px; }
    100% { stroke-dasharray:90, 200; stroke-dashoffset:-124px; }
  }
  .btn-loader { width:22px; height:22px; animation:loaderRotate 1.4s linear infinite; }
  .btn-loader circle {
    fill:none; stroke:currentColor; stroke-width:4; stroke-linecap:round;
    stroke-dasharray:1, 200; stroke-dashoffset:0;
    animation:loaderDash 1.4s ease-in-out infinite;
  }

  /* ─── TOPO ─── */
  #topbar {
    position:relative; z-index:20;
    padding:calc(var(--safe-top) + var(--top-extra)) 20px 10px;
    display:flex; align-items:center; justify-content:space-between;
  }
  #topbar h1 {
    font-size:30px; font-weight:800; letter-spacing:-0.9px; line-height:1.1;
    transition:opacity .25s ease;
  }
  #menu-btn {
    width:40px; height:40px; border-radius:50%;
    background:var(--surface); color:var(--text); border:0;
    display:flex; align-items:center; justify-content:center;
  }
  #menu-btn ion-icon { font-size:20px; }

  /* ─── CONTEÚDO ─── */
  #main-content {
    position:relative; z-index:1; flex:1; overflow-y:auto; overflow-x:hidden;
    padding-top:4px; padding-bottom:200px; -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  #main-content::-webkit-scrollbar { display:none; }

  .view { display:none; }
  .view.active { display:block; animation:viewIn .32s var(--emphasized-decel) both; }
  @keyframes viewIn { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

  .section { margin-bottom:26px; }
  .section-head { display:flex; align-items:center; justify-content:space-between; padding:0 20px; margin-bottom:12px; }
  .section-title { font-size:22px; font-weight:800; letter-spacing:-0.5px; }

  /* ─── FILTROS DO INÍCIO (pílulas) ─── */
  #home-filters { display:flex; gap:8px; padding:2px 20px 16px; overflow-x:auto; scrollbar-width:none; }
  #home-filters::-webkit-scrollbar { display:none; }
  .fchip {
    padding:9px 18px; border-radius:999px; border:0; flex-shrink:0;
    background:var(--surface); color:var(--text); font-size:14px; font-weight:600;
    transition:background .25s ease, color .25s ease;
  }
  .fchip.active { background:var(--accent); color:var(--on-accent); }

  /* ─── CARROSSEL DO FEED (capas ~144px, sem cartão) ─── */
  .scroll-row {
    display:flex; gap:14px; overflow-x:auto; padding:2px 20px 6px;
    scrollbar-width:none; scroll-snap-type:x proximity; scroll-padding-left:20px;
  }
  .scroll-row::-webkit-scrollbar { display:none; }

  .feed-card { flex:0 0 144px; width:144px; scroll-snap-align:start; animation:fadeUp .4s var(--emphasized-decel) both; }
  .feed-card .thumb {
    width:144px; height:144px; border-radius:8px; overflow:hidden; background:var(--surface2);
  }
  .feed-card img { width:100%; height:100%; object-fit:cover; display:block; }
  .feed-card .card-title {
    font-size:14px; font-weight:700; margin-top:10px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.25;
  }
  .feed-card .card-sub {
    font-size:13px; color:var(--text2); margin-top:3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  /* ─── LISTAS PLANAS (resultados como na imagem 1) ─── */
  #results-list, #recent-list, #pl-tracks { display:flex; flex-direction:column; }
  .track-row {
    display:flex; align-items:center; gap:14px; padding:8px 8px 8px 20px;
    animation:fadeUp .35s var(--emphasized-decel) both;
    transition:background .15s ease;
  }
  .track-row:active { background:var(--surface); }
  .track-row.playing .tr-title { color:var(--accent); }
  .tr-thumb { width:56px; height:56px; border-radius:4px; object-fit:cover; background:var(--surface2); flex-shrink:0; }
  .tr-info { flex:1; min-width:0; }
  .tr-title { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tr-sub { font-size:14px; color:var(--text2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tr-more {
    width:44px; height:44px; border-radius:50%; border:0; background:transparent; color:var(--text2);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .tr-more ion-icon { font-size:22px; }
  .tr-more:active { background:var(--surface); }

  /* nada de mensagens de vazio */
  .empty { display:none; }

  /* ─── PESQUISAR ─── */
  #search-head { padding:0 20px 14px; }
  #search-title { font-size:34px; font-weight:800; letter-spacing:-1px; margin-bottom:14px; }
  #search-wrap {
    display:flex; align-items:center; gap:10px;
    height:52px; padding:0 6px 0 18px; border-radius:999px;
    background:var(--surface);
  }
  #search-wrap > ion-icon { font-size:21px; color:var(--text2); flex-shrink:0; }
  #search-input {
    flex:1; min-width:0; height:100%; border:0; outline:0; background:transparent;
    color:var(--text); font-size:16px; font-weight:500; font-family:inherit;
    -webkit-appearance:none; appearance:none;
  }
  #search-input::placeholder { color:var(--text2); font-weight:500; }
  #search-input::-webkit-search-cancel-button,
  #search-input::-webkit-search-decoration { -webkit-appearance:none; display:none; }
  #search-clear {
    width:40px; height:40px; border-radius:50%; border:0; flex-shrink:0;
    background:transparent; color:var(--text2);
    display:none; align-items:center; justify-content:center;
  }
  #search-clear.show { display:flex; }
  #search-clear ion-icon { font-size:22px; }

  /* grelha de categorias */
  #cat-title { font-size:22px; font-weight:800; letter-spacing:-0.5px; padding:6px 20px 14px; }
  #cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 20px; }
  .cat-card {
    position:relative; height:96px; border-radius:10px; overflow:hidden; border:0; text-align:left;
    color:#fff; padding:12px 14px; font-size:17px; font-weight:800; letter-spacing:-0.2px;
    animation:fadeUp .4s var(--emphasized-decel) both;
  }
  .cat-card ion-icon {
    position:absolute; right:-6px; bottom:-8px; font-size:64px; opacity:.30;
    transform:rotate(-18deg);
  }

  /* ─── PLAYLISTS ─── */
  #pl-head { display:flex; align-items:center; justify-content:space-between; padding:0 20px 14px; }
  #pl-head .section-title { font-size:34px; letter-spacing:-1px; }
  #pl-add {
    width:44px; height:44px; border-radius:50%; border:0; background:var(--accent); color:var(--on-accent);
    display:flex; align-items:center; justify-content:center;
  }
  #pl-add ion-icon { font-size:26px; }

  .pl-row {
    display:flex; align-items:center; gap:14px; padding:8px 8px 8px 20px;
    animation:fadeUp .35s var(--emphasized-decel) both; transition:background .15s ease;
  }
  .pl-row:active { background:var(--surface); }
  .pl-cover {
    width:64px; height:64px; border-radius:6px; overflow:hidden; background:var(--surface2); flex-shrink:0;
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
    align-items:center; justify-items:center;
  }
  .pl-cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .pl-cover img.full { grid-column:1 / 3; grid-row:1 / 3; }
  .pl-cover ion-icon { grid-column:1 / 3; grid-row:1 / 3; font-size:28px; color:var(--text2); }
  .pl-info { flex:1; min-width:0; }
  .pl-name { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl-count { font-size:14px; color:var(--text2); margin-top:2px; }

  #pl-detail-head { display:flex; align-items:center; gap:6px; padding:0 8px 6px; }
  #pl-back {
    width:44px; height:44px; border-radius:50%; border:0; background:transparent; color:var(--text);
    display:flex; align-items:center; justify-content:center;
  }
  #pl-back ion-icon { font-size:26px; }
  #pl-detail-name { font-size:26px; font-weight:800; letter-spacing:-0.6px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #pl-detail-menu {
    width:44px; height:44px; border-radius:50%; border:0; background:transparent; color:var(--text);
    display:flex; align-items:center; justify-content:center;
  }
  #pl-detail-menu ion-icon { font-size:22px; }
  #pl-detail-actions { display:flex; align-items:center; gap:12px; padding:6px 20px 14px; }
  #pl-detail-count { color:var(--text2); font-size:14px; flex:1; }
  #pl-play-all {
    height:44px; padding:0 22px; border-radius:999px; border:0; background:var(--accent); color:var(--on-accent);
    display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700;
  }
  #pl-play-all ion-icon { font-size:20px; }

  /* ─── MINI PLAYER ─── */
  #mini-player {
    position:fixed; left:12px; right:12px; z-index:40;
    bottom:calc(var(--safe-bottom) + 84px);
    height:74px; border-radius:999px; padding:0 10px 0 9px;
    display:flex; align-items:center; gap:12px; overflow:hidden;
    background:var(--floating); border:1px solid var(--border);
    box-shadow:var(--shadow-strong);
    transform:translateY(140px); opacity:0; pointer-events:none;
    transition:transform .5s var(--emphasized-decel), opacity .3s ease;
  }
  #mini-player.active { transform:none; opacity:1; pointer-events:auto; }
  #mini-tint {
    position:absolute; inset:0; z-index:0; pointer-events:none; opacity:.22;
    background:linear-gradient(115deg, var(--np-c1), var(--np-c2));
    transition:background .9s ease;
  }
  #mini-progress {
    position:absolute; left:0; bottom:0; height:3px; width:0%; z-index:1;
    background:var(--accent); border-radius:0 3px 3px 0;
  }
  #mini-player > *:not(#mini-tint):not(#mini-progress) { position:relative; z-index:2; }

  .disc {
    position:relative; border-radius:50%; flex-shrink:0; overflow:hidden;
    background:#111; box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .disc img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .disc::before {
    content:''; position:absolute; inset:0; border-radius:50%; z-index:2; pointer-events:none;
    background:repeating-radial-gradient(circle at center, rgba(0,0,0,0) 0 3px, rgba(0,0,0,.10) 3px 4px);
  }
  .disc::after {
    content:''; position:absolute; z-index:3; top:50%; left:50%; transform:translate(-50%,-50%);
    width:22%; height:22%; border-radius:50%;
    background:var(--bg); border:2px solid rgba(255,255,255,.55);
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);
  }
  .spin { animation:discSpin 9s linear infinite; animation-play-state:paused; }
  .spin.running { animation-play-state:running; }
  @keyframes discSpin { to { transform:rotate(360deg); } }

  #mini-disc { width:56px; height:56px; }
  #mini-info { flex:1; min-width:0; }
  #mini-title { font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-0.2px; }
  #mini-artist { font-size:12.5px; color:var(--text2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini-ctrl { display:flex; align-items:center; gap:4px; }
  .mini-btn {
    width:44px; height:44px; border-radius:50%; border:0; background:transparent; color:var(--text);
    display:flex; align-items:center; justify-content:center;
  }
  .mini-btn ion-icon { font-size:24px; }
  #mini-play { background:var(--accent); color:var(--on-accent); }
  #mini-play ion-icon { font-size:22px; }

  /* ─── BOTTOM BAR ─── */
  #bottom-bar {
    position:fixed; left:50%; z-index:50;
    bottom:calc(var(--safe-bottom) + 14px);
    transform:translateX(-50%);
    width:calc(100% - 40px); max-width:420px; height:62px;
    border-radius:999px; padding:6px;
    display:flex; align-items:center;
    background:var(--floating); border:1px solid var(--border);
    box-shadow:var(--shadow-strong);
    transition:transform .45s var(--emphasized), opacity .3s ease;
  }
  #bb-pill {
    position:absolute; top:6px; bottom:6px; left:6px; border-radius:999px; z-index:0;
    background:var(--accent-container);
    transition:transform .4s var(--emphasized), width .4s var(--emphasized), background .4s ease;
    will-change:transform;
  }
  .bb-item {
    position:relative; z-index:1; flex:1; height:100%; border:0; background:transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    color:var(--text2); transition:color .25s ease;
  }
  .bb-item ion-icon { font-size:23px; }
  .bb-item span { font-size:10.5px; font-weight:700; letter-spacing:.1px; }
  .bb-item.active { color:var(--accent); }

  /* ─── MENU POPUP (animação nativa Material) ─── */
  #menu-overlay { position:fixed; inset:0; z-index:90; visibility:hidden; background:rgba(0,0,0,0); transition:background .2s linear, visibility 0s linear .2s; }
  #menu-overlay.open { visibility:visible; background:rgba(0,0,0,.32); transition:background .2s linear, visibility 0s; }
  #menu-pop {
    position:absolute; top:calc(var(--safe-top) + var(--top-extra) - 4px); right:14px; width:290px;
    padding:8px 0; border-radius:16px; transform-origin:top right;
    background:var(--floating);
    box-shadow:0 8px 28px rgba(0,0,0,.28);
    transform:scale(.85); opacity:0;
    transition:transform .15s var(--emphasized-accel), opacity .1s linear;
  }
  #menu-overlay.open #menu-pop {
    transform:scale(1); opacity:1;
    transition:transform .3s var(--emphasized-decel), opacity .15s linear;
  }
  .menu-item {
    width:100%; display:flex; align-items:center; gap:16px; padding:14px 20px;
    background:transparent; border:0; color:var(--text);
    font-size:16px; font-weight:500; text-align:left;
    transition:background .15s ease;
  }
  .menu-item:active { background:var(--surface); }
  .menu-item ion-icon { font-size:22px; color:var(--text2); flex-shrink:0; }
  .menu-item span.grow { flex:1; }
  .menu-item.danger, .menu-item.danger ion-icon { color:var(--danger); }
  .menu-sep { height:1px; background:var(--border); margin:6px 0; }

  /* switch estilo Material */
  .switch {
    position:relative; width:46px; height:28px; border-radius:999px; flex-shrink:0;
    background:var(--surface2); border:2px solid var(--outline);
    transition:background .2s ease, border-color .2s ease;
  }
  .switch::after {
    content:''; position:absolute; top:50%; left:4px; width:14px; height:14px; border-radius:50%;
    background:var(--text2); transform:translateY(-50%);
    transition:left .25s var(--emphasized), width .25s var(--emphasized), height .25s var(--emphasized), background .2s ease;
  }
  .switch.on { background:var(--accent); border-color:var(--accent); }
  .switch.on::after { left:20px; width:20px; height:20px; background:var(--on-accent); }

  /* ─── BOTTOM SHEET (ações de música / playlists) ─── */
  #sheet-overlay { position:fixed; inset:0; z-index:100; visibility:hidden; background:rgba(0,0,0,0); transition:background .25s linear, visibility 0s linear .3s; }
  #sheet-overlay.open { visibility:visible; background:rgba(0,0,0,.45); transition:background .25s linear, visibility 0s; }
  #sheet {
    position:absolute; left:0; right:0; bottom:0; max-height:80vh; overflow-y:auto;
    background:var(--floating); border-radius:28px 28px 0 0;
    padding:10px 0 calc(var(--safe-bottom) + 14px);
    transform:translateY(100%);
    transition:transform .25s var(--emphasized-accel);
    scrollbar-width:none;
  }
  #sheet::-webkit-scrollbar { display:none; }
  #sheet-overlay.open #sheet { transform:none; transition:transform .4s var(--emphasized-decel); }
  #sheet-handle { width:36px; height:4px; border-radius:99px; background:var(--outline); margin:2px auto 12px; }
  #sheet-head { display:flex; align-items:center; gap:14px; padding:4px 20px 12px; border-bottom:1px solid var(--border); margin-bottom:6px; }
  #sheet-head img { width:52px; height:52px; border-radius:6px; object-fit:cover; background:var(--surface2); }
  #sheet-head .sh-t { font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #sheet-head .sh-s { font-size:14px; color:var(--text2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #sheet-title { font-size:18px; font-weight:800; padding:6px 20px 10px; }

  /* ─── DIÁLOGO (nome de playlist) ─── */
  #dialog-overlay { position:fixed; inset:0; z-index:110; visibility:hidden; background:rgba(0,0,0,0); display:flex; align-items:center; justify-content:center; padding:24px; transition:background .2s linear, visibility 0s linear .2s; }
  #dialog-overlay.open { visibility:visible; background:rgba(0,0,0,.5); transition:background .2s linear, visibility 0s; }
  #dialog {
    width:100%; max-width:340px; border-radius:28px; padding:24px 24px 16px;
    background:var(--floating);
    transform:scale(.88); opacity:0;
    transition:transform .15s var(--emphasized-accel), opacity .1s linear;
  }
  #dialog-overlay.open #dialog { transform:scale(1); opacity:1; transition:transform .3s var(--emphasized-decel), opacity .15s linear; }
  #dialog h3 { font-size:22px; font-weight:700; margin-bottom:16px; }
  #dialog-input {
    width:100%; height:52px; padding:0 16px; border-radius:12px; outline:0;
    border:2px solid var(--outline); background:transparent; color:var(--text);
    font-size:16px; font-family:inherit; transition:border-color .2s ease;
  }
  #dialog-input:focus { border-color:var(--accent); }
  #dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
  .dlg-btn { height:44px; padding:0 18px; border-radius:999px; border:0; background:transparent; color:var(--accent); font-size:15px; font-weight:700; }
  .dlg-btn:active { background:var(--accent-container); }

  /* ─── MODAL DO PLAYER ─── */
  #now-playing {
    position:fixed; inset:0; z-index:80; overflow:hidden;
    background:var(--bg);
    transform:translateY(102%); border-radius:28px 28px 0 0;
    transition:transform .4s var(--emphasized-accel), border-radius .4s var(--emphasized-accel);
    display:flex; flex-direction:column;
    padding:calc(var(--safe-top) + var(--top-extra) - 14px) 26px calc(var(--safe-bottom) + 24px);
    touch-action:none;
  }
  #now-playing.open { transform:none; border-radius:0; transition:transform .5s var(--emphasized-decel), border-radius .5s var(--emphasized-decel); }
  #now-playing.dragging { transition:none; }
  #np-bg {
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:linear-gradient(180deg, var(--np-c1) 0%, var(--np-c2) 60%, var(--bg) 130%);
    opacity:.92; transition:background 1s ease;
  }
  #np-bg::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.28) 100%); }
  #now-playing > *:not(#np-bg) { position:relative; z-index:1; }
  #np-grab { width:44px; height:5px; border-radius:99px; background:rgba(255,255,255,.55); margin:2px auto 12px; }
  #np-top { display:flex; align-items:center; justify-content:space-between; color:#fff; }
  #np-top .np-label { font-size:13px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; opacity:.85; }
  .np-round {
    width:42px; height:42px; border-radius:50%; border:0; color:#fff; background:rgba(255,255,255,.22);
    display:flex; align-items:center; justify-content:center;
  }
  .np-round ion-icon { font-size:22px; }

  #np-stage { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  #np-disc {
    width:min(76vw, 44vh); height:min(76vw, 44vh);
    box-shadow:0 30px 70px rgba(0,0,0,.45);
    transition:transform .5s var(--emphasized);
  }
  #now-playing:not(.playing) #np-disc { transform:scale(.9); }

  #np-meta { color:#fff; margin-top:6px; }
  #np-title { font-size:24px; font-weight:800; letter-spacing:-0.5px; line-height:1.15; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #np-artist { font-size:17px; font-weight:600; opacity:.75; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #np-seek { margin-top:22px; color:#fff; }
  #np-bar { position:relative; height:26px; display:flex; align-items:center; touch-action:none; cursor:pointer; }
  #np-bar-track { position:relative; width:100%; height:6px; border-radius:99px; background:rgba(255,255,255,.28); transition:height .2s var(--emphasized); }
  #np-bar.active #np-bar-track { height:12px; }
  #np-bar-fill { position:absolute; left:0; top:0; bottom:0; width:0%; border-radius:99px; background:#fff; }
  #np-times { display:flex; justify-content:space-between; font-size:12px; font-weight:700; opacity:.75; margin-top:2px; }

  #np-controls { display:flex; align-items:center; justify-content:space-between; margin:14px 6px 0; color:#fff; }
  .np-ctrl { width:64px; height:64px; border:0; border-radius:50%; background:transparent; color:#fff; display:flex; align-items:center; justify-content:center; }
  .np-ctrl ion-icon { font-size:38px; }
  #np-play { width:82px; height:82px; background:#fff; color:#111; box-shadow:0 8px 22px rgba(0,0,0,.28); }
  #np-play ion-icon { font-size:40px; }
  #np-play .btn-loader { width:34px; height:34px; }
  .np-aux { width:48px; height:48px; opacity:.75; }
  .np-aux ion-icon { font-size:24px; }
  .np-aux.on { color:#fff; background:rgba(255,255,255,.24); opacity:1; }

  #np-extra { display:flex; align-items:center; justify-content:space-between; margin:12px 8px 0; color:#fff; }
  #np-vol { display:flex; align-items:center; gap:10px; flex:1; }
  #np-vol ion-icon { font-size:20px; opacity:.8; flex-shrink:0; }
  #np-vol-bar { position:relative; flex:1; height:24px; display:flex; align-items:center; touch-action:none; }
  #np-vol-track { position:relative; width:100%; height:6px; border-radius:99px; background:rgba(255,255,255,.28); }
  #np-vol-fill { position:absolute; left:0; top:0; bottom:0; width:100%; border-radius:99px; background:#fff; }

  /* ─── TOAST ─── */
  #toast {
    position:fixed; left:50%; z-index:120; top:calc(var(--safe-top) + var(--top-extra));
    transform:translate(-50%,-30px); opacity:0;
    padding:12px 22px; border-radius:999px; font-size:14px; font-weight:600; color:var(--text);
    background:var(--floating); border:1px solid var(--border);
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    transition:transform .3s var(--emphasized-decel), opacity .2s linear; pointer-events:none; white-space:nowrap;
  }
  #toast.show { transform:translate(-50%,0); opacity:1; }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <h1 id="page-title">Vibely</h1>
    <button id="menu-btn" class="tap" aria-label="Opções"><ion-icon name="ellipsis-horizontal"></ion-icon></button>
  </div>

  <div id="main-content">

    <!-- INÍCIO -->
    <div id="view-home" class="view active">
      <div id="home-filters"></div>
      <div id="home-feed"></div>
      <div class="section" id="recent-section">
        <div class="section-head"><div class="section-title">Recentes</div></div>
        <div id="recent-list"></div>
      </div>
    </div>

    <!-- PESQUISAR -->
    <div id="view-search" class="view">
      <div id="search-head">
        <div id="search-title">Pesquisar</div>
        <div id="search-wrap">
          <ion-icon name="search"></ion-icon>
          <input type="text" id="search-input" placeholder="O que queres ouvir?" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" inputmode="search"/>
          <button id="search-clear" class="tap" aria-label="Limpar"><ion-icon name="close"></ion-icon></button>
        </div>
      </div>
      <div id="search-browse">
        <div id="cat-title">Procurar tudo</div>
        <div id="cat-grid"></div>
      </div>
      <div id="results-list"></div>
    </div>

    <!-- PLAYLISTS -->
    <div id="view-playlists" class="view">
      <div id="pl-list-view">
        <div id="pl-head">
          <div class="section-title">Playlists</div>
          <button id="pl-add" class="tap" aria-label="Nova playlist"><ion-icon name="add"></ion-icon></button>
        </div>
        <div id="pl-list"></div>
      </div>
      <div id="pl-detail-view" style="display:none">
        <div id="pl-detail-head">
          <button id="pl-back" class="tap" aria-label="Voltar"><ion-icon name="arrow-back"></ion-icon></button>
          <div id="pl-detail-name"></div>
          <button id="pl-detail-menu" class="tap" aria-label="Opções"><ion-icon name="ellipsis-vertical"></ion-icon></button>
        </div>
        <div id="pl-detail-actions">
          <div id="pl-detail-count"></div>
          <button id="pl-play-all" class="tap"><ion-icon name="play"></ion-icon>Tocar</button>
        </div>
        <div id="pl-tracks"></div>
      </div>
    </div>

  </div>

  <!-- mini player -->
  <div id="mini-player">
    <div id="mini-tint"></div>
    <div id="mini-progress"></div>
    <div class="disc spin" id="mini-disc"><img id="mini-img" src="" alt=""/></div>
    <div id="mini-info">
      <div id="mini-title">—</div>
      <div id="mini-artist">—</div>
    </div>
    <div class="mini-ctrl">
      <button class="mini-btn tap" id="mini-play" aria-label="Tocar/Pausar"><ion-icon name="play"></ion-icon></button>
      <button class="mini-btn tap" id="mini-next" aria-label="Próxima"><ion-icon name="play-forward"></ion-icon></button>
    </div>
  </div>

  <!-- bottom bar -->
  <div id="bottom-bar">
    <div id="bb-pill"></div>
    <button class="bb-item active" data-tab="home"><ion-icon name="home"></ion-icon><span>Início</span></button>
    <button class="bb-item" data-tab="search"><ion-icon name="search"></ion-icon><span>Pesquisar</span></button>
    <button class="bb-item" data-tab="playlists"><ion-icon name="albums"></ion-icon><span>Playlists</span></button>
  </div>

  <!-- modal do player -->
  <div id="now-playing">
    <div id="np-bg"></div>
    <div id="np-grab"></div>
    <div id="np-top">
      <button class="np-round tap" id="np-close" aria-label="Fechar"><ion-icon name="chevron-down"></ion-icon></button>
      <div class="np-label">A tocar agora</div>
      <button class="np-round tap" id="np-more" aria-label="Mais"><ion-icon name="ellipsis-horizontal"></ion-icon></button>
    </div>
    <div id="np-stage">
      <div class="disc spin" id="np-disc"><img id="np-img" src="" alt=""/></div>
    </div>
    <div id="np-meta">
      <div id="np-title">—</div>
      <div id="np-artist">—</div>
    </div>
    <div id="np-seek">
      <div id="np-bar"><div id="np-bar-track"><div id="np-bar-fill"></div></div></div>
      <div id="np-times"><span id="np-cur">0:00</span><span id="np-tot">0:00</span></div>
    </div>
    <div id="np-controls">
      <button class="np-ctrl np-aux tap" id="np-shuffle" aria-label="Aleatório"><ion-icon name="shuffle"></ion-icon></button>
      <button class="np-ctrl tap" id="np-prev" aria-label="Anterior"><ion-icon name="play-back"></ion-icon></button>
      <button class="np-ctrl tap" id="np-play" aria-label="Tocar/Pausar"><ion-icon name="play"></ion-icon></button>
      <button class="np-ctrl tap" id="np-next" aria-label="Próxima"><ion-icon name="play-forward"></ion-icon></button>
      <button class="np-ctrl np-aux tap" id="np-repeat" aria-label="Repetir"><ion-icon name="repeat"></ion-icon></button>
    </div>
    <div id="np-extra">
      <div id="np-vol">
        <ion-icon name="volume-low"></ion-icon>
        <div id="np-vol-bar"><div id="np-vol-track"><div id="np-vol-fill"></div></div></div>
        <ion-icon name="volume-high"></ion-icon>
      </div>
    </div>
  </div>

  <!-- popup de opções -->
  <div id="menu-overlay">
    <div id="menu-pop">
      <button class="menu-item" id="mi-theme"><ion-icon name="moon"></ion-icon><span class="grow" id="mi-theme-label">Tema escuro</span></button>
      <button class="menu-item" id="mi-dominant"><ion-icon name="color-palette"></ion-icon><span class="grow">Cor dominante geral</span><div class="switch" id="sw-dominant"></div></button>
      <button class="menu-item" id="mi-player"><ion-icon name="expand"></ion-icon><span class="grow">Abrir player</span></button>
      <div class="menu-sep"></div>
      <button class="menu-item danger" id="mi-clear"><ion-icon name="trash"></ion-icon><span class="grow">Limpar recentes</span></button>
    </div>
  </div>

  <!-- bottom sheet -->
  <div id="sheet-overlay">
    <div id="sheet">
      <div id="sheet-handle"></div>
      <div id="sheet-content"></div>
    </div>
  </div>

  <!-- diálogo -->
  <div id="dialog-overlay">
    <div id="dialog">
      <h3 id="dialog-title">Nova playlist</h3>
      <input id="dialog-input" type="text" placeholder="Nome da playlist" autocomplete="off" maxlength="60"/>
      <div id="dialog-actions">
        <button class="dlg-btn" id="dialog-cancel">Cancelar</button>
        <button class="dlg-btn" id="dialog-ok">Guardar</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
const BASE = 'http://localhost:8080';
const isApp = typeof Android !== 'undefined' && Android.isInsideApp();
const $ = id => document.getElementById(id);

const LOADER_HTML = '<div class="loader"><svg viewBox="25 25 50 50"><circle cx="50" cy="50" r="20"/></svg></div>';
const BTN_LOADER_HTML = '<svg class="btn-loader" viewBox="25 25 50 50"><circle cx="50" cy="50" r="20"/></svg>';

const DEFAULT_ACCENT = [37, 150, 190];

// ─── ESTADO GLOBAL ───────────────────────────────────────
let dark = false;
let dominantMode = localStorage.getItem('dominant') === '1';
let albumRgb = null;          // cor extraída do álbum atual
let currentTrack = null;
let currentQueue = [];
let currentQueueIndex = 0;

// ─── COR PRIMÁRIA (fixa #2596be ou dominante do álbum) ───
function setAccent(rgbArr) {
  const [r, g, b] = rgbArr;
  const root = document.documentElement.style;
  root.setProperty('--accent', `rgb(${r},${g},${b})`);
  root.setProperty('--accent-rgb', `${r},${g},${b}`);
  root.setProperty('--accent-container', `rgba(${r},${g},${b},${dark ? 0.24 : 0.16})`);
  // texto sobre a cor primária: escuro se a cor for muito clara
  const lum = 0.299 * r + 0.587 * g + 0.114 * b;
  root.setProperty('--on-accent', lum > 175 ? '#111111' : '#FFFFFF');
}

// Na cor dominante, escurece/clareia um pouco para manter contraste em cada tema
function adaptForTheme(c) {
  const lum = 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];
  if (dark && lum < 110) return c.map(v => Math.min(255, Math.round(v + (110 - lum) * 1.3)));
  if (!dark && lum > 190) return c.map(v => Math.round(v * 0.72));
  return c;
}

function refreshAccent() {
  if (dominantMode && albumRgb) setAccent(adaptForTheme(albumRgb));
  else setAccent(DEFAULT_ACCENT);
}

// ─── TEMA ────────────────────────────────────────────────
function applyTheme(d, notifyNative = true) {
  dark = d;
  document.documentElement.setAttribute('data-theme', d ? 'dark' : '');
  $('mi-theme').querySelector('ion-icon').setAttribute('name', d ? 'sunny' : 'moon');
  $('mi-theme-label').textContent = d ? 'Tema claro' : 'Tema escuro';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', d ? '#0D0D0D' : '#FFFFFF');
  localStorage.setItem('theme', d ? 'dark' : 'light');
  refreshAccent();
  if (notifyNative && isApp && typeof Android.setStatusBarTheme === 'function') {
    Android.setStatusBarTheme(!d);
  }
}
applyTheme(localStorage.getItem('theme') === 'dark');

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') applyTheme(dark);
});

function syncDominantSwitch() {
  $('sw-dominant').classList.toggle('on', dominantMode);
}
syncDominantSwitch();

// ─── TOAST ───────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ─── MENU POPUP ──────────────────────────────────────────
const menuOverlay = $('menu-overlay');
function openMenu() { menuOverlay.classList.add('open'); }
function closeMenu() { menuOverlay.classList.remove('open'); }
$('menu-btn').addEventListener('click', openMenu);
menuOverlay.addEventListener('click', e => { if (e.target === menuOverlay) closeMenu(); });

$('mi-theme').addEventListener('click', () => { applyTheme(!dark); closeMenu(); });
$('mi-dominant').addEventListener('click', () => {
  dominantMode = !dominantMode;
  localStorage.setItem('dominant', dominantMode ? '1' : '0');
  syncDominantSwitch();
  refreshAccent();
  if (dominantMode && !albumRgb) toast('A cor será aplicada quando tocares uma música');
});
$('mi-player').addEventListener('click', () => {
  closeMenu();
  if (currentTrack) openNowPlaying(); else toast('Nenhuma música a tocar');
});
$('mi-clear').addEventListener('click', () => {
  localStorage.removeItem('recents');
  renderRecents();
  closeMenu();
  toast('Recentes limpos');
});

// ─── BOTTOM SHEET ────────────────────────────────────────
const sheetOverlay = $('sheet-overlay');
function openSheet(html) {
  $('sheet-content').innerHTML = html;
  sheetOverlay.classList.add('open');
}
function closeSheet() { sheetOverlay.classList.remove('open'); }
sheetOverlay.addEventListener('click', e => { if (e.target === sheetOverlay) closeSheet(); });

function sheetItem(id, icon, label, danger) {
  return `<button class="menu-item${danger ? ' danger' : ''}" data-act="${id}"><ion-icon name="${icon}"></ion-icon><span class="grow">${label}</span></button>`;
}

// ─── DIÁLOGO DE TEXTO ────────────────────────────────────
const dialogOverlay = $('dialog-overlay');
let dialogCb = null;
function openDialog(title, value, okLabel, cb) {
  $('dialog-title').textContent = title;
  $('dialog-input').value = value || '';
  $('dialog-ok').textContent = okLabel || 'Guardar';
  dialogCb = cb;
  dialogOverlay.classList.add('open');
  setTimeout(() => $('dialog-input').focus(), 200);
}
function closeDialog() { dialogOverlay.classList.remove('open'); $('dialog-input').blur(); }
$('dialog-cancel').addEventListener('click', closeDialog);
dialogOverlay.addEventListener('click', e => { if (e.target === dialogOverlay) closeDialog(); });
$('dialog-ok').addEventListener('click', () => {
  const v = $('dialog-input').value.trim();
  if (!v) return;
  const cb = dialogCb;
  closeDialog();
  if (cb) cb(v);
});
$('dialog-input').addEventListener('keydown', e => { if (e.key === 'Enter') $('dialog-ok').click(); });

// ─── NAVEGAÇÃO (bottom bar com pill) ─────────────────────
const bbItems = [...document.querySelectorAll('.bb-item')];
const views = document.querySelectorAll('.view');
const bbPill = $('bb-pill');
let activeTab = 'home';

function movePill(index) {
  const item = bbItems[index];
  bbPill.style.width = item.offsetWidth + 'px';
  bbPill.style.transform = `translateX(${item.offsetLeft - 6}px)`;
}

function switchTab(tab) {
  activeTab = tab;
  const index = bbItems.findIndex(b => b.dataset.tab === tab);
  bbItems.forEach(t => t.classList.remove('active'));
  views.forEach(v => v.classList.remove('active'));
  bbItems[index].classList.add('active');
  $('view-' + tab).classList.add('active');
  $('main-content').scrollTop = 0;
  movePill(index);
  $('page-title').style.opacity = tab === 'home' ? '1' : '0';
  if (tab === 'playlists') showPlaylistList();
}
bbItems.forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
window.addEventListener('resize', () => movePill(bbItems.findIndex(b => b.classList.contains('active'))));
window.addEventListener('load', () => movePill(0));
setTimeout(() => movePill(0), 60);

// ─── RECENTES ────────────────────────────────────────────
function getRecents() {
  try { return JSON.parse(localStorage.getItem('recents') || '[]'); } catch { return []; }
}
function addRecent(track) {
  let r = getRecents().filter(t => t.id !== track.id);
  r.unshift(track);
  r = r.slice(0, 20);
  localStorage.setItem('recents', JSON.stringify(r));
}
function renderRecents() {
  const list = $('recent-list');
  const recents = getRecents();
  $('recent-section').style.display = recents.length ? 'block' : 'none';
  if (!recents.length) { list.innerHTML = ''; return; }
  bindTrackList(list, recents, () => recents, { source: 'recents' });
}

// ─── LISTA DE MÚSICAS (formato plano dos resultados) ─────
function trackRowHTML(t, i) {
  return `
    <div class="track-row" style="animation-delay:${Math.min(i, 8) * 30}ms">
      <img class="tr-thumb" src="${t.thumbnail}" loading="lazy" onerror="this.style.visibility='hidden'"/>
      <div class="tr-info">
        <div class="tr-title">${esc(t.title)}</div>
        <div class="tr-sub">Música • ${esc(t.artist)}</div>
      </div>
      <button class="tr-more tap" aria-label="Mais"><ion-icon name="ellipsis-vertical"></ion-icon></button>
    </div>
  `;
}

function bindTrackList(container, data, getQueue, opts) {
  opts = opts || {};
  container.innerHTML = data.map((t, i) => trackRowHTML(t, i)).join('');
  container.querySelectorAll('.track-row').forEach((el, i) => {
    el.addEventListener('click', () => { currentQueue = getQueue(); play(data[i], i); });
    el.querySelector('.tr-more').addEventListener('click', e => {
      e.stopPropagation();
      openTrackSheet(data[i], opts.source === 'playlist' ? { playlistId: opts.playlistId } : null);
    });
  });
  markPlaying();
}

function markPlaying() {
  document.querySelectorAll('.track-row').forEach(el => el.classList.remove('playing'));
}

// ─── SHEET DE AÇÕES DE UMA MÚSICA ────────────────────────
function openTrackSheet(track, ctx) {
  let html = `
    <div id="sheet-head">
      <img src="${track.thumbnail}" onerror="this.style.visibility='hidden'"/>
      <div style="min-width:0;flex:1">
        <div class="sh-t">${esc(track.title)}</div>
        <div class="sh-s">${esc(track.artist)}</div>
      </div>
    </div>
    ${sheetItem('play', 'play', 'Tocar agora')}
    ${sheetItem('next', 'play-skip-forward', 'Tocar a seguir')}
    ${sheetItem('addpl', 'add-circle-outline', 'Adicionar à playlist')}
  `;
  if (ctx && ctx.playlistId) html += sheetItem('rmpl', 'remove-circle-outline', 'Remover desta playlist', true);
  openSheet(html);

  $('sheet-content').querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.act;
      if (act === 'play') { closeSheet(); currentQueue = [track]; play(track, 0); }
      else if (act === 'next') { closeSheet(); queueNext(track); }
      else if (act === 'addpl') { openPlaylistPicker(track); }
      else if (act === 'rmpl') { closeSheet(); removeFromPlaylist(ctx.playlistId, track.id); }
    });
  });
}

function queueNext(track) {
  if (!currentTrack) { currentQueue = [track]; play(track, 0); return; }
  currentQueue = currentQueue.filter(t => t.id !== track.id);
  const idx = currentQueue.findIndex(t => t.id === currentTrack.id);
  currentQueueIndex = idx >= 0 ? idx : 0;
  currentQueue.splice(currentQueueIndex + 1, 0, track);
  toast('Vai tocar a seguir');
}

// ─── PLAYLISTS (guardadas em localStorage) ───────────────
function getPlaylists() {
  try { return JSON.parse(localStorage.getItem('playlists') || '[]'); } catch { return []; }
}
function savePlaylists(p) { localStorage.setItem('playlists', JSON.stringify(p)); }

let openPlaylistId = null;

function coverHTML(pl) {
  const imgs = pl.tracks.map(t => t.thumbnail).filter(Boolean);
  if (!imgs.length) return `<div class="pl-cover"><ion-icon name="musical-notes"></ion-icon></div>`;
  if (imgs.length < 4) return `<div class="pl-cover"><img class="full" src="${imgs[0]}" onerror="this.style.visibility='hidden'"/></div>`;
  return `<div class="pl-cover">${imgs.slice(0, 4).map(s => `<img src="${s}" onerror="this.style.visibility='hidden'"/>`).join('')}</div>`;
}

function renderPlaylistList() {
  const list = $('pl-list');
  const pls = getPlaylists();
  list.innerHTML = pls.map((pl, i) => `
    <div class="pl-row" data-id="${pl.id}" style="animation-delay:${Math.min(i, 8) * 30}ms">
      ${coverHTML(pl)}
      <div class="pl-info">
        <div class="pl-name">${esc(pl.name)}</div>

// ─── COR DOMINANTE DO ÁLBUM ──────────────────────────────
function hashColor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h % 360;
}
function hslToRgb(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
}

function extractDominant(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = c.height = 24;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, 24, 24);
        const px = ctx.getImageData(0, 0, 24, 24).data;
        const buckets = {};
        for (let i = 0; i < px.length; i += 4) {
          const r = px[i], g = px[i + 1], b = px[i + 2];
          const max = Math.max(r, g, b), min = Math.min(r, g, b);
          const sat = max === 0 ? 0 : (max - min) / max;
          if (max < 40 || min > 225 || sat < 0.22) continue;
          const key = (r >> 5) + ',' + (g >> 5) + ',' + (b >> 5);
          const w = 1 + sat * 2;
          if (!buckets[key]) buckets[key] = { n: 0, r: 0, g: 0, b: 0 };
          buckets[key].n += w; buckets[key].r += r * w; buckets[key].g += g * w; buckets[key].b += b * w;
        }
        let best = null;
        for (const k in buckets) if (!best || buckets[k].n > best.n) best = buckets[k];
        if (!best) return resolve(null);
        resolve([Math.round(best.r / best.n), Math.round(best.g / best.n), Math.round(best.b / best.n)]);
      } catch (e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

function shade([r, g, b], f) { return [Math.round(r * f), Math.round(g * f), Math.round(b * f)]; }
const rgb = a => `rgb(${a[0]},${a[1]},${a[2]})`;

async function applyAlbumColor(track) {
  let base = track.thumbnail ? await extractDominant(track.thumbnail) : null;
  if (!base) base = hslToRgb(hashColor(track.id || track.title || 'x'), 62, 52);
  const lum = 0.299 * base[0] + 0.587 * base[1] + 0.114 * base[2];
  if (lum < 70) base = base.map(v => Math.min(255, Math.round(v + (70 - lum) * 1.4)));
  albumRgb = base;
  const root = document.documentElement.style;
  root.setProperty('--np-c1', rgb(base));
  root.setProperty('--np-c2', rgb(shade(base, 0.62)));
  refreshAccent();
}

// ─── PLAYER ──────────────────────────────────────────────
let audio = new Audio();
audio.preload = 'auto';
let shuffleOn = false;
let repeatMode = 0;
let playToken = 0;
let retryCount = 0;
const MAX_RETRIES = 3;

const miniPlayer = $('mini-player');
const nowPlaying = $('now-playing');

function setPlayIcon(name) {
  const html = name === 'loading' ? BTN_LOADER_HTML : `<ion-icon name="${name}"></ion-icon>`;
  $('mini-play').innerHTML = html;
  $('np-play').innerHTML = html;
}
function setSpinning(on) {
  document.querySelectorAll('.spin').forEach(el => el.classList.toggle('running', on));
  nowPlaying.classList.toggle('playing', on);
}

async function play(track, queueIndex) {
  if (!isApp) { toast('Player só disponível no app Vibely'); return; }

  const token = ++playToken;
  retryCount = 0;
  currentTrack = track;
  if (queueIndex !== undefined) currentQueueIndex = queueIndex;

  $('mini-title').textContent = track.title || '—';
  $('mini-artist').textContent = track.artist || '—';
  $('np-title').textContent = track.title || '—';
  $('np-artist').textContent = track.artist || '—';
  $('mini-img').src = track.thumbnail || '';
  $('np-img').src = track.thumbnail || '';
  miniPlayer.classList.add('active');
  setPlayIcon('loading');
  $('mini-progress').style.width = '0%';
  $('np-bar-fill').style.width = '0%';
  $('np-cur').textContent = '0:00';
  $('np-tot').textContent = fmtTime(track.duration || 0);

  addRecent(track);
  renderRecents();
  updateMediaSession(track);
  applyAlbumColor(track);

  await startStream(track, token);
}

async function startStream(track, token) {
  try {
    const res = await fetch(BASE + '/stream?id=' + encodeURIComponent(track.id));
    const { streamUrl } = await res.json();
    if (token !== playToken) return;
    if (!streamUrl) throw new Error('sem stream');
    audio.pause();
    audio.src = streamUrl;
    audio.load();
    await audio.play();
  } catch (e) {
    if (token !== playToken) return;
    console.error('Erro stream:', e);
    retryOrFail(token);
  }
}

function retryOrFail(token) {
  if (token !== playToken || !currentTrack) return;
  if (retryCount >= MAX_RETRIES) {
    setPlayIcon('play');
    setSpinning(false);
    toast('Não foi possível tocar esta faixa');
    return;
  }
  retryCount++;
  const resumeAt = audio.currentTime || 0;
  setPlayIcon('loading');
  setTimeout(async () => {
    if (token !== playToken) return;
    try {
      const res = await fetch(BASE + '/stream?id=' + encodeURIComponent(currentTrack.id));
      const { streamUrl } = await res.json();
      if (token !== playToken || !streamUrl) return;
      audio.src = streamUrl;
      audio.load();
      if (resumeAt > 0) {
        audio.addEventListener('loadedmetadata', function once() {
          audio.removeEventListener('loadedmetadata', once);
          try { audio.currentTime = resumeAt; } catch (_) {}
        });
      }
      await audio.play();
    } catch (e) { retryOrFail(token); }
  }, 800 * retryCount);
}

function nextTrack(auto) {
  if (!currentQueue.length) return;
  if (auto && repeatMode === 2) { audio.currentTime = 0; audio.play(); return; }
  if (shuffleOn && currentQueue.length > 1) {
    let n;
    do { n = Math.floor(Math.random() * currentQueue.length); } while (n === currentQueueIndex);
    currentQueueIndex = n;
  } else {
    if (auto && repeatMode === 0 && currentQueueIndex === currentQueue.length - 1) {
      setPlayIcon('play'); setSpinning(false); return;
    }
    currentQueueIndex = (currentQueueIndex + 1) % currentQueue.length;
  }
  play(currentQueue[currentQueueIndex], currentQueueIndex);
}

function prevTrack() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (!currentQueue.length) return;
  currentQueueIndex = (currentQueueIndex - 1 + currentQueue.length) % currentQueue.length;
  play(currentQueue[currentQueueIndex], currentQueueIndex);
}

function togglePlay() {
  if (!currentTrack) return;
  if (audio.paused) audio.play().catch(() => retryOrFail(playToken));
  else audio.pause();
}

$('mini-play').addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
$('mini-next').addEventListener('click', e => { e.stopPropagation(); nextTrack(false); });
$('np-play').addEventListener('click', togglePlay);
$('np-next').addEventListener('click', () => nextTrack(false));
$('np-prev').addEventListener('click', prevTrack);

$('np-shuffle').addEventListener('click', () => {
  shuffleOn = !shuffleOn;
  $('np-shuffle').classList.toggle('on', shuffleOn);
  toast(shuffleOn ? 'Aleatório ligado' : 'Aleatório desligado');
});
$('np-repeat').addEventListener('click', () => {
  repeatMode = (repeatMode + 1) % 3;
  $('np-repeat').classList.toggle('on', repeatMode > 0);
  toast(['Repetir desligado', 'Repetir fila', 'Repetir esta faixa'][repeatMode]);
});

audio.addEventListener('play', () => { setPlayIcon('pause'); setSpinning(true); });
audio.addEventListener('playing', () => { retryCount = 0; setPlayIcon('pause'); setSpinning(true); });
audio.addEventListener('pause', () => { if (!audio.ended) { setPlayIcon('play'); setSpinning(false); } });
audio.addEventListener('waiting', () => setPlayIcon('loading'));
audio.addEventListener('stalled', () => {
  const token = playToken;
  setTimeout(() => {
    if (token === playToken && audio.readyState < 3 && !audio.paused) retryOrFail(token);
  }, 6000);
});
audio.addEventListener('error', () => retryOrFail(playToken));
audio.addEventListener('ended', () => nextTrack(true));

let scrubbing = false;
audio.addEventListener('timeupdate', () => {
  if (!audio.duration || !isFinite(audio.duration)) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  $('mini-progress').style.width = pct + '%';
  if (!scrubbing) $('np-bar-fill').style.width = pct + '%';
  $('np-cur').textContent = fmtTime(Math.floor(audio.currentTime));
  $('np-tot').textContent = fmtTime(Math.floor(audio.duration));
});

function bindSlider(bar, onChange, onStart, onEnd) {
  const getPct = e => {
    const r = bar.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    return Math.min(1, Math.max(0, (x - r.left) / r.width));
  };
  let down = false;
  const start = e => { down = true; bar.classList.add('active'); onStart && onStart(); onChange(getPct(e)); e.preventDefault(); e.stopPropagation(); };
  const move = e => { if (!down) return; onChange(getPct(e)); e.preventDefault(); e.stopPropagation(); };
  const end = () => { if (!down) return; down = false; bar.classList.remove('active'); onEnd && onEnd(); };
  bar.addEventListener('touchstart', start, { passive: false });
  bar.addEventListener('touchmove', move, { passive: false });
  bar.addEventListener('touchend', end);
  bar.addEventListener('mousedown', start);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
}

let seekPct = 0;
bindSlider($('np-bar'),
  pct => { seekPct = pct; $('np-bar-fill').style.width = (pct * 100) + '%'; },
  () => { scrubbing = true; },
  () => {
    scrubbing = false;
    if (audio.duration && isFinite(audio.duration)) audio.currentTime = seekPct * audio.duration;
  }
);
bindSlider($('np-vol-bar'), pct => {
  audio.volume = pct;
  $('np-vol-fill').style.width = (pct * 100) + '%';
});

// ─── MODAL DO PLAYER ─────────────────────────────────────
function openNowPlaying() {
  if (!currentTrack) return;
  nowPlaying.classList.add('open');
  $('bottom-bar').style.transform = 'translate(-50%, 140px)';
  $('bottom-bar').style.opacity = '0';
  miniPlayer.style.transform = 'translateY(140px)';
  miniPlayer.style.opacity = '0';
}
function closeNowPlaying() {
  nowPlaying.style.transform = '';
  nowPlaying.classList.remove('open');
  $('bottom-bar').style.transform = '';
  $('bottom-bar').style.opacity = '';
  miniPlayer.style.transform = '';
  miniPlayer.style.opacity = '';
}
miniPlayer.addEventListener('click', openNowPlaying);
$('np-close').addEventListener('click', closeNowPlaying);
$('np-more').addEventListener('click', () => { if (currentTrack) openTrackSheet(currentTrack, null); });

(function () {
  let startY = 0, dy = 0, dragging = false;
  const isInteractive = t => t.closest('#np-bar, #np-vol-bar, button');
  nowPlaying.addEventListener('touchstart', e => {
    if (isInteractive(e.target)) return;
    startY = e.touches[0].clientY; dy = 0; dragging = true;
    nowPlaying.classList.add('dragging');
  }, { passive: true });
  nowPlaying.addEventListener('touchmove', e => {
    if (!dragging) return;
    dy = Math.max(0, e.touches[0].clientY - startY);
    nowPlaying.style.transform = `translateY(${dy}px)`;
    nowPlaying.style.borderRadius = Math.min(28, dy / 4) + 'px ' + Math.min(28, dy / 4) + 'px 0 0';
  }, { passive: true });
  nowPlaying.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    nowPlaying.classList.remove('dragging');
    nowPlaying.style.borderRadius = '';
    if (dy > 140) closeNowPlaying();
    else nowPlaying.style.transform = '';
  });
})();

// ─── NOTIFICAÇÃO DE MÍDIA ────────────────────────────────
function updateMediaSession(track) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.title || '',
    artist: track.artist || '',
    artwork: track.thumbnail ? [{ src: track.thumbnail, sizes: '512x512', type: 'image/jpeg' }] : []
  });
}
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
  navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack(false));
  navigator.mediaSession.setActionHandler('seekto', d => {
    if (d.seekTime != null) audio.currentTime = d.seekTime;
  });
}

// ─── UTILS ───────────────────────────────────────────────
function fmtTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60), sec = s % 60;
  return m + ':' + String(sec).padStart(2, '0');
}
function esc(str) {
  return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ─── INIT ────────────────────────────────────────────────
audio.volume = 1;
renderRecents();
renderHomeFilters();
loadHomeFeed();
</script>
