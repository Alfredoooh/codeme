<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, user-scalable=yes" />
<title>Documento</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --doc-bg: transparent;
    --page-bg: #FFFFFF;
    --page-text: #1A1A1A;
    --page-border: #CCCCCC;
    --page-shadow: rgba(0,0,0,0.16);
    --selection: #2F7BF6;
    --page-number: #9A9A9A;
    --placeholder-bg: #F2F2F2;
    --placeholder-border: #CCCCCC;
    --table-border: #D0D0D0;
    --table-header-bg: rgba(47,123,246,0.10);
    --table-stripe-bg: rgba(0,0,0,0.03);
    --header-footer-text: #8A8A8E;
    --header-footer-border: #E4E4E6;
  }

  body.dark {
    --page-bg: #141414;
    --page-text: #F2F2F2;
    --page-border: #2A2A2C;
    --page-shadow: rgba(0,0,0,0.55);
    --selection: #0A84FF;
    --page-number: #6E6E73;
    --placeholder-bg: #1F1F1F;
    --placeholder-border: #3A3A3C;
    --table-border: #2A2A2C;
    --table-header-bg: rgba(10,132,255,0.12);
    --table-stripe-bg: rgba(255,255,255,0.03);
    --header-footer-text: #8E8E93;
    --header-footer-border: #262626;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent !important;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /*
   * O fundo por trás das folhas é sempre transparente. Quem decide
   * a cor que aparece atrás (pageBackground escuro/claro do
   * docs.dart) é o Flutter, não este HTML. Isto garante que nunca
   * há um "flash" de cor errada nem uma cor duplicada/dessincronizada
   * entre o WebView e o resto do ecrã.
   */
  #canvasScroll {
    position: relative;
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: none;
    touch-action: pan-y;
    padding: 20px 0 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: transparent;
  }

  #pagesStack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    transform-origin: top center;
  }

  .page-a4 {
    background: var(--page-bg);
    width: 794px;
    height: 1123px;
    padding: 96px 72px;
    border-radius: 0;
    border: 1px solid var(--page-border);
    box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 12px 32px var(--page-shadow);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    color: var(--page-text);
  }

  /* A folha em si nunca é transparente — só o fundo à sua volta.
     Isto garante que texto/tabelas/gráficos nunca ficam "vazados"
     contra o fundo do ecrã por trás. */
  .page-a4,
  .conteudo,
  .doc-header,
  .doc-footer {
    background-color: var(--page-bg);
  }

  .conteudo {
    flex: 1;
    min-height: 0;
    width: 100%;
    font-size: 15px;
    line-height: 1.6;
    color: inherit;
    outline: none;
    overflow: hidden;
    overflow-wrap: break-word;
    position: relative;
    -webkit-user-select: text;
    user-select: text;
  }
  .conteudo p { margin: 0; }
  .conteudo a { color: var(--selection); text-decoration: underline; }
  .conteudo img { max-width: 100%; height: auto; }

  /* ══════════════════════════════════════════════
     CABEÇALHO E RODAPÉ
     ══════════════════════════════════════════════ */

  .doc-header,
  .doc-footer {
    position: absolute;
    left: 72px;
    right: 72px;
    font-size: 11px;
    line-height: 1.4;
    color: var(--header-footer-text);
    outline: none;
    min-height: 18px;
    -webkit-user-select: text;
    user-select: text;
  }
  .doc-header {
    top: 40px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--header-footer-border);
  }
  .doc-footer {
    bottom: 40px;
    padding-top: 10px;
    border-top: 1px solid var(--header-footer-border);
  }
  .doc-header:empty::before,
  .doc-footer:empty::before {
    content: attr(data-placeholder);
    color: var(--header-footer-text);
    opacity: 0.55;
    pointer-events: none;
  }
  .doc-header.hidden,
  .doc-footer.hidden {
    display: none;
  }

  /* Espaço reservado ao conteúdo quando header/footer estão ativos,
     para nunca sobrepor texto. Aplicado via classe no .page-a4. */
  .page-a4.has-header { padding-top: 118px; }
  .page-a4.has-footer { padding-bottom: 118px; }

  .page-number {
    position: absolute;
    bottom: 14px;
    right: 0;
    left: 0;
    text-align: center;
    font-size: 10px;
    color: var(--page-number);
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .page-number.hidden {
    display: none;
  }
  /* Quando há rodapé visível, o número de página sobe para não colidir */
  .page-a4.has-footer .page-number {
    bottom: 14px;
  }

  /* ══════════════════════════════════════════════
     TABELAS — suporte a header / bordas / listras
     ══════════════════════════════════════════════ */

  .doc-table { border-collapse: collapse; width: 100%; margin: 4px 0; }
  .doc-table td, .doc-table th {
    border: 1px solid var(--table-border);
    padding: 8px;
    min-width: 32px;
    height: 26px;
    vertical-align: top;
  }
  .doc-table.no-border td,
  .doc-table.no-border th {
    border-color: transparent;
  }
  .doc-table th {
    background: var(--table-header-bg);
    font-weight: 700;
    text-align: left;
  }
  .doc-table.striped tbody tr:nth-child(even) td {
    background: var(--table-stripe-bg);
  }
  .doc-table-wrap { position: relative; display: block; margin: 8px 0; }

  .doc-shape-wrap {
    position: relative;
    display: inline-block;
    margin: 8px 4px;
    vertical-align: middle;
  }
  .doc-shape-wrap.shape-selected {
    outline: 2px solid var(--selection);
    outline-offset: 2px;
  }
  .doc-shape-rect { border-radius: 4px; }
  .doc-shape-circle { border-radius: 50%; }
  .doc-shape-line { height: 3px !important; border-radius: 2px; }
  .doc-shape-arrow-head {
    position: absolute;
    right: -2px;
    top: 50%;
    transform: translateY(-50%);
    width: 0;
    height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-left: 12px solid currentColor;
  }

  .resize-handle {
    position: absolute;
    right: -6px;
    bottom: -6px;
    width: 16px;
    height: 16px;
    background: var(--selection);
    border: 2px solid #FFFFFF;
    border-radius: 50%;
    cursor: nwse-resize;
    display: none;
  }
  .doc-shape-wrap.shape-selected .resize-handle,
  .doc-img-wrap.img-selected .resize-handle,
  .doc-chart-wrap.chart-selected .resize-handle {
    display: block;
  }

  .doc-img-wrap {
    position: relative;
    display: inline-block;
    margin: 6px 0;
    max-width: 100%;
  }
  .doc-img-wrap img {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: 2px;
  }
  .doc-img-wrap.img-selected img {
    outline: 2px solid var(--selection);
    outline-offset: 2px;
  }
  .doc-img-wrap img.img-broken {
    min-height: 60px;
    background: var(--placeholder-bg);
    border: 1px dashed var(--placeholder-border);
  }

  .doc-chart-wrap {
    position: relative;
    display: block;
    margin: 10px 0;
    width: 480px;
    height: 300px;
    max-width: 100%;
  }
  .doc-chart-wrap canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }
  .doc-chart-wrap.chart-selected {
    outline: 2px solid var(--selection);
    outline-offset: 2px;
  }

  body.preview-mode #canvasScroll {
    overflow: hidden;
    pointer-events: none;
    padding: 0;
    justify-content: flex-start;
    align-items: center;
  }
  body.preview-mode .page-a4 {
    box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 6px 16px var(--page-shadow);
  }
</style>
</head>
<body>

<div id="canvasScroll">
  <div id="pagesStack"></div>
</div>

<script>
(function () {
  'use strict';

  var PAGE_W = 794;
  var PAGE_H = 1123;

  var pagesStack = document.getElementById('pagesStack');
  var canvasScroll = document.getElementById('canvasScroll');

  var folhas = [];
  var nextFolhaId = 0;
  var fitScale = 1;
  var saveTimeout = null;
  var isRebalancing = false;
  var nextShapeId = 0;
  var nextChartId = 0;
  var selectedShapeEl = null;
  var selectedImgEl = null;
  var selectedChartEl = null;
  var chartInstances = {};
  var isPreviewMode = false;

  // ══════════════════════════════════════════════
  // ESTADO GLOBAL DE DOCUMENTO (header/footer/numeração)
  // ══════════════════════════════════════════════
  var docSettings = {
    showPageNumbers: true,
    showHeader: false,
    showFooter: false,
    headerHtml: '',
    footerHtml: ''
  };

  function detectarModoPreview() {
    try {
      var params = new URLSearchParams(window.location.search);
      isPreviewMode = params.get('preview') === '1';
    } catch (e) { isPreviewMode = false; }
    if (isPreviewMode) document.body.classList.add('preview-mode');
  }

  function ajustarZoom() {
    var margem = isPreviewMode ? 0 : 16;
    var larguraDisponivel = canvasScroll.clientWidth - margem;
    var escala = Math.min(larguraDisponivel / PAGE_W, 1);
    fitScale = (escala > 0 && isFinite(escala)) ? escala : 1;
    pagesStack.style.transform = 'scale(' + fitScale + ')';
  }

  function criarFolha() {
    var id = nextFolhaId++;
    var pageEl = document.createElement('div');
    pageEl.className = 'page-a4';
    pageEl.style.width = PAGE_W + 'px';
    pageEl.style.height = PAGE_H + 'px';

    var headerEl = document.createElement('div');
    headerEl.className = 'doc-header';
    headerEl.setAttribute('data-placeholder', 'Cabeçalho');
    headerEl.setAttribute('contenteditable', isPreviewMode ? 'false' : 'true');

    var contentEl = document.createElement('div');
    contentEl.className = 'conteudo';
    contentEl.setAttribute('contenteditable', isPreviewMode ? 'false' : 'true');
    contentEl.setAttribute('spellcheck', 'true');
    contentEl.innerHTML = '<p><br></p>';

    var footerEl = document.createElement('div');
    footerEl.className = 'doc-footer';
    footerEl.setAttribute('data-placeholder', 'Rodapé');
    footerEl.setAttribute('contenteditable', isPreviewMode ? 'false' : 'true');

    if (!isPreviewMode) {
      contentEl.addEventListener('input', handleInput);
      contentEl.addEventListener('paste', aoColar);
      contentEl.addEventListener('click', aoClicarNoConteudo);
      headerEl.addEventListener('input', aoEditarHeaderFooter);
      footerEl.addEventListener('input', aoEditarHeaderFooter);
      headerEl.addEventListener('paste', aoColarSimples);
      footerEl.addEventListener('paste', aoColarSimples);
    }

    var pageNumberEl = document.createElement('div');
    pageNumberEl.className = 'page-number';

    pageEl.appendChild(headerEl);
    pageEl.appendChild(contentEl);
    pageEl.appendChild(footerEl);
    pageEl.appendChild(pageNumberEl);
    pagesStack.appendChild(pageEl);

    var folha = {
      id: id,
      pageEl: pageEl,
      contentEl: contentEl,
      pageNumberEl: pageNumberEl,
      headerEl: headerEl,
      footerEl: footerEl
    };
    folhas.push(folha);
    aplicarConfigDocAFolha(folha);
    atualizarNumerosPagina();
    return folha;
  }

  function atualizarNumerosPagina() {
    for (var i = 0; i < folhas.length; i++) {
      folhas[i].pageNumberEl.textContent = String(i + 1);
      folhas[i].pageNumberEl.classList.toggle('hidden', !docSettings.showPageNumbers);
    }
  }

  function aplicarConfigDocAFolha(folha) {
    folha.headerEl.classList.toggle('hidden', !docSettings.showHeader);
    folha.footerEl.classList.toggle('hidden', !docSettings.showFooter);
    folha.pageEl.classList.toggle('has-header', docSettings.showHeader);
    folha.pageEl.classList.toggle('has-footer', docSettings.showFooter);
    if (folha.headerEl.innerHTML.trim() === '' && docSettings.headerHtml) {
      folha.headerEl.innerHTML = docSettings.headerHtml;
    }
    if (folha.footerEl.innerHTML.trim() === '' && docSettings.footerHtml) {
      folha.footerEl.innerHTML = docSettings.footerHtml;
    }
  }

  function aplicarConfigDocATodas() {
    for (var i = 0; i < folhas.length; i++) aplicarConfigDocAFolha(folhas[i]);
    atualizarNumerosPagina();
    setTimeout(reequilibrarDocumento, 0);
  }

  function aoEditarHeaderFooter(evento) {
    // O cabeçalho/rodapé é replicado em todas as páginas — editar
    // numa página atualiza o texto-modelo usado nas restantes e em
    // páginas futuras. Evita ecos infinitos comparando innerHTML.
    var el = evento.target;
    var isHeader = el.classList.contains('doc-header');
    var novoHtml = el.innerHTML;
    if (isHeader) docSettings.headerHtml = novoHtml;
    else docSettings.footerHtml = novoHtml;

    for (var i = 0; i < folhas.length; i++) {
      var alvo = isHeader ? folhas[i].headerEl : folhas[i].footerEl;
      if (alvo !== el && alvo.innerHTML !== novoHtml) alvo.innerHTML = novoHtml;
    }
    agendarGravacao();
  }

  function aoColarSimples(evento) {
    evento.preventDefault();
    var texto = evento.clipboardData ? evento.clipboardData.getData('text/plain') : '';
    document.execCommand('insertText', false, texto);
    aoEditarHeaderFooter(evento);
  }

  function getConteudoEl(idx) {
    return folhas[idx] ? folhas[idx].contentEl : null;
  }

  function normalizarFilhosSoltos(conteudo) {
    var noAtual = conteudo.firstChild;
    while (noAtual) {
      var proximo = noAtual.nextSibling;
      if (noAtual.nodeType === 3) {
        if (noAtual.textContent.trim() !== '') {
          var p = document.createElement('p');
          conteudo.insertBefore(p, noAtual);
          p.appendChild(noAtual);
        } else {
          conteudo.removeChild(noAtual);
        }
      }
      noAtual = proximo;
    }
    if (!conteudo.firstElementChild) {
      conteudo.innerHTML = '<p><br></p>';
    }
  }

  function obterOuCriarProximaPagina(idxAtual) {
    if (idxAtual + 1 < folhas.length) return idxAtual + 1;
    criarFolha();
    return idxAtual + 1;
  }

  function empurrarTransbordoDaPagina(idx) {
    var empurrouAlgo = false;
    var guarda = 0;
    var conteudo = getConteudoEl(idx);
    if (!conteudo) return false;

    while (conteudo.scrollHeight > conteudo.clientHeight + 1 && conteudo.children.length > 1 && guarda < 500) {
      var ultimoElemento = conteudo.lastElementChild;
      var proximoIdx = obterOuCriarProximaPagina(idx);
      var proximaConteudo = getConteudoEl(proximoIdx);
      if (!proximaConteudo) break;
      if (proximaConteudo.firstChild) proximaConteudo.insertBefore(ultimoElemento, proximaConteudo.firstChild);
      else proximaConteudo.appendChild(ultimoElemento);
      empurrouAlgo = true;
      guarda++;
      conteudo = getConteudoEl(idx);
    }
    return empurrouAlgo;
  }

  function puxarConteudoDaProximaPagina(idx) {
    if (idx + 1 >= folhas.length) return false;
    var conteudo = getConteudoEl(idx);
    var proximaConteudo = getConteudoEl(idx + 1);
    if (!conteudo || !proximaConteudo || !proximaConteudo.firstElementChild) return false;
    var puxouAlgo = false;
    var guarda = 0;
    while (proximaConteudo.firstElementChild && guarda < 500) {
      var candidato = proximaConteudo.firstElementChild;
      conteudo.appendChild(candidato);
      var causaOverflow = conteudo.scrollHeight > conteudo.clientHeight + 1;
      if (causaOverflow) {
        if (proximaConteudo.firstChild) proximaConteudo.insertBefore(candidato, proximaConteudo.firstChild);
        else proximaConteudo.appendChild(candidato);
        break;
      } else {
        puxouAlgo = true;
      }
      guarda++;
    }
    return puxouAlgo;
  }

  function removerPaginasVaziasNoFim() {
    for (var i = folhas.length - 1; i > 0; i--) {
      var conteudo = getConteudoEl(i);
      if (conteudo && conteudo.children.length === 0) {
        var folha = folhas.pop();
        folha.pageEl.remove();
      } else break;
    }
    atualizarNumerosPagina();
  }

  function obterPosicaoSelecao() {
    var selecao = window.getSelection();
    if (selecao.rangeCount === 0) return null;
    var range = selecao.getRangeAt(0);
    return { startContainer: range.startContainer, startOffset: range.startOffset, endContainer: range.endContainer, endOffset: range.endOffset };
  }

  function restaurarSelecao(posicao) {
    if (!posicao) return;
    if (!document.contains(posicao.startContainer)) return;
    try {
      var range = document.createRange();
      range.setStart(posicao.startContainer, posicao.startOffset);
      range.setEnd(posicao.endContainer, posicao.endOffset);
      var selecao = window.getSelection();
      selecao.removeAllRanges();
      selecao.addRange(range);
    } catch (erro) {}
  }

  function reequilibrarDocumento() {
    if (isRebalancing) return;
    isRebalancing = true;
    var posicaoSelecao = obterPosicaoSelecao();
    for (var i = 0; i < folhas.length; i++) normalizarFilhosSoltos(folhas[i].contentEl);
    var mudouEmpurrando = true;
    var guardaGeral = 0;
    while (mudouEmpurrando && guardaGeral < 100) {
      mudouEmpurrando = false;
      for (var j = 0; j < folhas.length; j++) if (empurrarTransbordoDaPagina(j)) mudouEmpurrando = true;
      guardaGeral++;
    }
    var mudouPuxando = true;
    var guardaPuxar = 0;
    while (mudouPuxando && guardaPuxar < 100) {
      mudouPuxando = false;
      for (var k = 0; k < folhas.length - 1; k++) if (puxarConteudoDaProximaPagina(k)) mudouPuxando = true;
      guardaPuxar++;
    }
    removerPaginasVaziasNoFim();
    restaurarSelecao(posicaoSelecao);
    isRebalancing = false;
  }

  var timeoutReequilibrio;
  function agendarReequilibrio() {
    clearTimeout(timeoutReequilibrio);
    timeoutReequilibrio = setTimeout(reequilibrarDocumento, 150);
  }

  function aoColar(evento) {
    evento.preventDefault();
    var htmlColado = evento.clipboardData ? evento.clipboardData.getData('text/html') : '';
    var textoColado = evento.clipboardData ? evento.clipboardData.getData('text/plain') : '';
    if (htmlColado) document.execCommand('insertHTML', false, htmlColado);
    else {
      var linhas = textoColado.split(/\n+/).filter(function (l) { return l.trim() !== ''; });
      var htmlParagrafos = linhas.map(function (l) { return '<p>' + l + '</p>'; }).join('');
      document.execCommand('insertHTML', false, htmlParagrafos || '<p>' + textoColado + '</p>');
    }
    handleInput();
  }

  function handleInput() {
    agendarReequilibrio();
    agendarGravacao();
  }

  function agendarGravacao() {
    if (isPreviewMode) return;
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(function () {
      var payload = getDocumentPayload();
      if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
        window.flutter_inappwebview.callHandler('saveDocument', payload);
      }
    }, 500);
  }

  /*
   * getContent() continua a devolver só o HTML das páginas (para
   * compatibilidade com quem já chama editorApi.getContent() a
   * pedir um docx/pdf). getDocumentPayload() devolve tudo — HTML +
   * config de header/footer/numeração — serializado como JSON, e é
   * o que é gravado internamente e o que setContent() sabe ler.
   */
  function getContent() {
    return folhas.map(function (f) { return f.contentEl.innerHTML; }).join('<div class="page-break-marker"></div>');
  }

  function getDocumentPayload() {
    return JSON.stringify({
      pagesHtml: folhas.map(function (f) { return f.contentEl.innerHTML; }),
      settings: {
        showPageNumbers: docSettings.showPageNumbers,
        showHeader: docSettings.showHeader,
        showFooter: docSettings.showFooter,
        headerHtml: docSettings.headerHtml,
        footerHtml: docSettings.footerHtml
      }
    });
  }

  function destruirTodosOsCharts() {
    Object.keys(chartInstances).forEach(function (id) { try { chartInstances[id].destroy(); } catch (e) {} });
    chartInstances = {};
  }

  function monitorizarErrosDeImagem(escopoEl) {
    var imgs = escopoEl.querySelectorAll('img:not([data-error-bound])');
    imgs.forEach(function (img) {
      img.setAttribute('data-error-bound', '1');
      img.addEventListener('error', function () { img.classList.add('img-broken'); });
    });
  }

  /*
   * setContent aceita três formatos, por ordem de prioridade:
   *  1) JSON produzido por getDocumentPayload() — { pagesHtml, settings }
   *  2) A string antiga com '<div class="page-break-marker"></div>'
   *     entre páginas (compatibilidade com documentos já gravados)
   *  3) HTML simples de uma única página
   */
  function setContent(raw) {
    destruirTodosOsCharts();
    folhas.forEach(function (f) { f.pageEl.remove(); });
    folhas = [];
    nextFolhaId = 0;
    selectedShapeEl = null;
    selectedImgEl = null;
    selectedChartEl = null;

    var pagesHtml = null;
    var parsedSettings = null;

    if (typeof raw === 'string' && raw.trim().charAt(0) === '{') {
      try {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.pagesHtml)) {
          pagesHtml = parsed.pagesHtml;
          parsedSettings = parsed.settings || null;
        }
      } catch (e) { /* não era JSON válido; cai para o formato antigo */ }
    }

    if (parsedSettings) {
      docSettings.showPageNumbers = parsedSettings.showPageNumbers !== false;
      docSettings.showHeader = !!parsedSettings.showHeader;
      docSettings.showFooter = !!parsedSettings.showFooter;
      docSettings.headerHtml = parsedSettings.headerHtml || '';
      docSettings.footerHtml = parsedSettings.footerHtml || '';
    }

    if (!pagesHtml) {
      var parts = (raw || '').split('<div class="page-break-marker"></div>');
      pagesHtml = parts.length ? parts : ['<p><br></p>'];
    }

    pagesHtml.forEach(function (h) {
      var folha = criarFolha();
      folha.contentEl.innerHTML = h || '<p><br></p>';
      monitorizarErrosDeImagem(folha.contentEl);
    });
    reativarHandlersDeFormasEImagens();
    reidratarGraficos();
    aplicarConfigDocATodas();
    reequilibrarDocumento();
  }

  function getActiveContentEl() {
    var sel = window.getSelection();
    if (sel && sel.rangeCount) {
      var node = sel.anchorNode;
      var base = node && node.nodeType === 3 ? node.parentElement : node;
      var conteudoPai = base && base.closest ? base.closest('.conteudo') : null;
      if (conteudoPai) return conteudoPai;
    }
    return folhas.length ? folhas[0].contentEl : null;
  }

  function focarSePreciso() {
    if (isPreviewMode) return;
    var el = getActiveContentEl();
    if (el && document.activeElement !== el) el.focus();
  }

  function exec(command) {
    focarSePreciso();
    switch (command) {
      case 'bold': document.execCommand('bold'); break;
      case 'italic': document.execCommand('italic'); break;
      case 'underline': document.execCommand('underline'); break;
      case 'strikethrough': document.execCommand('strikeThrough'); break;
      case 'alignLeft': document.execCommand('justifyLeft'); break;
      case 'alignCenter': document.execCommand('justifyCenter'); break;
      case 'alignRight': document.execCommand('justifyRight'); break;
      case 'alignJustify': document.execCommand('justifyFull'); break;
      case 'bulletList': document.execCommand('insertUnorderedList'); break;
      case 'numberedList': document.execCommand('insertOrderedList'); break;
      case 'indentIncrease': document.execCommand('indent'); break;
      case 'indentDecrease': document.execCommand('outdent'); break;
      case 'subscript': document.execCommand('subscript'); break;
      case 'superscript': document.execCommand('superscript'); break;
      case 'blockquote': aplicarCitacao(); break;
      case 'clearFormat': document.execCommand('removeFormat'); break;
      case 'undo': document.execCommand('undo'); break;
      case 'redo': document.execCommand('redo'); break;
    }
    handleInput();
  }

  function aplicarCitacao() {
    focarSePreciso();
    document.execCommand('formatBlock', false, 'blockquote');
  }

  function setFontSize(px) {
    focarSePreciso();
    document.execCommand('fontSize', false, '7');
    var fontElements = document.getElementsByTagName('font');
    for (var i = 0; i < fontElements.length; i++) {
      if (fontElements[i].size === '7') {
        fontElements[i].removeAttribute('size');
        fontElements[i].style.fontSize = px + 'px';
      }
    }
    handleInput();
  }

  function setColor(hexColor) {
    focarSePreciso();
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('foreColor', false, hexColor);
    handleInput();
  }

  function setHighlight(hexColor) {
    focarSePreciso();
    document.execCommand('styleWithCSS', false, true);
    if (!document.execCommand('hiliteColor', false, hexColor)) {
      document.execCommand('backColor', false, hexColor);
    }
    handleInput();
  }

  function clearHighlight() {
    focarSePreciso();
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('hiliteColor', false, 'transparent');
    handleInput();
  }

  /*
   * insertTable aceita:
   *  - insertTable(rows, cols)                          [compatibilidade antiga]
   *  - insertTable({rows, cols, header, bordered, striped}) [novo formato do docs.dart]
   */
  function insertTable(a, b) {
    focarSePreciso();
    var opts = (a && typeof a === 'object') ? a : { rows: a, cols: b };
    var r = Math.max(1, Math.min(20, opts.rows || 2));
    var c = Math.max(1, Math.min(10, opts.cols || 2));
    var comHeader = opts.header !== false && opts.header !== undefined ? !!opts.header : false;
    var comBordas = opts.bordered !== undefined ? !!opts.bordered : true;
    var comListras = !!opts.striped;

    var classes = 'doc-table';
    if (!comBordas) classes += ' no-border';
    if (comListras) classes += ' striped';

    var html = '<div class="doc-table-wrap" contenteditable="false"><table class="' + classes + '"><tbody>';
    var linhaInicial = 0;
    if (comHeader) {
      html += '<tr>';
      for (var ciH = 0; ciH < c; ciH++) html += '<th contenteditable="true"><br></th>';
      html += '</tr>';
      linhaInicial = 1;
    }
    for (var ri = linhaInicial; ri < r; ri++) {
      html += '<tr>';
      for (var ci = 0; ci < c; ci++) html += '<td contenteditable="true"><br></td>';
      html += '</tr>';
    }
    html += '</tbody></table></div><p><br></p>';
    document.execCommand('insertHTML', false, html);
    handleInput();
  }

  function insertImageAtCursor(url) {
    focarSePreciso();
    var html = '<span class="doc-img-wrap" contenteditable="false"><img src="' + url + '" /><div class="resize-handle"></div></span>&nbsp;';
    document.execCommand('insertHTML', false, html);
    handleInput();
    setTimeout(function () {
      reativarHandlersDeFormasEImagens();
      monitorizarErrosDeImagem(document.body);
    }, 30);
  }

  function insertLink(url, texto) {
    focarSePreciso();
    var label = texto && texto.trim() ? texto : url;
    var html = '<a href="' + url + '" target="_blank">' + label + '</a>&nbsp;';
    document.execCommand('insertHTML', false, html);
    handleInput();
  }

  function insertShape(shapeKind, hexColor) {
    focarSePreciso();
    var cor = hexColor || '#2F7BF6';
    var id = 'shape_' + (nextShapeId++);
    var w = shapeKind === 'line' ? 160 : 100;
    var h = shapeKind === 'line' ? 3 : 100;
    var extraClass = shapeKind === 'circle' ? 'doc-shape-circle' : shapeKind === 'line' ? 'doc-shape-line' : shapeKind === 'arrow' ? 'doc-shape-line' : 'doc-shape-rect';
    var innerArrow = shapeKind === 'arrow' ? '<div class="doc-shape-arrow-head" style="color:' + cor + '"></div>' : '';
    var html = '<span class="doc-shape-wrap" data-shape-id="' + id + '" data-shape-kind="' + shapeKind + '" contenteditable="false"><span class="' + extraClass + '" data-shape-body="1" style="display:block;width:' + w + 'px;height:' + h + 'px;background:' + cor + ';">' + innerArrow + '</span><span class="resize-handle"></span></span>&nbsp;';
    document.execCommand('insertHTML', false, html);
    handleInput();
    setTimeout(reativarHandlersDeFormasEImagens, 30);
  }

  function setSelectedShapeColor(hexColor) {
    if (!selectedShapeEl) return;
    var body = selectedShapeEl.querySelector('[data-shape-body]');
    if (body) body.style.background = hexColor;
    var arrowHead = selectedShapeEl.querySelector('.doc-shape-arrow-head');
    if (arrowHead) arrowHead.style.color = hexColor;
    agendarGravacao();
  }

  function deleteSelectedShape() {
    if (!selectedShapeEl) return;
    selectedShapeEl.remove();
    selectedShapeEl = null;
    handleInput();
  }

  function deleteSelectedImage() {
    if (!selectedImgEl) return;
    selectedImgEl.remove();
    selectedImgEl = null;
    handleInput();
  }

  function deleteSelectedChart() {
    if (!selectedChartEl) return;
    var id = selectedChartEl.getAttribute('data-chart-id');
    if (id && chartInstances[id]) { try { chartInstances[id].destroy(); } catch (e) {} delete chartInstances[id]; }
    selectedChartEl.remove();
    selectedChartEl = null;
    handleInput();
  }

  function escaparParaAtributo(str) {
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function desescaparDeAtributo(str) {
    var textarea = document.createElement('textarea');
    textarea.innerHTML = str;
    return textarea.value;
  }

  /*
   * insertChart aceita tanto uma config Chart.js "crua" (formato
   * antigo) como o novo formato de preset do docs.dart:
   *   {type, title, labels, values}
   * Neste segundo caso, é convertida aqui para uma config Chart.js
   * completa antes de desenhar.
   */
  function insertChart(chartConfigInput) {
    focarSePreciso();
    var id = 'chart_' + (nextChartId++);
    var configObj = normalizarConfigDeChart(chartConfigInput);
    var configStr = JSON.stringify(configObj);
    var html = '<div class="doc-chart-wrap" data-chart-id="' + id + '" data-chart-config="' + escaparParaAtributo(configStr) + '" contenteditable="false"><canvas></canvas><span class="resize-handle"></span></div><p><br></p>';
    document.execCommand('insertHTML', false, html);
    handleInput();
    setTimeout(function () {
      var wrap = document.querySelector('.doc-chart-wrap[data-chart-id="' + id + '"]');
      if (wrap) inicializarChartNoWrapper(wrap, id, configStr);
      reativarHandlersDeFormasEImagens();
    }, 30);
  }

  function normalizarConfigDeChart(input) {
    var parsed = input;
    if (typeof input === 'string') {
      try { parsed = JSON.parse(input); } catch (e) { parsed = null; }
    }
    if (!parsed) return { type: 'bar', data: { labels: [], datasets: [] } };

    // Já é uma config Chart.js completa (tem "data" com "datasets")
    if (parsed.data && parsed.data.datasets) return parsed;

    // Formato de preset do docs.dart: {type, title, labels, values}
    if (Array.isArray(parsed.labels) && Array.isArray(parsed.values)) {
      var chartType = parsed.type === 'donut' ? 'doughnut' : (parsed.type || 'bar');
      var isCircular = chartType === 'pie' || chartType === 'doughnut';
      var isScatter = chartType === 'scatter';
      var isArea = parsed.type === 'area';

      var dataset = {
        label: parsed.title || '',
        data: isScatter
          ? parsed.values.map(function (v, i) { return { x: i, y: v }; })
          : parsed.values,
        fill: isArea,
        tension: (chartType === 'line' || isArea) ? 0.35 : 0
      };

      return {
        type: isArea ? 'line' : (isScatter ? 'scatter' : chartType),
        data: {
          labels: isCircular || isScatter ? parsed.labels : parsed.labels,
          datasets: [dataset]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: isCircular },
            title: { display: !!parsed.title, text: parsed.title || '' }
          }
        }
      };
    }

    return parsed;
  }

  function inicializarChartNoWrapper(wrapEl, id, configStr) {
    var canvas = wrapEl.querySelector('canvas');
    if (!canvas || typeof Chart === 'undefined') return;
    var config;
    try { config = JSON.parse(configStr); } catch (e) { return; }
    if (chartInstances[id]) { try { chartInstances[id].destroy(); } catch (e) {} }
    try { chartInstances[id] = new Chart(canvas.getContext('2d'), config); } catch (e) {}
  }

  function reidratarGraficos() {
    var wraps = document.querySelectorAll('.doc-chart-wrap[data-chart-id]');
    wraps.forEach(function (wrap) {
      var id = wrap.getAttribute('data-chart-id');
      var configAttr = wrap.getAttribute('data-chart-config');
      if (!configAttr) return;
      var configStr = desescaparDeAtributo(configAttr);
      var numericPart = id.replace('chart_', '');
      var numeric = parseInt(numericPart, 10);
      if (!isNaN(numeric) && numeric >= nextChartId) nextChartId = numeric + 1;
      inicializarChartNoWrapper(wrap, id, configStr);
    });
  }

  function deselecionarTudo() {
    if (selectedShapeEl) { selectedShapeEl.classList.remove('shape-selected'); selectedShapeEl = null; }
    if (selectedImgEl) { selectedImgEl.classList.remove('img-selected'); selectedImgEl = null; }
    if (selectedChartEl) { selectedChartEl.classList.remove('chart-selected'); selectedChartEl = null; }
  }

  function aoClicarNoConteudo(evento) {
    var alvo = evento.target;
    var shapeWrap = alvo.closest ? alvo.closest('.doc-shape-wrap') : null;
    var imgWrap = alvo.closest ? alvo.closest('.doc-img-wrap') : null;
    var chartWrap = alvo.closest ? alvo.closest('.doc-chart-wrap') : null;
    if (shapeWrap) {
      evento.preventDefault();
      deselecionarTudo();
      selectedShapeEl = shapeWrap;
      shapeWrap.classList.add('shape-selected');
      if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
        window.flutter_inappwebview.callHandler('onShapeSelected', shapeWrap.getAttribute('data-shape-id'));
      }
      return;
    }
    if (imgWrap) {
      evento.preventDefault();
      deselecionarTudo();
      selectedImgEl = imgWrap;
      imgWrap.classList.add('img-selected');
      return;
    }
    if (chartWrap) {
      evento.preventDefault();
      deselecionarTudo();
      selectedChartEl = chartWrap;
      chartWrap.classList.add('chart-selected');
      return;
    }
    deselecionarTudo();
  }

  function reativarHandlersDeFormasEImagens() {
    var handles = document.querySelectorAll('.resize-handle');
    handles.forEach(function (handle) {
      if (handle.getAttribute('data-bound') === '1') return;
      handle.setAttribute('data-bound', '1');
      var arrastando = false, startX = 0, startY = 0, startW = 0, startH = 0, wrapEl = null, bodyEl = null, isChart = false, chartId = null;
      function pegarWrap() { return handle.closest('.doc-shape-wrap') || handle.closest('.doc-img-wrap') || handle.closest('.doc-chart-wrap'); }
      function posClient(evento) { return evento.touches && evento.touches.length ? { x: evento.touches[0].clientX, y: evento.touches[0].clientY } : { x: evento.clientX, y: evento.clientY }; }
      function aoIniciar(evento) {
        evento.preventDefault(); evento.stopPropagation();
        wrapEl = pegarWrap(); if (!wrapEl) return;
        isChart = wrapEl.classList.contains('doc-chart-wrap');
        if (isChart) { bodyEl = wrapEl; chartId = wrapEl.getAttribute('data-chart-id'); }
        else bodyEl = wrapEl.querySelector('[data-shape-body]') || wrapEl.querySelector('img');
        if (!bodyEl) return;
        arrastando = true;
        var pos = posClient(evento);
        startX = pos.x; startY = pos.y;
        startW = bodyEl.offsetWidth; startH = bodyEl.offsetHeight;
      }
      function aoMover(evento) {
        if (!arrastando || !bodyEl) return;
        evento.preventDefault();
        var pos = posClient(evento);
        var deltaX = (pos.x - startX) / fitScale;
        var deltaY = (pos.y - startY) / fitScale;
        bodyEl.style.width = Math.max(20, startW + deltaX) + 'px';
        bodyEl.style.height = Math.max(20, startH + deltaY) + 'px';
        if (isChart && chartId && chartInstances[chartId]) { try { chartInstances[chartId].resize(); } catch (e) {} }
      }
      function aoTerminar() {
        if (!arrastando) return;
        arrastando = false;
        if (isChart && chartId && chartInstances[chartId]) { try { chartInstances[chartId].resize(); } catch (e) {} }
        agendarGravacao();
      }
      handle.addEventListener('mousedown', aoIniciar);
      handle.addEventListener('touchstart', aoIniciar, { passive: false });
      window.addEventListener('mousemove', aoMover);
      window.addEventListener('touchmove', aoMover, { passive: false });
      window.addEventListener('mouseup', aoTerminar);
      window.addEventListener('touchend', aoTerminar);
    });
  }

  function setPageOrientation(orientacao) {
    var novaLargura = orientacao === 'landscape' ? 1123 : 794;
    var novaAltura = orientacao === 'landscape' ? 794 : 1123;
    PAGE_W = novaLargura; PAGE_H = novaAltura;
    for (var i = 0; i < folhas.length; i++) {
      folhas[i].pageEl.style.width = PAGE_W + 'px';
      folhas[i].pageEl.style.height = PAGE_H + 'px';
    }
    ajustarZoom();
    reequilibrarDocumento();
  }

  function trazerParaFrente() {
    var el = selectedShapeEl || selectedImgEl || selectedChartEl;
    if (!el) return;
    var conteudo = el.closest('.conteudo');
    if (!conteudo) return;
    conteudo.appendChild(el);
    handleInput();
  }

  function enviarParaTras() {
    var el = selectedShapeEl || selectedImgEl || selectedChartEl;
    if (!el) return;
    var conteudo = el.closest('.conteudo');
    if (!conteudo) return;
    conteudo.insertBefore(el, conteudo.firstChild);
    handleInput();
  }

  // ══════════════════════════════════════════════
  // API PÚBLICA — numeração / cabeçalho / rodapé
  // ══════════════════════════════════════════════

  function setPageNumbersVisible(visible) {
    docSettings.showPageNumbers = !!visible;
    aplicarConfigDocATodas();
    agendarGravacao();
  }

  function setHeaderVisible(visible) {
    docSettings.showHeader = !!visible;
    aplicarConfigDocATodas();
    agendarGravacao();
  }

  function setFooterVisible(visible) {
    docSettings.showFooter = !!visible;
    aplicarConfigDocATodas();
    agendarGravacao();
  }

  function setHeaderText(html) {
    docSettings.headerHtml = html || '';
    for (var i = 0; i < folhas.length; i++) folhas[i].headerEl.innerHTML = docSettings.headerHtml;
    agendarGravacao();
  }

  function setFooterText(html) {
    docSettings.footerHtml = html || '';
    for (var i = 0; i < folhas.length; i++) folhas[i].footerEl.innerHTML = docSettings.footerHtml;
    agendarGravacao();
  }

  function getDocSettings() {
    return JSON.stringify(docSettings);
  }

  function setThemeMode(modo) {
    document.body.classList.toggle('dark', modo === 'dark');
  }

  window.editorApi = {
    exec: exec,
    setFontSize: setFontSize,
    setColor: setColor,
    setHighlight: setHighlight,
    clearHighlight: clearHighlight,
    insertTable: insertTable,
    insertImageAtCursor: insertImageAtCursor,
    insertLink: insertLink,
    insertShape: insertShape,
    insertChart: insertChart,
    setSelectedShapeColor: setSelectedShapeColor,
    deleteSelectedShape: deleteSelectedShape,
    deleteSelectedImage: deleteSelectedImage,
    deleteSelectedChart: deleteSelectedChart,
    setPageOrientation: setPageOrientation,
    trazerParaFrente: trazerParaFrente,
    enviarParaTras: enviarParaTras,
    getContent: getContent,
    getDocumentPayload: getDocumentPayload,
    setContent: setContent,
    setPageNumbersVisible: setPageNumbersVisible,
    setHeaderVisible: setHeaderVisible,
    setFooterVisible: setFooterVisible,
    setHeaderText: setHeaderText,
    setFooterText: setFooterText,
    getDocSettings: getDocSettings,
    setThemeMode: setThemeMode
  };

  function iniciar() {
    detectarModoPreview();
    ajustarZoom();
    window.addEventListener('resize', ajustarZoom);
    window.addEventListener('orientationchange', ajustarZoom);
    document.execCommand('defaultParagraphSeparator', false, 'p');
    var conteudoInicial = '';
    if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
      // O Flutter injeta via setContent após onLoadStop.
    }
    if (conteudoInicial) setContent(conteudoInicial);
    else { criarFolha(); reequilibrarDocumento(); }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();
</script>
</body>
</html>
