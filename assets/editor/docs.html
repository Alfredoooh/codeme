<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, user-scalable=yes" />
<title>Documento</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  #canvasScroll {
    position: relative;
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: none;
    touch-action: pan-y;
    padding: 20px 0 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #pagesStack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    transform-origin: top center;
  }

  .page-a4 {
    background: #FFFFFF;
    width: 794px;
    height: 1123px;
    padding: 96px 72px;
    border-radius: 0;
    border: 1px solid #CCCCCC;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.16);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .conteudo {
    flex: 1;
    min-height: 0;
    width: 100%;
    font-size: 15px;
    line-height: 1.6;
    color: #1a1a1a;
    outline: none;
    overflow: hidden;
    overflow-wrap: break-word;
    position: relative;
    -webkit-user-select: text;
    user-select: text;
  }
  .conteudo p {
    margin: 0;
  }

  .page-number {
    position: absolute;
    bottom: 14px;
    right: 0;
    left: 0;
    text-align: center;
    font-size: 10px;
    color: #9a9a9a;
    pointer-events: none;
  }

  .doc-table { border-collapse: collapse; width: 100%; margin: 4px 0; }
  .doc-table td { border: 1px solid #d0d0d0; padding: 8px; min-width: 32px; height: 26px; vertical-align: top; }
  .doc-table-wrap { position: relative; display: block; margin: 8px 0; }

  a { color: #2F7BF6; text-decoration: underline; }

  /* ── Formas inseridas (retângulo, círculo, linha, seta) ── */
  .doc-shape-wrap {
    position: relative;
    display: inline-block;
    margin: 8px 4px;
    vertical-align: middle;
  }
  .doc-shape-wrap[data-locked="0"] {
    outline: 1px dashed transparent;
  }
  .doc-shape-wrap.shape-selected {
    outline: 2px solid #2F7BF6;
    outline-offset: 2px;
  }
  .doc-shape-rect {
    border-radius: 4px;
  }
  .doc-shape-circle {
    border-radius: 50%;
  }
  .doc-shape-line {
    height: 3px !important;
    border-radius: 2px;
  }
  .doc-shape-arrow-head {
    position: absolute;
    right: -2px;
    top: 50%;
    transform: translateY(-50%);
    width: 0;
    height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-left: 12px solid currentColor;
  }

  /* ── Resize handle simples para formas e imagens ── */
  .resize-handle {
    position: absolute;
    right: -6px;
    bottom: -6px;
    width: 16px;
    height: 16px;
    background: #2F7BF6;
    border: 2px solid #FFFFFF;
    border-radius: 50%;
    cursor: nwse-resize;
    display: none;
  }
  .doc-shape-wrap.shape-selected .resize-handle,
  .doc-img-wrap.img-selected .resize-handle {
    display: block;
  }
  .doc-img-wrap {
    position: relative;
    display: inline-block;
    margin: 6px 0;
    max-width: 100%;
  }
  .doc-img-wrap img {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: 2px;
  }
  .doc-img-wrap.img-selected img {
    outline: 2px solid #2F7BF6;
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div id="canvasScroll">
  <div id="pagesStack"></div>
</div>

<script>
(function () {
  'use strict';

  var PAGE_W = 794;
  var PAGE_H = 1123;

  var pagesStack = document.getElementById('pagesStack');
  var canvasScroll = document.getElementById('canvasScroll');

  var folhas = [];
  var nextFolhaId = 0;
  var fitScale = 1;
  var saveTimeout = null;
  var isRebalancing = false;
  var nextShapeId = 0;
  var selectedShapeEl = null;
  var selectedImgEl = null;

  function ajustarZoom() {
    var margem = 24;
    var largura = canvasScroll.clientWidth;
    var escala = Math.min((largura - margem) / PAGE_W, 1);
    fitScale = (escala > 0 && isFinite(escala)) ? escala : 1;
    pagesStack.style.transform = 'scale(' + fitScale + ')';
  }

  function criarFolha() {
    var id = nextFolhaId++;

    var pageEl = document.createElement('div');
    pageEl.className = 'page-a4';
    pageEl.style.width = PAGE_W + 'px';
    pageEl.style.height = PAGE_H + 'px';

    var contentEl = document.createElement('div');
    contentEl.className = 'conteudo';
    contentEl.setAttribute('contenteditable', 'true');
    contentEl.setAttribute('spellcheck', 'true');
    contentEl.innerHTML = '<p><br></p>';

    contentEl.addEventListener('input', handleInput);
    contentEl.addEventListener('paste', aoColar);
    contentEl.addEventListener('click', aoClicarNoConteudo);

    var pageNumberEl = document.createElement('div');
    pageNumberEl.className = 'page-number';

    pageEl.appendChild(contentEl);
    pageEl.appendChild(pageNumberEl);
    pagesStack.appendChild(pageEl);

    var folha = { id: id, pageEl: pageEl, contentEl: contentEl, pageNumberEl: pageNumberEl };
    folhas.push(folha);
    atualizarNumerosPagina();
    return folha;
  }

  function atualizarNumerosPagina() {
    for (var i = 0; i < folhas.length; i++) {
      folhas[i].pageNumberEl.textContent = String(i + 1);
    }
  }

  function getConteudoEl(idx) {
    return folhas[idx] ? folhas[idx].contentEl : null;
  }

  function normalizarFilhosSoltos(conteudo) {
    var noAtual = conteudo.firstChild;
    while (noAtual) {
      var proximo = noAtual.nextSibling;
      if (noAtual.nodeType === 3) {
        if (noAtual.textContent.trim() !== '') {
          var p = document.createElement('p');
          conteudo.insertBefore(p, noAtual);
          p.appendChild(noAtual);
        } else {
          conteudo.removeChild(noAtual);
        }
      }
      noAtual = proximo;
    }
    if (!conteudo.firstElementChild) {
      conteudo.innerHTML = '<p><br></p>';
    }
  }

  function obterOuCriarProximaPagina(idxAtual) {
    if (idxAtual + 1 < folhas.length) {
      return idxAtual + 1;
    }
    criarFolha();
    return idxAtual + 1;
  }

  function empurrarTransbordoDaPagina(idx) {
    var empurrouAlgo = false;
    var guarda = 0;
    var conteudo = getConteudoEl(idx);
    if (!conteudo) return false;

    while (conteudo.scrollHeight > conteudo.clientHeight + 1 && conteudo.children.length > 1 && guarda < 500) {
      var ultimoElemento = conteudo.lastElementChild;
      var proximoIdx = obterOuCriarProximaPagina(idx);
      var proximaConteudo = getConteudoEl(proximoIdx);
      if (!proximaConteudo) break;

      if (proximaConteudo.firstChild) {
        proximaConteudo.insertBefore(ultimoElemento, proximaConteudo.firstChild);
      } else {
        proximaConteudo.appendChild(ultimoElemento);
      }

      empurrouAlgo = true;
      guarda++;
      conteudo = getConteudoEl(idx);
    }

    return empurrouAlgo;
  }

  function puxarConteudoDaProximaPagina(idx) {
    if (idx + 1 >= folhas.length) return false;
    var conteudo = getConteudoEl(idx);
    var proximaConteudo = getConteudoEl(idx + 1);
    if (!conteudo || !proximaConteudo || !proximaConteudo.firstElementChild) return false;

    var puxouAlgo = false;
    var guarda = 0;

    while (proximaConteudo.firstElementChild && guarda < 500) {
      var candidato = proximaConteudo.firstElementChild;

      conteudo.appendChild(candidato);
      var causaOverflow = conteudo.scrollHeight > conteudo.clientHeight + 1;

      if (causaOverflow) {
        if (proximaConteudo.firstChild) {
          proximaConteudo.insertBefore(candidato, proximaConteudo.firstChild);
        } else {
          proximaConteudo.appendChild(candidato);
        }
        break;
      } else {
        puxouAlgo = true;
      }

      guarda++;
    }

    return puxouAlgo;
  }

  function removerPaginasVaziasNoFim() {
    for (var i = folhas.length - 1; i > 0; i--) {
      var conteudo = getConteudoEl(i);
      if (conteudo && conteudo.children.length === 0) {
        var folha = folhas.pop();
        folha.pageEl.remove();
      } else {
        break;
      }
    }
    atualizarNumerosPagina();
  }

  function obterPosicaoSelecao() {
    var selecao = window.getSelection();
    if (selecao.rangeCount === 0) return null;
    var range = selecao.getRangeAt(0);
    return {
      startContainer: range.startContainer,
      startOffset: range.startOffset,
      endContainer: range.endContainer,
      endOffset: range.endOffset
    };
  }

  function restaurarSelecao(posicao) {
    if (!posicao) return;
    if (!document.contains(posicao.startContainer)) return;

    try {
      var range = document.createRange();
      range.setStart(posicao.startContainer, posicao.startOffset);
      range.setEnd(posicao.endContainer, posicao.endOffset);
      var selecao = window.getSelection();
      selecao.removeAllRanges();
      selecao.addRange(range);
    } catch (erro) {
      // Perder o cursor exato num rebalance raro não é crítico.
    }
  }

  function reequilibrarDocumento() {
    if (isRebalancing) return;
    isRebalancing = true;

    var posicaoSelecao = obterPosicaoSelecao();

    for (var i = 0; i < folhas.length; i++) {
      normalizarFilhosSoltos(folhas[i].contentEl);
    }

    var mudouEmpurrando = true;
    var guardaGeral = 0;
    while (mudouEmpurrando && guardaGeral < 100) {
      mudouEmpurrando = false;
      for (var j = 0; j < folhas.length; j++) {
        if (empurrarTransbordoDaPagina(j)) mudouEmpurrando = true;
      }
      guardaGeral++;
    }

    var mudouPuxando = true;
    var guardaPuxar = 0;
    while (mudouPuxando && guardaPuxar < 100) {
      mudouPuxando = false;
      for (var k = 0; k < folhas.length - 1; k++) {
        if (puxarConteudoDaProximaPagina(k)) mudouPuxando = true;
      }
      guardaPuxar++;
    }

    removerPaginasVaziasNoFim();
    restaurarSelecao(posicaoSelecao);

    isRebalancing = false;
  }

  var timeoutReequilibrio;
  function agendarReequilibrio() {
    clearTimeout(timeoutReequilibrio);
    timeoutReequilibrio = setTimeout(reequilibrarDocumento, 150);
  }

  function aoColar(evento) {
    evento.preventDefault();
    var htmlColado = evento.clipboardData ? evento.clipboardData.getData('text/html') : '';
    var textoColado = evento.clipboardData ? evento.clipboardData.getData('text/plain') : '';

    if (htmlColado) {
      document.execCommand('insertHTML', false, htmlColado);
    } else {
      var linhas = textoColado.split(/\n+/).filter(function (l) { return l.trim() !== ''; });
      var htmlParagrafos = linhas.map(function (l) { return '<p>' + l + '</p>'; }).join('');
      document.execCommand('insertHTML', false, htmlParagrafos || '<p>' + textoColado + '</p>');
    }

    handleInput();
  }

  function handleInput() {
    agendarReequilibrio();
    agendarGravacao();
  }

  function agendarGravacao() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(function () {
      var html = getContent();
      if (window.AndroidBridge && window.AndroidBridge.saveDocument) {
        window.AndroidBridge.saveDocument(html);
      }
    }, 500);
  }

  function getContent() {
    return folhas.map(function (f) { return f.contentEl.innerHTML; })
      .join('<div class="page-break-marker"></div>');
  }

  function setContent(html) {
    folhas.forEach(function (f) { f.pageEl.remove(); });
    folhas = [];
    nextFolhaId = 0;
    selectedShapeEl = null;
    selectedImgEl = null;

    var parts = (html || '').split('<div class="page-break-marker"></div>');
    var htmls = parts.length ? parts : ['<p><br></p>'];

    htmls.forEach(function (h) {
      var folha = criarFolha();
      folha.contentEl.innerHTML = h || '<p><br></p>';
    });

    reativarHandlersDeFormasEImagens();
    reequilibrarDocumento();
  }

  function getActiveContentEl() {
    var sel = window.getSelection();
    if (sel && sel.rangeCount) {
      var node = sel.anchorNode;
      var base = node && node.nodeType === 3 ? node.parentElement : node;
      var conteudoPai = base && base.closest ? base.closest('.conteudo') : null;
      if (conteudoPai) return conteudoPai;
    }
    return folhas.length ? folhas[0].contentEl : null;
  }

  function focarSePreciso() {
    var el = getActiveContentEl();
    if (el && document.activeElement !== el) {
      el.focus();
    }
  }

  // ── Comandos básicos de texto ────────────────────────────────

  function exec(command) {
    focarSePreciso();
    switch (command) {
      case 'bold':
        document.execCommand('bold');
        break;
      case 'italic':
        document.execCommand('italic');
        break;
      case 'underline':
        document.execCommand('underline');
        break;
      case 'strikethrough':
        document.execCommand('strikeThrough');
        break;
      case 'alignLeft':
        document.execCommand('justifyLeft');
        break;
      case 'alignCenter':
        document.execCommand('justifyCenter');
        break;
      case 'alignRight':
        document.execCommand('justifyRight');
        break;
      case 'alignJustify':
        document.execCommand('justifyFull');
        break;
      case 'bulletList':
        document.execCommand('insertUnorderedList');
        break;
      case 'numberedList':
        document.execCommand('insertOrderedList');
        break;
      case 'undo':
        document.execCommand('undo');
        break;
      case 'redo':
        document.execCommand('redo');
        break;
      default:
        break;
    }
    handleInput();
  }

  function setFontSize(px) {
    focarSePreciso();
    document.execCommand('fontSize', false, '7');
    var fontElements = document.getElementsByTagName('font');
    for (var i = 0; i < fontElements.length; i++) {
      if (fontElements[i].size === '7') {
        fontElements[i].removeAttribute('size');
        fontElements[i].style.fontSize = px + 'px';
      }
    }
    handleInput();
  }

  // ── Cor de texto e destaque (highlight/marcador) ─────────────
  // Ambos usam execCommand nativo do contenteditable, funcionam em
  // qualquer seleção de texto ativa dentro de qualquer página.

  function setColor(hexColor) {
    focarSePreciso();
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('foreColor', false, hexColor);
    handleInput();
  }

  function setHighlight(hexColor) {
    focarSePreciso();
    document.execCommand('styleWithCSS', false, true);
    // hiliteColor funciona no Chromium (WebView Android); backColor
    // é o fallback usado por alguns motores mais antigos.
    var aplicou = document.execCommand('hiliteColor', false, hexColor);
    if (!aplicou) {
      document.execCommand('backColor', false, hexColor);
    }
    handleInput();
  }

  function clearHighlight() {
    focarSePreciso();
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('hiliteColor', false, 'transparent');
    handleInput();
  }

  // ── Tabelas ───────────────────────────────────────────────────

  function insertTable(rows, cols) {
    focarSePreciso();
    var r = Math.max(1, Math.min(20, rows || 2));
    var c = Math.max(1, Math.min(10, cols || 2));
    var html = '<div class="doc-table-wrap" contenteditable="false"><table class="doc-table"><tbody>';
    for (var ri = 0; ri < r; ri++) {
      html += '<tr>';
      for (var ci = 0; ci < c; ci++) {
        html += '<td contenteditable="true"><br></td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table></div><p><br></p>';
    document.execCommand('insertHTML', false, html);
    handleInput();
  }

  // ── Imagens ───────────────────────────────────────────────────

  function insertImageAtCursor(dataUrl) {
    focarSePreciso();
    var html = '<span class="doc-img-wrap" contenteditable="false">' +
      '<img src="' + dataUrl + '" />' +
      '<div class="resize-handle"></div>' +
      '</span>&nbsp;';
    document.execCommand('insertHTML', false, html);
    handleInput();
    setTimeout(reativarHandlersDeFormasEImagens, 30);
  }

  function insertLink(url, texto) {
    focarSePreciso();
    var label = texto && texto.trim() ? texto : url;
    var html = '<a href="' + url + '" target="_blank">' + label + '</a>&nbsp;';
    document.execCommand('insertHTML', false, html);
    handleInput();
  }

  // ── Formas (retângulo, círculo, linha, seta) ────────────────
  // Inseridas como bloco flutuante dentro do fluxo do texto, com
  // cor preenchível e redimensionável por arraste do handle.

  function insertShape(shapeKind, hexColor) {
    focarSePreciso();
    var cor = hexColor || '#2F7BF6';
    var id = 'shape_' + (nextShapeId++);
    var w = shapeKind === 'line' ? 160 : 100;
    var h = shapeKind === 'line' ? 3 : 100;
    var extraClass = shapeKind === 'circle' ? 'doc-shape-circle'
      : shapeKind === 'line' ? 'doc-shape-line'
      : shapeKind === 'arrow' ? 'doc-shape-line'
      : 'doc-shape-rect';

    var innerArrow = shapeKind === 'arrow'
      ? '<div class="doc-shape-arrow-head" style="color:' + cor + '"></div>'
      : '';

    var html = '<span class="doc-shape-wrap" data-shape-id="' + id + '" data-shape-kind="' +
      shapeKind + '" contenteditable="false">' +
      '<span class="' + extraClass + '" data-shape-body="1" style="display:block; width:' + w +
      'px; height:' + h + 'px; background:' + cor + ';">' + innerArrow + '</span>' +
      '<span class="resize-handle"></span>' +
      '</span>&nbsp;';

    document.execCommand('insertHTML', false, html);
    handleInput();
    setTimeout(reativarHandlersDeFormasEImagens, 30);
  }

  function setSelectedShapeColor(hexColor) {
    if (!selectedShapeEl) return;
    var body = selectedShapeEl.querySelector('[data-shape-body]');
    if (body) body.style.background = hexColor;
    var arrowHead = selectedShapeEl.querySelector('.doc-shape-arrow-head');
    if (arrowHead) arrowHead.style.color = hexColor;
    agendarGravacao();
  }

  function deleteSelectedShape() {
    if (!selectedShapeEl) return;
    selectedShapeEl.remove();
    selectedShapeEl = null;
    handleInput();
  }

  function deleteSelectedImage() {
    if (!selectedImgEl) return;
    selectedImgEl.remove();
    selectedImgEl = null;
    handleInput();
  }

  function deselecionarTudo() {
    if (selectedShapeEl) {
      selectedShapeEl.classList.remove('shape-selected');
      selectedShapeEl = null;
    }
    if (selectedImgEl) {
      selectedImgEl.classList.remove('img-selected');
      selectedImgEl = null;
    }
  }

  function aoClicarNoConteudo(evento) {
    var alvo = evento.target;
    var shapeWrap = alvo.closest ? alvo.closest('.doc-shape-wrap') : null;
    var imgWrap = alvo.closest ? alvo.closest('.doc-img-wrap') : null;

    if (shapeWrap) {
      evento.preventDefault();
      deselecionarTudo();
      selectedShapeEl = shapeWrap;
      shapeWrap.classList.add('shape-selected');
      if (window.AndroidBridge && window.AndroidBridge.onShapeSelected) {
        window.AndroidBridge.onShapeSelected(shapeWrap.getAttribute('data-shape-id'));
      }
      return;
    }
    if (imgWrap) {
      evento.preventDefault();
      deselecionarTudo();
      selectedImgEl = imgWrap;
      imgWrap.classList.add('img-selected');
      if (window.AndroidBridge && window.AndroidBridge.onImageSelected) {
        window.AndroidBridge.onImageSelected('1');
      }
      return;
    }
    deselecionarTudo();
  }

  // ── Arraste do handle de redimensionar (touch + mouse) ───────

  function reativarHandlersDeFormasEImagens() {
    var handles = document.querySelectorAll('.resize-handle');
    handles.forEach(function (handle) {
      if (handle.getAttribute('data-bound') === '1') return;
      handle.setAttribute('data-bound', '1');

      var arrastando = false;
      var startX = 0, startY = 0, startW = 0, startH = 0;
      var wrapEl = null;
      var bodyEl = null;

      function pegarWrap() {
        return handle.closest('.doc-shape-wrap') || handle.closest('.doc-img-wrap');
      }

      function posClient(evento) {
        if (evento.touches && evento.touches.length) {
          return { x: evento.touches[0].clientX, y: evento.touches[0].clientY };
        }
        return { x: evento.clientX, y: evento.clientY };
      }

      function aoIniciar(evento) {
        evento.preventDefault();
        evento.stopPropagation();
        wrapEl = pegarWrap();
        if (!wrapEl) return;
        bodyEl = wrapEl.querySelector('[data-shape-body]') || wrapEl.querySelector('img');
        if (!bodyEl) return;
        arrastando = true;
        var pos = posClient(evento);
        startX = pos.x;
        startY = pos.y;
        startW = bodyEl.offsetWidth;
        startH = bodyEl.offsetHeight;
      }

      function aoMover(evento) {
        if (!arrastando || !bodyEl) return;
        evento.preventDefault();
        var pos = posClient(evento);
        var deltaX = (pos.x - startX) / fitScale;
        var deltaY = (pos.y - startY) / fitScale;
        var novaLargura = Math.max(20, startW + deltaX);
        var novaAltura = Math.max(20, startH + deltaY);
        bodyEl.style.width = novaLargura + 'px';
        if (bodyEl.tagName !== 'IMG' || true) {
          bodyEl.style.height = novaAltura + 'px';
        }
      }

      function aoTerminar() {
        if (!arrastando) return;
        arrastando = false;
        agendarGravacao();
      }

      handle.addEventListener('mousedown', aoIniciar);
      handle.addEventListener('touchstart', aoIniciar, { passive: false });
      window.addEventListener('mousemove', aoMover);
      window.addEventListener('touchmove', aoMover, { passive: false });
      window.addEventListener('mouseup', aoTerminar);
      window.addEventListener('touchend', aoTerminar);
    });
  }

  // ── Orientação de página ─────────────────────────────────────

  function setPageOrientation(orientacao) {
    var novaLargura = orientacao === 'landscape' ? 1123 : 794;
    var novaAltura = orientacao === 'landscape' ? 794 : 1123;
    PAGE_W = novaLargura;
    PAGE_H = novaAltura;
    for (var i = 0; i < folhas.length; i++) {
      folhas[i].pageEl.style.width = PAGE_W + 'px';
      folhas[i].pageEl.style.height = PAGE_H + 'px';
    }
    ajustarZoom();
    reequilibrarDocumento();
  }

  // ── API exposta ao toolbar Dart e/ou à IA (canvas automático) ─
  // Tudo aqui é acionável tanto por toques do utilizador na toolbar
  // como por chamadas diretas do lado Dart quando a IA gera um
  // documento completo (setContent) ou edita um já existente.

  window.editorApi = {
    exec: exec,
    setFontSize: setFontSize,
    setColor: setColor,
    setHighlight: setHighlight,
    clearHighlight: clearHighlight,
    insertTable: insertTable,
    insertImageAtCursor: insertImageAtCursor,
    insertLink: insertLink,
    insertShape: insertShape,
    setSelectedShapeColor: setSelectedShapeColor,
    deleteSelectedShape: deleteSelectedShape,
    deleteSelectedImage: deleteSelectedImage,
    setPageOrientation: setPageOrientation,
    getContent: getContent,
    setContent: setContent
  };

  function iniciar() {
    ajustarZoom();
    window.addEventListener('resize', ajustarZoom);
    window.addEventListener('orientationchange', ajustarZoom);

    document.execCommand('defaultParagraphSeparator', false, 'p');

    var conteudoInicial = '';
    if (window.AndroidBridge && window.AndroidBridge.loadDocument) {
      try {
        conteudoInicial = window.AndroidBridge.loadDocument() || '';
      } catch (e) {
        conteudoInicial = '';
      }
    }

    if (conteudoInicial) {
      setContent(conteudoInicial);
    } else {
      criarFolha();
      reequilibrarDocumento();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciar);
  } else {
    iniciar();
  }
})();
</script>
