<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, user-scalable=yes" />
<title>Folha de Cálculo</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  #gridScroll {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    background: #FFFFFF;
  }

  #gridTable {
    border-collapse: collapse;
    table-layout: fixed;
  }

  .col-header, .row-header {
    background: #F1F3F4;
    font-size: 11px;
    font-weight: 600;
    color: #444;
    text-align: center;
    user-select: none;
    position: sticky;
    z-index: 2;
  }
  .col-header {
    top: 0;
    height: 24px;
    border-right: 1px solid #DADCE0;
    border-bottom: 1px solid #DADCE0;
  }
  .row-header {
    left: 0;
    width: 40px;
    min-width: 40px;
    border-right: 1px solid #DADCE0;
    border-bottom: 1px solid #DADCE0;
  }
  .corner {
    position: sticky;
    top: 0;
    left: 0;
    z-index: 3;
    background: #F1F3F4;
    border-right: 1px solid #DADCE0;
    border-bottom: 1px solid #DADCE0;
    width: 40px;
    min-width: 40px;
    height: 24px;
  }

  .cell {
    width: 96px;
    min-width: 96px;
    height: 26px;
    border-right: 1px solid #E8EAED;
    border-bottom: 1px solid #E8EAED;
    padding: 0 6px;
    font-size: 12px;
    color: #1a1a1a;
    outline: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    vertical-align: middle;
    background: #FFFFFF;
    position: relative;
  }
  .cell.selected {
    outline: 2px solid #2F7BF6;
    outline-offset: -2px;
    position: relative;
    z-index: 1;
  }
  .cell.number {
    text-align: right;
  }
  .cell[data-bold="1"] { font-weight: 700; }
  .cell[data-italic="1"] { font-style: italic; }
  .cell[data-underline="1"] { text-decoration: underline; }

  /* ── Célula com imagem (renderização web rica em spreadsheet) ──
     Uma célula pode conter uma imagem (via renderCellImage) em vez de
     texto puro. A célula aumenta de altura automaticamente para caber
     a miniatura; o texto normal da célula (se algum) fica escondido
     enquanto houver imagem, para não sobrepor. */
  .cell.has-image {
    height: 64px;
    padding: 3px;
    white-space: normal;
    overflow: visible;
    vertical-align: middle;
  }
  .cell.has-image img {
    max-width: 100%;
    max-height: 58px;
    display: block;
    margin: 0 auto;
    border-radius: 2px;
    object-fit: contain;
  }
  .cell.has-image img.img-broken {
    min-height: 40px;
    min-width: 40px;
    background: #F2F2F2;
    border: 1px dashed #CCCCCC;
  }

  /* ── Rodapé "+ Adicionar linhas" ── */
  #addRowsBar {
    position: sticky;
    left: 0;
    bottom: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 10px 0;
    background: #FFFFFF;
    border-top: 1px solid #E8EAED;
  }
  #addRowsBtn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 16px;
    border-radius: 999px;
    background: #F1F3F4;
    color: #2F7BF6;
    font-size: 12.5px;
    font-weight: 600;
    border: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #addRowsBtn:active {
    background: #E4E6E8;
  }

  /* ── Modo preview (usado dentro do DocumentWidgetCard, Flutter) ── */
  body.preview-mode #gridScroll {
    overflow: hidden;
    pointer-events: none;
  }
  body.preview-mode #addRowsBar {
    display: none;
  }
</style>
</head>
<body>

<div id="gridScroll">
  <table id="gridTable"></table>
  <div id="addRowsBar">
    <button id="addRowsBtn" type="button">+ Adicionar 50 linhas</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var COLS = 26;
  var ROWS = 150;

  var gridTable = document.getElementById('gridTable');
  var addRowsBtn = document.getElementById('addRowsBtn');
  var cellsData = {}; // 'A1' -> { value, formula, bold, italic, underline, align, color, fill, image }
  var selectedCellKey = null;
  var saveTimeout = null;
  var isPreviewMode = false;

  function detectarModoPreview() {
    try {
      var params = new URLSearchParams(window.location.search);
      isPreviewMode = params.get('preview') === '1';
    } catch (e) {
      isPreviewMode = false;
    }
    if (isPreviewMode) {
      document.body.classList.add('preview-mode');
    }
  }

  function colLetter(idx) {
    var letra = '';
    idx += 1;
    while (idx > 0) {
      var rem = (idx - 1) % 26;
      letra = String.fromCharCode(65 + rem) + letra;
      idx = Math.floor((idx - 1) / 26);
    }
    return letra;
  }

  function cellKey(col, row) {
    return colLetter(col) + (row + 1);
  }

  function construirGrid() {
    var thead = document.createElement('thead');
    var headerRow = document.createElement('tr');
    var corner = document.createElement('th');
    corner.className = 'corner';
    headerRow.appendChild(corner);
    for (var c = 0; c < COLS; c++) {
      var th = document.createElement('th');
      th.className = 'col-header';
      th.textContent = colLetter(c);
      headerRow.appendChild(th);
    }
    thead.appendChild(headerRow);
    gridTable.appendChild(thead);

    var tbody = document.createElement('tbody');
    var fragmento = document.createDocumentFragment();

    for (var r = 0; r < ROWS; r++) {
      fragmento.appendChild(criarLinhaEl(r));
    }
    tbody.appendChild(fragmento);
    gridTable.appendChild(tbody);

    // Delegação de eventos num único listener no tbody em vez de
    // um listener por célula — essencial para não travar o WebView.
    tbody.addEventListener('focusin', aoFocar);
    tbody.addEventListener('focusout', aoDesfocar);
    tbody.addEventListener('input', aoEditar);
  }

  function criarLinhaEl(r) {
    var tr = document.createElement('tr');
    var rowHeader = document.createElement('th');
    rowHeader.className = 'row-header';
    rowHeader.textContent = String(r + 1);
    tr.appendChild(rowHeader);

    for (var cc = 0; cc < COLS; cc++) {
      var td = document.createElement('td');
      td.className = 'cell';
      td.setAttribute('contenteditable', isPreviewMode ? 'false' : 'true');
      td.setAttribute('data-key', cellKey(cc, r));
      tr.appendChild(td);
    }
    return tr;
  }

  function aoFocar(evento) {
    var td = evento.target.closest ? evento.target.closest('.cell') : null;
    if (!td) return;
    if (selectedCellKey) {
      var anterior = gridTable.querySelector('[data-key="' + selectedCellKey + '"]');
      if (anterior) anterior.classList.remove('selected');
    }
    selectedCellKey = td.getAttribute('data-key');
    td.classList.add('selected');

    if (window.AndroidBridge && window.AndroidBridge.onCellSelected) {
      var dados = cellsData[selectedCellKey] || {};
      window.AndroidBridge.onCellSelected(selectedCellKey, JSON.stringify(dados));
    }
  }

  function aoDesfocar(evento) {
    var td = evento.target.closest ? evento.target.closest('.cell') : null;
    if (!td) return;
    td.classList.remove('selected');
  }

  function aoEditar(evento) {
    var td = evento.target.closest ? evento.target.closest('.cell') : null;
    if (!td) return;
    // Se a célula tem imagem, edição de texto direto no contenteditable
    // fica desativada nesse td (renderCellImage já marca has-image e
    // o utilizador remove a imagem explicitamente antes de escrever
    // texto ali de novo — ver removeCellImage).
    if (td.classList.contains('has-image')) return;
    var key = td.getAttribute('data-key');
    var valor = td.textContent;
    if (!cellsData[key]) cellsData[key] = {};
    cellsData[key].value = valor;

    var ehNumero = valor.trim() !== '' && !isNaN(valor.trim());
    td.classList.toggle('number', ehNumero);

    agendarGravacao();
  }

  function agendarGravacao() {
    if (isPreviewMode) return;
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(function () {
      if (window.AndroidBridge && window.AndroidBridge.saveDocument) {
        window.AndroidBridge.saveDocument(getContent());
      }
    }, 500);
  }

  function scrollParaCelula(key) {
    var el = gridTable.querySelector('[data-key="' + key + '"]');
    if (!el) return;
    el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  // ── Renderização de imagem por célula ──────────────────────────
  // Permite que uma célula contenha uma imagem em vez de/além do
  // texto — parte do requisito "tudo que um html consegue renderizar
  // o sheets também consegue". Usa-se tanto pelo toolbar do
  // utilizador como pela IA (setContentFromAi, que já suporta o campo
  // "image" por célula, ver setContent abaixo).

  function renderCellImage(key, url) {
    var td = gridTable.querySelector('[data-key="' + key + '"]');
    if (!td) return;
    if (!cellsData[key]) cellsData[key] = {};
    cellsData[key].image = url;

    td.classList.add('has-image');
    td.innerHTML = '';
    var img = document.createElement('img');
    img.src = url;
    img.addEventListener('error', function () {
      img.classList.add('img-broken');
    });
    td.appendChild(img);
    agendarGravacao();
  }

  function removeCellImage(key) {
    var td = gridTable.querySelector('[data-key="' + key + '"]');
    if (!td) return;
    if (cellsData[key]) delete cellsData[key].image;
    td.classList.remove('has-image');
    td.innerHTML = '';
    td.textContent = (cellsData[key] && cellsData[key].value) || '';
    agendarGravacao();
  }

  // ── API exposta ao toolbar Dart (específica de sheets) ─────────

  function applyFormat(command) {
    if (!selectedCellKey) return;
    var el = gridTable.querySelector('[data-key="' + selectedCellKey + '"]');
    if (!el) return;
    if (!cellsData[selectedCellKey]) cellsData[selectedCellKey] = {};

    switch (command) {
      case 'bold':
        var novoBold = el.getAttribute('data-bold') === '1' ? '0' : '1';
        el.setAttribute('data-bold', novoBold);
        cellsData[selectedCellKey].bold = novoBold === '1';
        break;
      case 'italic':
        var novoItalic = el.getAttribute('data-italic') === '1' ? '0' : '1';
        el.setAttribute('data-italic', novoItalic);
        cellsData[selectedCellKey].italic = novoItalic === '1';
        break;
      case 'underline':
        var novoUnderline = el.getAttribute('data-underline') === '1' ? '0' : '1';
        el.setAttribute('data-underline', novoUnderline);
        cellsData[selectedCellKey].underline = novoUnderline === '1';
        break;
      default:
        break;
    }
    agendarGravacao();
  }

  function setCellAlign(align) {
    if (!selectedCellKey) return;
    var el = gridTable.querySelector('[data-key="' + selectedCellKey + '"]');
    if (!el) return;
    el.style.textAlign = align;
    if (!cellsData[selectedCellKey]) cellsData[selectedCellKey] = {};
    cellsData[selectedCellKey].align = align;
    agendarGravacao();
  }

  function setCellColor(hexColor) {
    if (!selectedCellKey) return;
    var el = gridTable.querySelector('[data-key="' + selectedCellKey + '"]');
    if (!el) return;
    el.style.color = hexColor;
    if (!cellsData[selectedCellKey]) cellsData[selectedCellKey] = {};
    cellsData[selectedCellKey].color = hexColor;
    agendarGravacao();
  }

  function setCellFill(hexColor) {
    if (!selectedCellKey) return;
    var el = gridTable.querySelector('[data-key="' + selectedCellKey + '"]');
    if (!el) return;
    el.style.background = hexColor;
    if (!cellsData[selectedCellKey]) cellsData[selectedCellKey] = {};
    cellsData[selectedCellKey].fill = hexColor;
    agendarGravacao();
  }

  function insertRowBelow() {
    var tbody = gridTable.querySelector('tbody');
    var linhaBase = 0;
    if (selectedCellKey) {
      var match = selectedCellKey.match(/^[A-Z]+(\d+)$/);
      if (match) linhaBase = parseInt(match[1], 10);
    } else {
      linhaBase = ROWS;
    }

    var tr = document.createElement('tr');
    var rowHeader = document.createElement('th');
    rowHeader.className = 'row-header';
    tr.appendChild(rowHeader);
    for (var c = 0; c < COLS; c++) {
      var td = document.createElement('td');
      td.className = 'cell';
      td.setAttribute('contenteditable', 'true');
      tr.appendChild(td);
    }

    var linhasExistentes = tbody.children;
    if (linhaBase >= linhasExistentes.length) {
      tbody.appendChild(tr);
    } else {
      tbody.insertBefore(tr, linhasExistentes[linhaBase]);
    }

    ROWS++;
    renumerarLinhas();
    agendarGravacao();
  }

  function addMoreRows(quantidade) {
    var n = Math.max(1, Math.min(500, quantidade || 50));
    var tbody = gridTable.querySelector('tbody');
    var fragmento = document.createDocumentFragment();
    for (var i = 0; i < n; i++) {
      fragmento.appendChild(criarLinhaEl(ROWS + i));
    }
    tbody.appendChild(fragmento);
    ROWS += n;
    agendarGravacao();
  }

  function renumerarLinhas() {
    var tbody = gridTable.querySelector('tbody');
    var linhas = tbody.children;
    var novoCellsData = {};

    for (var r = 0; r < linhas.length; r++) {
      var tr = linhas[r];
      tr.children[0].textContent = String(r + 1);
      for (var c = 1; c <= COLS; c++) {
        var td = tr.children[c];
        if (!td) continue;
        var novaKey = cellKey(c - 1, r);
        var chaveAntiga = td.getAttribute('data-key');
        td.setAttribute('data-key', novaKey);
        if (chaveAntiga && cellsData[chaveAntiga]) {
          novoCellsData[novaKey] = cellsData[chaveAntiga];
        } else if (cellsData[novaKey]) {
          novoCellsData[novaKey] = cellsData[novaKey];
        }
      }
    }
    cellsData = novoCellsData;
  }

  function applyFormula(formula) {
    if (!selectedCellKey) return;
    var el = gridTable.querySelector('[data-key="' + selectedCellKey + '"]');
    if (!el) return;
    el.textContent = formula;
    if (!cellsData[selectedCellKey]) cellsData[selectedCellKey] = {};
    cellsData[selectedCellKey].formula = formula;
    agendarGravacao();
  }

  function getContent() {
    return JSON.stringify(cellsData);
  }

  /// Aplica um objeto cellsData (formato {"cells": {...}} ou o objeto
  /// de células diretamente) à grid, incluindo o campo "image" novo
  /// por célula. Usado tanto para restaurar um documento guardado
  /// (setContent normal) como pelo caminho da IA (setContentFromAi,
  /// que delega diretamente para aqui — ver função abaixo).
  function aplicarCellsData(dados) {
    cellsData = dados;
    Object.keys(dados).forEach(function (key) {
      var el = gridTable.querySelector('[data-key="' + key + '"]');
      if (!el) return;
      var d = dados[key];
      if (d.image) {
        renderCellImage(key, d.image);
        return;
      }
      if (d.value !== undefined) el.textContent = d.value;
      if (d.bold) el.setAttribute('data-bold', '1');
      if (d.italic) el.setAttribute('data-italic', '1');
      if (d.underline) el.setAttribute('data-underline', '1');
      if (d.align) el.style.textAlign = d.align;
      if (d.color) el.style.color = d.color;
      if (d.fill) el.style.background = d.fill;
      var ehNumero = (d.value || '').toString().trim() !== '' && !isNaN((d.value || '').toString().trim());
      el.classList.toggle('number', ehNumero);
    });
  }

  function setContent(json) {
    try {
      var parsed = JSON.parse(json || '{}');
      // Aceita tanto o formato cru {"A1": {...}} como o formato
      // envelopado {"cells": {"A1": {...}}} que kAiSystemPrompt (lado
      // Dart) instrui a IA a gerar — normaliza para o formato cru
      // internamente, mas getContent() continua a devolver sempre o
      // formato cru (sem "cells"), inalterado desde sempre, para não
      // quebrar quem já lia/escrevia neste formato antes.
      var dados = parsed && parsed.cells ? parsed.cells : parsed;
      aplicarCellsData(dados || {});
    } catch (e) {
      // JSON inválido — mantém grid vazia
    }
  }

  /// ATUALIZAÇÃO (sheets reais gerados pela IA): esta função era
  /// antes uma segunda camada de defesa que devolvia false sem fazer
  /// nada, para impedir a IA de escrever na folha de cálculo. Esse
  /// bloqueio foi removido do lado Dart (aitab.dart não descarta mais
  /// blocos [[canvas:sheet:...]]) — esta função passa a ser o ponto
  /// de entrada REAL chamado quando um documento sheet criado pela IA
  /// é carregado no editor. Aceita exatamente o mesmo formato JSON
  /// documentado em kAiSystemPrompt: {"cells": {"A1": {...}, ...}}.
  function setContentFromAi(json) {
    setContent(json);
    return true;
  }

  function getSlideCount() {
    // Mantido por paridade de interface com slides.html, não usado
    // em sheets — sempre 1 "página" lógica (a grid inteira).
    return 1;
  }

  window.editorApi = {
    applyFormat: applyFormat,
    setCellAlign: setCellAlign,
    setCellColor: setCellColor,
    setCellFill: setCellFill,
    insertRowBelow: insertRowBelow,
    addMoreRows: addMoreRows,
    applyFormula: applyFormula,
    renderCellImage: renderCellImage,
    removeCellImage: removeCellImage,
    scrollToCell: scrollParaCelula,
    getContent: getContent,
    setContent: setContent,
    setContentFromAi: setContentFromAi
  };

  function iniciar() {
    detectarModoPreview();
    construirGrid();
    if (!isPreviewMode) {
      addRowsBtn.addEventListener('click', function () { addMoreRows(50); });
    }

    var conteudoInicial = '';
    if (window.AndroidBridge && window.AndroidBridge.loadDocument) {
      try {
        conteudoInicial = window.AndroidBridge.loadDocument() || '';
      } catch (e) {
        conteudoInicial = '';
      }
    }
    if (conteudoInicial) {
      setContent(conteudoInicial);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciar);
  } else {
    iniciar();
  }
})();
</script>

</body>
</html>
