<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Folha de Cálculo</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --sheet-bg: #FFFFFF;
    --sheet-header-bg: #F1F3F4;
    --sheet-header-text: #444444;
    --sheet-border: #DADCE0;
    --sheet-cell-border: #E8EAED;
    --sheet-cell-bg: #FFFFFF;
    --sheet-cell-text: #1A1A1A;
    --sheet-selection: #2F7BF6;
    --sheet-hover: #F5F7F8;
    --sheet-cell-font-size: 12px;
  }

  body.dark {
    --sheet-bg: #1C1C1E;
    --sheet-header-bg: #2C2C2E;
    --sheet-header-text: #A0A0A5;
    --sheet-border: #3A3A3C;
    --sheet-cell-border: #2C2C2E;
    --sheet-cell-bg: #1C1C1E;
    --sheet-cell-text: #F2F2F2;
    --sheet-selection: #0A84FF;
    --sheet-hover: #2C2C2E;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  #gridScroll {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--sheet-bg);
  }

  #gridTable {
    border-collapse: collapse;
    table-layout: fixed;
  }

  .col-header, .row-header {
    background: var(--sheet-header-bg);
    font-size: 11px !important; /* Tamanho fixo, nunca muda */
    font-weight: 600;
    color: var(--sheet-header-text);
    text-align: center;
    user-select: none;
    position: sticky;
    z-index: 2;
  }

  .col-header {
    top: 0;
    height: 24px;
    border-right: 1px solid var(--sheet-border);
    border-bottom: 1px solid var(--sheet-border);
  }

  .row-header {
    left: 0;
    width: 40px;
    min-width: 40px;
    border-right: 1px solid var(--sheet-border);
    border-bottom: 1px solid var(--sheet-border);
  }

  .corner {
    position: sticky;
    top: 0;
    left: 0;
    z-index: 3;
    background: var(--sheet-header-bg);
    border-right: 1px solid var(--sheet-border);
    border-bottom: 1px solid var(--sheet-border);
    width: 40px;
    min-width: 40px;
    height: 24px;
  }

  .cell {
    width: 96px;
    min-width: 96px;
    height: 26px;
    border-right: 1px solid var(--sheet-cell-border);
    border-bottom: 1px solid var(--sheet-cell-border);
    padding: 0 6px;
    font-size: var(--sheet-cell-font-size);
    color: var(--sheet-cell-text);
    outline: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    vertical-align: middle;
    background: var(--sheet-cell-bg);
    position: relative;
  }

  .cell:hover {
    background: var(--sheet-hover);
  }

  .cell.selected {
    outline: 2px solid var(--sheet-selection);
    outline-offset: -2px;
    z-index: 1;
  }

  .cell.number {
    text-align: right;
  }

  .cell[data-bold="1"] { font-weight: 700; }
  .cell[data-italic="1"] { font-style: italic; }
  .cell[data-underline="1"] { text-decoration: underline; }

  .cell.has-image {
    height: 64px;
    padding: 3px;
    white-space: normal;
    overflow: visible;
  }

  .cell.has-image img {
    max-width: 100%;
    max-height: 58px;
    display: block;
    margin: 0 auto;
    border-radius: 2px;
    object-fit: contain;
  }

  .cell.has-image img.img-broken {
    min-height: 40px;
    min-width: 40px;
    background: var(--sheet-hover);
    border: 1px dashed var(--sheet-border);
  }

  .cell.has-chart {
    height: 120px;
    width: 180px;
    min-width: 180px;
    padding: 2px;
    overflow: hidden;
  }

  .cell.has-chart canvas {
    width: 100% !important;
    height: 100% !important;
  }
</style>
</head>
<body>

<div id="gridScroll">
  <table id="gridTable"></table>
</div>

<script>
(function () {
  'use strict';

  var COLS = 26;
  var ROWS = 150;
  var gridTable = document.getElementById('gridTable');
  var cellsData = {};
  var selectedCellKey = null;
  var saveTimeout = null;
  var chartInstances = {};

  function colLetter(idx) {
    var letra = '';
    idx += 1;
    while (idx > 0) {
      var rem = (idx - 1) % 26;
      letra = String.fromCharCode(65 + rem) + letra;
      idx = Math.floor((idx - 1) / 26);
    }
    return letra;
  }

  function cellKey(col, row) {
    return colLetter(col) + (row + 1);
  }

  function construirGrid() {
    var thead = document.createElement('thead');
    var headerRow = document.createElement('tr');
    var corner = document.createElement('th');
    corner.className = 'corner';
    headerRow.appendChild(corner);
    for (var c = 0; c < COLS; c++) {
      var th = document.createElement('th');
      th.className = 'col-header';
      th.textContent = colLetter(c);
      headerRow.appendChild(th);
    }
    thead.appendChild(headerRow);
    gridTable.appendChild(thead);

    var tbody = document.createElement('tbody');
    var fragmento = document.createDocumentFragment();
    for (var r = 0; r < ROWS; r++) {
      fragmento.appendChild(criarLinhaEl(r));
    }
    tbody.appendChild(fragmento);
    gridTable.appendChild(tbody);

    tbody.addEventListener('focusin', aoFocar);
    tbody.addEventListener('focusout', aoDesfocar);
    tbody.addEventListener('input', aoEditar);
  }

  function criarLinhaEl(r) {
    var tr = document.createElement('tr');
    var rowHeader = document.createElement('th');
    rowHeader.className = 'row-header';
    rowHeader.textContent = String(r + 1);
    tr.appendChild(rowHeader);
    for (var cc = 0; cc < COLS; cc++) {
      var td = document.createElement('td');
      td.className = 'cell';
      td.setAttribute('contenteditable', 'true');
      td.setAttribute('data-key', cellKey(cc, r));
      tr.appendChild(td);
    }
    return tr;
  }

  function aoFocar(evento) {
    var td = evento.target.closest ? evento.target.closest('.cell') : null;
    if (!td) return;
    if (selectedCellKey) {
      var anterior = gridTable.querySelector('[data-key="' + selectedCellKey + '"]');
      if (anterior) anterior.classList.remove('selected');
    }
    selectedCellKey = td.getAttribute('data-key');
    td.classList.add('selected');
    if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
      var dados = cellsData[selectedCellKey] || {};
      window.flutter_inappwebview.callHandler('onCellSelected', selectedCellKey, JSON.stringify(dados));
    }
  }

  function aoDesfocar(evento) {
    var td = evento.target.closest ? evento.target.closest('.cell') : null;
    if (!td) return;
    td.classList.remove('selected');
  }

  function aoEditar(evento) {
    var td = evento.target.closest ? evento.target.closest('.cell') : null;
    if (!td) return;
    if (td.classList.contains('has-image') || td.classList.contains('has-chart')) return;
    var key = td.getAttribute('data-key');
    var valor = td.textContent;
    if (!cellsData[key]) cellsData[key] = {};
    cellsData[key].value = valor;
    var ehNumero = valor.trim() !== '' && !isNaN(valor.trim());
    td.classList.toggle('number', ehNumero);
    agendarGravacao();
  }

  function agendarGravacao() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(function () {
      if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
        window.flutter_inappwebview.callHandler('saveDocument', getContent());
      }
    }, 500);
  }

  function scrollParaCelula(key) {
    var el = gridTable.querySelector('[data-key="' + key + '"]');
    if (!el) return;
    el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  function renderCellImage(key, url) {
    var td = gridTable.querySelector('[data-key="' + key + '"]');
    if (!td) return;
    destroyCellChart(key);
    removeCellImage(key);
    if (!cellsData[key]) cellsData[key] = {};
    cellsData[key].image = url;
    td.classList.add('has-image');
    td.innerHTML = '';
    var img = document.createElement('img');
    img.src = url;
    img.addEventListener('error', function () { img.classList.add('img-broken'); });
    td.appendChild(img);
    agendarGravacao();
  }

  function removeCellImage(key) {
    var td = gridTable.querySelector('[data-key="' + key + '"]');
    if (!td) return;
    if (cellsData[key]) delete cellsData[key].image;
    td.classList.remove('has-image');
    if (!td.classList.contains('has-chart')) {
      td.innerHTML = '';
      td.textContent = (cellsData[key] && cellsData[key].value) || '';
    }
    agendarGravacao();
  }

  function destroyCellChart(key) {
    if (chartInstances[key]) {
      chartInstances[key].destroy();
      delete chartInstances[key];
    }
    var td = gridTable.querySelector('[data-key="' + key + '"]');
    if (td) {
      td.classList.remove('has-chart');
      td.innerHTML = '';
    }
  }

  function renderCellChart(key, config) {
    var td = gridTable.querySelector('[data-key="' + key + '"]');
    if (!td) return;
    destroyCellChart(key);
    if (!cellsData[key]) cellsData[key] = {};
    cellsData[key].chart = config;
    td.classList.add('has-chart');
    td.innerHTML = '';
    var canvas = document.createElement('canvas');
    td.appendChild(canvas);
    var chartConfig = typeof config === 'string' ? JSON.parse(config) : config;
    if (window.Chart) {
      chartInstances[key] = new Chart(canvas.getContext('2d'), chartConfig);
    }
    agendarGravacao();
  }

  function removeCellChart(key) {
    destroyCellChart(key);
    var td = gridTable.querySelector('[data-key="' + key + '"]');
    if (td) {
      td.classList.remove('has-chart');
      td.innerHTML = '';
      td.textContent = (cellsData[key] && cellsData[key].value) || '';
    }
    if (cellsData[key]) delete cellsData[key].chart;
    agendarGravacao();
  }

  function applyFormat(command) {
    if (!selectedCellKey) return;
    var el = gridTable.querySelector('[data-key="' + selectedCellKey + '"]');
    if (!el) return;
    if (!cellsData[selectedCellKey]) cellsData[selectedCellKey] = {};
    switch (command) {
      case 'bold':
        var nb = el.getAttribute('data-bold') === '1' ? '0' : '1';
        el.setAttribute('data-bold', nb);
        cellsData[selectedCellKey].bold = nb === '1';
        break;
      case 'italic':
        var ni = el.getAttribute('data-italic') === '1' ? '0' : '1';
        el.setAttribute('data-italic', ni);
        cellsData[selectedCellKey].italic = ni === '1';
        break;
      case 'underline':
        var nu = el.getAttribute('data-underline') === '1' ? '0' : '1';
        el.setAttribute('data-underline', nu);
        cellsData[selectedCellKey].underline = nu === '1';
        break;
    }
    agendarGravacao();
  }

  function setCellAlign(align) {
    if (!selectedCellKey) return;
    var el = gridTable.querySelector('[data-key="' + selectedCellKey + '"]');
    if (!el) return;
    el.style.textAlign = align;
    if (!cellsData[selectedCellKey]) cellsData[selectedCellKey] = {};
    cellsData[selectedCellKey].align = align;
    agendarGravacao();
  }

  function setCellColor(hexColor) {
    if (!selectedCellKey) return;
    var el = gridTable.querySelector('[data-key="' + selectedCellKey + '"]');
    if (!el) return;
    el.style.color = hexColor;
    if (!cellsData[selectedCellKey]) cellsData[selectedCellKey] = {};
    cellsData[selectedCellKey].color = hexColor;
    agendarGravacao();
  }

  function setCellFill(hexColor) {
    if (!selectedCellKey) return;
    var el = gridTable.querySelector('[data-key="' + selectedCellKey + '"]');
    if (!el) return;
    el.style.background = hexColor;
    if (!cellsData[selectedCellKey]) cellsData[selectedCellKey] = {};
    cellsData[selectedCellKey].fill = hexColor;
    agendarGravacao();
  }

  function insertRowBelow() {
    var tbody = gridTable.querySelector('tbody');
    var linhaBase = 0;
    if (selectedCellKey) {
      var m = selectedCellKey.match(/^[A-Z]+(\d+)$/);
      if (m) linhaBase = parseInt(m[1], 10);
    } else {
      linhaBase = ROWS;
    }
    var tr = document.createElement('tr');
    var rowHeader = document.createElement('th');
    rowHeader.className = 'row-header';
    tr.appendChild(rowHeader);
    for (var c = 0; c < COLS; c++) {
      var td = document.createElement('td');
      td.className = 'cell';
      td.setAttribute('contenteditable', 'true');
      tr.appendChild(td);
    }
    var linhas = tbody.children;
    if (linhaBase >= linhas.length) tbody.appendChild(tr);
    else tbody.insertBefore(tr, linhas[linhaBase]);
    ROWS++;
    renumerarLinhas();
    agendarGravacao();
  }

  function addMoreRows(quantidade) {
    var n = Math.max(1, Math.min(500, quantidade || 50));
    var tbody = gridTable.querySelector('tbody');
    var frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++) frag.appendChild(criarLinhaEl(ROWS + i));
    tbody.appendChild(frag);
    ROWS += n;
    agendarGravacao();
  }

  function renumerarLinhas() {
    var tbody = gridTable.querySelector('tbody');
    var linhas = tbody.children;
    var novo = {};
    for (var r = 0; r < linhas.length; r++) {
      var tr = linhas[r];
      tr.children[0].textContent = String(r + 1);
      for (var c = 1; c <= COLS; c++) {
        var td = tr.children[c];
        if (!td) continue;
        var nk = cellKey(c - 1, r);
        var antiga = td.getAttribute('data-key');
        td.setAttribute('data-key', nk);
        if (antiga && cellsData[antiga]) novo[nk] = cellsData[antiga];
        else if (cellsData[nk]) novo[nk] = cellsData[nk];
      }
    }
    cellsData = novo;
  }

  function applyFormula(formula) {
    if (!selectedCellKey) return;
    var el = gridTable.querySelector('[data-key="' + selectedCellKey + '"]');
    if (!el) return;
    el.textContent = formula;
    if (!cellsData[selectedCellKey]) cellsData[selectedCellKey] = {};
    cellsData[selectedCellKey].formula = formula;
    agendarGravacao();
  }

  function getContent() { return JSON.stringify(cellsData); }

  function aplicarCellsData(dados) {
    Object.keys(chartInstances).forEach(function (k) { destroyCellChart(k); });
    cellsData = dados;
    Object.keys(dados).forEach(function (key) {
      var el = gridTable.querySelector('[data-key="' + key + '"]');
      if (!el) return;
      var d = dados[key];
      if (d.chart) { renderCellChart(key, d.chart); return; }
      if (d.image) { renderCellImage(key, d.image); return; }
      if (d.value !== undefined) el.textContent = d.value;
      if (d.bold) el.setAttribute('data-bold', '1');
      if (d.italic) el.setAttribute('data-italic', '1');
      if (d.underline) el.setAttribute('data-underline', '1');
      if (d.align) el.style.textAlign = d.align;
      if (d.color) el.style.color = d.color;
      if (d.fill) el.style.background = d.fill;
      var ehNumero = (d.value || '').toString().trim() !== '' && !isNaN((d.value || '').toString().trim());
      el.classList.toggle('number', ehNumero);
    });
  }

  function setContent(json) {
    try {
      var parsed = JSON.parse(json || '{}');
      var dados = parsed && parsed.cells ? parsed.cells : parsed;
      aplicarCellsData(dados || {});
    } catch (e) {}
  }

  function setContentFromAi(json) { setContent(json); return true; }

  function setThemeMode(mode) {
    var isDark = (mode === 'dark') || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.body.classList.toggle('dark', isDark);
    if (window.Chart) {
      Chart.defaults.color = isDark ? '#F2F2F2' : '#1A1A1A';
      Object.keys(chartInstances).forEach(function (key) {
        var chart = chartInstances[key];
        if (chart && chart.options) {
          chart.options.plugins = chart.options.plugins || {};
          chart.options.plugins.legend = chart.options.plugins.legend || {};
          chart.options.plugins.legend.labels = chart.options.plugins.legend.labels || {};
          chart.options.plugins.legend.labels.color = Chart.defaults.color;
          chart.update();
        }
      });
    }
  }

  function setFontScale(scale) {
    var size = Math.round(12 * scale);
    document.documentElement.style.setProperty('--sheet-cell-font-size', size + 'px');
  }

  function getSelectedCellKey() { return selectedCellKey; }

  function openColorPickerForCell() {
    if (!selectedCellKey) return;
    if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
      window.flutter_inappwebview.callHandler('openColorPicker', 'setCellColor');
    }
  }

  function openImagePickerForCell() {
    if (!selectedCellKey) return;
    if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
      window.flutter_inappwebview.callHandler('openImagePicker', function (url) {
        if (url && selectedCellKey) renderCellImage(selectedCellKey, url);
      });
    }
  }

  function openLinkSheetForCell() {
    if (!selectedCellKey) return;
    if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
      window.flutter_inappwebview.callHandler('openLinkSheet', function (url, text) {
        if (selectedCellKey && url) {
          var el = gridTable.querySelector('[data-key="' + selectedCellKey + '"]');
          if (el) {
            el.textContent = text || url;
            if (!cellsData[selectedCellKey]) cellsData[selectedCellKey] = {};
            cellsData[selectedCellKey].value = text || url;
            cellsData[selectedCellKey].link = url;
            agendarGravacao();
          }
        }
      });
    }
  }

  function openAiEditForSelection() {
    if (!selectedCellKey) return;
    var el = gridTable.querySelector('[data-key="' + selectedCellKey + '"]');
    var selection = el ? el.textContent : '';
    if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
      window.flutter_inappwebview.callHandler('openAiEditForSelection', selection);
    }
  }

  window.editorApi = {
    applyFormat: applyFormat,
    setCellAlign: setCellAlign,
    setCellColor: setCellColor,
    setCellFill: setCellFill,
    insertRowBelow: insertRowBelow,
    addMoreRows: addMoreRows,
    applyFormula: applyFormula,
    renderCellImage: renderCellImage,
    removeCellImage: removeCellImage,
    renderCellChart: renderCellChart,
    removeCellChart: removeCellChart,
    scrollToCell: scrollParaCelula,
    getContent: getContent,
    setContent: setContent,
    setContentFromAi: setContentFromAi,
    setThemeMode: setThemeMode,
    setFontScale: setFontScale,
    getSelectedCellKey: getSelectedCellKey,
    openColorPickerForCell: openColorPickerForCell,
    openImagePickerForCell: openImagePickerForCell,
    openLinkSheetForCell: openLinkSheetForCell,
    openAiEditForSelection: openAiEditForSelection
  };

  function iniciar() {
    construirGrid();
    setThemeMode('system');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciar);
  } else {
    iniciar();
  }
})();
</script>
</body>
</html>
