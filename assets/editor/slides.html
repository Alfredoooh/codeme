<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, user-scalable=yes" />
<title>Apresentação</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  #slideCanvas {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .slide-16-9 {
    background: #FFFFFF;
    width: 960px;
    height: 540px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.16);
    border-radius: 4px;
    position: relative;
    transform-origin: center;
    overflow: hidden;
  }

  .slide-element {
    position: absolute;
    outline: none;
    -webkit-user-select: text;
    user-select: text;
  }
  .slide-element.selected {
    outline: 2px solid #2F7BF6;
    outline-offset: 2px;
  }
  .slide-element[data-type="text"] {
    font-size: 24px;
    color: #1a1a1a;
    line-height: 1.4;
    cursor: text;
  }
  .slide-element[data-type="image"] img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  .slide-element[data-type="shape"] {
    background: #2F7BF6;
    border-radius: 4px;
  }
</style>
</head>
<body>

<div id="slideCanvas">
  <div class="slide-16-9" id="currentSlide"></div>
</div>

<script>
(function () {
  'use strict';

  var SLIDE_W = 960;
  var SLIDE_H = 540;

  var slideCanvas = document.getElementById('slideCanvas');
  var currentSlideEl = document.getElementById('currentSlide');

  var slides = [{ id: 0, elements: [] }]; // cada slide guarda os seus elementos
  var currentSlideIndex = 0;
  var nextElementId = 0;
  var selectedElementId = null;
  var fitScale = 1;
  var saveTimeout = null;

  function ajustarZoom() {
    var margem = 32;
    var larguraDisponivel = slideCanvas.clientWidth - margem;
    var alturaDisponivel = slideCanvas.clientHeight - margem;
    var escala = Math.min(larguraDisponivel / SLIDE_W, alturaDisponivel / SLIDE_H, 1);
    fitScale = (escala > 0 && isFinite(escala)) ? escala : 1;
    currentSlideEl.style.transform = 'scale(' + fitScale + ')';
  }

  function renderizarSlideAtual() {
    currentSlideEl.innerHTML = '';
    var slide = slides[currentSlideIndex];
    if (!slide) return;

    slide.elements.forEach(function (el) {
      var div = document.createElement('div');
      div.className = 'slide-element';
      div.setAttribute('data-id', el.id);
      div.setAttribute('data-type', el.type);
      div.style.left = el.x + 'px';
      div.style.top = el.y + 'px';
      div.style.width = el.w + 'px';
      div.style.height = el.h + 'px';

      if (el.type === 'text') {
        div.setAttribute('contenteditable', 'true');
        div.innerHTML = el.html || 'Texto';
        div.addEventListener('input', function () {
          el.html = div.innerHTML;
          agendarGravacao();
        });
      } else if (el.type === 'image') {
        var img = document.createElement('img');
        img.src = el.src;
        div.appendChild(img);
      } else if (el.type === 'shape') {
        div.style.background = el.color || '#2F7BF6';
      }

      div.addEventListener('click', function (evento) {
        evento.stopPropagation();
        selecionarElemento(el.id);
      });

      currentSlideEl.appendChild(div);
    });
  }

  function selecionarElemento(id) {
    selectedElementId = id;
    currentSlideEl.querySelectorAll('.slide-element').forEach(function (elDiv) {
      elDiv.classList.toggle('selected', elDiv.getAttribute('data-id') === String(id));
    });
    if (window.AndroidBridge && window.AndroidBridge.onElementSelected) {
      window.AndroidBridge.onElementSelected(String(id));
    }
  }

  slideCanvas.addEventListener('click', function () {
    selectedElementId = null;
    currentSlideEl.querySelectorAll('.slide-element').forEach(function (elDiv) {
      elDiv.classList.remove('selected');
    });
  });

  function agendarGravacao() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(function () {
      if (window.AndroidBridge && window.AndroidBridge.saveDocument) {
        window.AndroidBridge.saveDocument(getContent());
      }
    }, 500);
  }

  // ── API exposta ao toolbar Dart (específica de slides) ─────────

  function addSlide() {
    slides.push({ id: slides.length, elements: [] });
    currentSlideIndex = slides.length - 1;
    renderizarSlideAtual();
    agendarGravacao();
  }

  function goToSlide(index) {
    if (index < 0 || index >= slides.length) return;
    currentSlideIndex = index;
    selectedElementId = null;
    renderizarSlideAtual();
  }

  function deleteCurrentSlide() {
    if (slides.length <= 1) return;
    slides.splice(currentSlideIndex, 1);
    currentSlideIndex = Math.max(0, currentSlideIndex - 1);
    renderizarSlideAtual();
    agendarGravacao();
  }

  function insertTextBox() {
    var slide = slides[currentSlideIndex];
    var novoElemento = {
      id: nextElementId++,
      type: 'text',
      x: 80, y: 80, w: 400, h: 100,
      html: 'Novo texto'
    };
    slide.elements.push(novoElemento);
    renderizarSlideAtual();
    selecionarElemento(novoElemento.id);
    agendarGravacao();
  }

  function insertImage(dataUrl) {
    var slide = slides[currentSlideIndex];
    var novoElemento = {
      id: nextElementId++,
      type: 'image',
      x: 100, y: 100, w: 300, h: 200,
      src: dataUrl
    };
    slide.elements.push(novoElemento);
    renderizarSlideAtual();
    agendarGravacao();
  }

  function insertShape(tipoForma, hexColor) {
    var slide = slides[currentSlideIndex];
    var novoElemento = {
      id: nextElementId++,
      type: 'shape',
      shapeKind: tipoForma || 'rect',
      x: 120, y: 120, w: 200, h: 120,
      color: hexColor || '#2F7BF6'
    };
    slide.elements.push(novoElemento);
    renderizarSlideAtual();
    agendarGravacao();
  }

  function deleteSelectedElement() {
    if (selectedElementId === null) return;
    var slide = slides[currentSlideIndex];
    slide.elements = slide.elements.filter(function (el) { return el.id !== selectedElementId; });
    selectedElementId = null;
    renderizarSlideAtual();
    agendarGravacao();
  }

  function applyTextFormat(command) {
    if (selectedElementId === null) return;
    var el = currentSlideEl.querySelector('[data-id="' + selectedElementId + '"]');
    if (!el || el.getAttribute('data-type') !== 'text') return;
    el.focus();
    if (command === 'bold') document.execCommand('bold');
    else if (command === 'italic') document.execCommand('italic');
    else if (command === 'underline') document.execCommand('underline');
    agendarGravacao();
  }

  function getContent() {
    return JSON.stringify({ slides: slides, currentSlideIndex: currentSlideIndex });
  }

  function setContent(json) {
    try {
      var dados = JSON.parse(json || '{}');
      if (dados.slides && dados.slides.length) {
        slides = dados.slides;
        currentSlideIndex = dados.currentSlideIndex || 0;
        nextElementId = 0;
        slides.forEach(function (s) {
          s.elements.forEach(function (el) {
            if (el.id >= nextElementId) nextElementId = el.id + 1;
          });
        });
        renderizarSlideAtual();
      }
    } catch (e) {
      // JSON inválido — mantém slide único vazio
    }
  }

  function getSlideCount() {
    return slides.length;
  }

  window.editorApi = {
    addSlide: addSlide,
    goToSlide: goToSlide,
    deleteCurrentSlide: deleteCurrentSlide,
    insertTextBox: insertTextBox,
    insertImage: insertImage,
    insertShape: insertShape,
    deleteSelectedElement: deleteSelectedElement,
    applyTextFormat: applyTextFormat,
    getContent: getContent,
    setContent: setContent,
    getSlideCount: getSlideCount
  };

  function iniciar() {
    ajustarZoom();
    window.addEventListener('resize', ajustarZoom);
    window.addEventListener('orientationchange', ajustarZoom);

    var conteudoInicial = '';
    if (window.AndroidBridge && window.AndroidBridge.loadDocument) {
      try {
        conteudoInicial = window.AndroidBridge.loadDocument() || '';
      } catch (e) {
        conteudoInicial = '';
      }
    }
    if (conteudoInicial) {
      setContent(conteudoInicial);
    } else {
      renderizarSlideAtual();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciar);
  } else {
    iniciar();
  }
})();
</script>

</body>
</html>
