<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Card Calendário</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 0 16px;
    }

    .card {
      background: #1c1c1e;
      border-radius: 32px;
      padding: 10px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    /* Preview do calendário */
    .card-preview {
      border-radius: 24px;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #1a1a1a;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho do mês */
    .cal-header {
      background: #1a1a1a;
      padding: 14px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .cal-month {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.2px;
    }

    .cal-nav {
      display: flex;
      gap: 8px;
    }

    .cal-nav button {
      background: #2a2a2a;
      border: none;
      color: #aaa;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .cal-nav button:hover { background: #333; color: #fff; }

    /* Dias da semana */
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 0 10px;
      flex-shrink: 0;
    }

    .cal-weekday {
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      color: #555;
      padding: 4px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Grid de dias */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 0 10px 10px;
      flex: 1;
      gap: 2px;
    }

    .cal-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 4px 2px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
      min-height: 0;
      gap: 2px;
    }

    .cal-day:hover { background: #2a2a2a; }

    .cal-day.empty { pointer-events: none; }

    .cal-day-num {
      font-size: 12px;
      font-weight: 500;
      color: #ccc;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .cal-day.today .cal-day-num {
      background: #2e8bc9;
      color: #fff;
      font-weight: 700;
    }

    .cal-day.other-month .cal-day-num {
      color: #3a3a3a;
    }

    .cal-day.has-event .cal-day-num {
      font-weight: 700;
    }

    /* Eventos no dia */
    .cal-events {
      display: flex;
      flex-direction: column;
      gap: 1px;
      width: 100%;
    }

    .cal-event-dot {
      height: 4px;
      border-radius: 2px;
      width: 100%;
    }

    /* Actions */
    .card-actions {
      display: flex;
      align-items: center;
      background: #252525;
      border-radius: 50px;
      padding: 5px;
      gap: 6px;
    }

    .btn-primary {
      flex: 1;
      background: #2e8bc9;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      padding: 11px 16px;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 0.1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .btn-primary:hover  { background: #2578b0; }
    .btn-primary:active { background: #1f6a9e; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-preview">
      <div class="cal-header">
        <span class="cal-month" id="calMonth"></span>
        <div class="cal-nav">
          <button id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
          <button id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>
      <div class="cal-weekdays">
        <div class="cal-weekday">Dom</div>
        <div class="cal-weekday">Seg</div>
        <div class="cal-weekday">Ter</div>
        <div class="cal-weekday">Qua</div>
        <div class="cal-weekday">Qui</div>
        <div class="cal-weekday">Sex</div>
        <div class="cal-weekday">Sáb</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="card-actions">
      <button class="btn-primary">
        <i class="fa-solid fa-plus"></i>
        Novo evento
      </button>
    </div>
  </div>

  <script>
    var today = new Date();
    var currentYear  = today.getFullYear();
    var currentMonth = today.getMonth();

    var MONTHS_PT = [
      'Janeiro','Fevereiro','Março','Abril','Maio','Junho',
      'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'
    ];

    // Eventos de exemplo
    var events = {
      [today.getFullYear() + '-' + String(today.getMonth()).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0')]: [
        { color: '#2e8bc9' },
        { color: '#e05e5e' }
      ],
      [today.getFullYear() + '-' + String(today.getMonth()).padStart(2,'0') + '-' + String(Math.min(today.getDate()+2, 28)).padStart(2,'0')]: [
        { color: '#4ec994' }
      ],
      [today.getFullYear() + '-' + String(today.getMonth()).padStart(2,'0') + '-' + String(Math.max(today.getDate()-3, 1)).padStart(2,'0')]: [
        { color: '#f0a500' },
        { color: '#2e8bc9' }
      ],
      [today.getFullYear() + '-' + String(today.getMonth()).padStart(2,'0') + '-' + String(Math.min(today.getDate()+5, 28)).padStart(2,'0')]: [
        { color: '#e05e5e' }
      ],
    };

    function getEventKey(year, month, day) {
      return year + '-' + String(month).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    }

    function renderCalendar(year, month) {
      document.getElementById('calMonth').textContent = MONTHS_PT[month] + ' ' + year;

      var grid = document.getElementById('calGrid');
      grid.innerHTML = '';

      var firstDay = new Date(year, month, 1).getDay();
      var daysInMonth = new Date(year, month + 1, 0).getDate();
      var daysInPrev  = new Date(year, month, 0).getDate();

      // Dias do mês anterior
      for (var p = firstDay - 1; p >= 0; p--) {
        var d = daysInPrev - p;
        var el = makeDay(d, year, month - 1, true, false);
        grid.appendChild(el);
      }

      // Dias do mês atual
      for (var i = 1; i <= daysInMonth; i++) {
        var isToday = (i === today.getDate() && month === today.getMonth() && year === today.getFullYear());
        var key = getEventKey(year, month, i);
        var dayEvents = events[key] || [];
        var el = makeDay(i, year, month, false, isToday, dayEvents);
        grid.appendChild(el);
      }

      // Dias do mês seguinte para completar a grelha
      var totalCells = grid.children.length;
      var remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
      for (var n = 1; n <= remaining; n++) {
        var el = makeDay(n, year, month + 1, true, false);
        grid.appendChild(el);
      }
    }

    function makeDay(num, year, month, otherMonth, isToday, evts) {
      var div = document.createElement('div');
      div.className = 'cal-day' +
        (otherMonth ? ' other-month' : '') +
        (isToday ? ' today' : '') +
        (evts && evts.length ? ' has-event' : '');

      var numEl = document.createElement('div');
      numEl.className = 'cal-day-num';
      numEl.textContent = num;
      div.appendChild(numEl);

      if (evts && evts.length) {
        var evtsEl = document.createElement('div');
        evtsEl.className = 'cal-events';
        evts.slice(0, 2).forEach(function(ev) {
          var dot = document.createElement('div');
          dot.className = 'cal-event-dot';
          dot.style.background = ev.color;
          evtsEl.appendChild(dot);
        });
        div.appendChild(evtsEl);
      }

      return div;
    }

    renderCalendar(currentYear, currentMonth);

    document.getElementById('prevBtn').addEventListener('click', function() {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar(currentYear, currentMonth);
    });

    document.getElementById('nextBtn').addEventListener('click', function() {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar(currentYear, currentMonth);
    });
  </script>
</body>
</html>
