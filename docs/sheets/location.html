<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Card Mapa com Camadas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <!-- OSM Buildings (para o modo 3D) -->
  <link rel="stylesheet" href="https://osmbuildings.org/OSMBuildings-Leaflet.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 0 16px;
    }

    .card {
      background: #1c1c1e;
      border-radius: 32px;
      padding: 10px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    .card-preview {
      border-radius: 24px;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #141414;
      position: relative;
    }

    #mapEl {
      width: 100%;
      height: 100%;
      background: #1a1a1a;
    }

    /* Ajustes dos controlos do Leaflet */
    .leaflet-control-zoom {
      border: none !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4) !important;
    }

    .leaflet-control-zoom a {
      background: #1c1c1e !important;
      color: #ddd !important;
      border: none !important;
    }

    .leaflet-control-zoom a:hover { background: #262626 !important; }

    .leaflet-control-attribution {
      background: rgba(20,20,20,0.75) !important;
      color: #888 !important;
      font-size: 9px !important;
    }

    .leaflet-control-attribution a { color: #aaa !important; }

    .leaflet-popup-content-wrapper {
      background: #1c1c1e !important;
      color: #eee !important;
      border-radius: 14px !important;
    }

    .leaflet-popup-tip { background: #1c1c1e !important; }

    /* Badge de localização flutuante */
    .location-badge {
      position: absolute;
      top: 12px;
      left: 14px;
      background: rgba(20,20,20,0.8);
      color: #eee;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 16px;
      z-index: 500;
      pointer-events: none;
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .location-badge i { color: #2e8bc9; font-size: 11px; }

    /* Botão recentrar */
    .recenter-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      background: #1c1c1e;
      border: none;
      border-radius: 50%;
      color: #ddd;
      font-size: 13px;
      cursor: pointer;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: background 0.15s;
    }

    .recenter-btn:hover { background: #262626; }

    /* Novo botão de camadas */
    .layers-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      background: rgba(20,20,20,0.8);
      border: none;
      border-radius: 50%;
      color: #ddd;
      font-size: 14px;
      cursor: pointer;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: background 0.15s;
      backdrop-filter: blur(4px);
    }

    .layers-btn:hover { background: #262626; }

    /* Actions */
    .card-actions {
      display: flex;
      align-items: center;
      background: #252525;
      border-radius: 50px;
      padding: 5px;
      gap: 6px;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #eee;
      font-size: 14px;
      padding: 11px 14px;
      outline: none;
    }

    .search-input::placeholder { color: #777; }

    .btn-circle {
      width: 40px;
      height: 40px;
      background: #2e8bc9;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 15px;
    }

    .btn-circle:hover  { background: #2578b0; }
    .btn-circle:active { background: #1f6a9e; }

    /* ----- Modal de seleção de camadas ----- */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #1c1c1e;
      border-radius: 24px;
      padding: 20px;
      width: 90%;
      max-width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to   { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h3 {
      color: #eee;
      font-size: 16px;
      font-weight: 600;
    }

    .modal-close {
      background: none;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    .modal-close:hover { color: #eee; }

    .layer-option {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 6px;
      background: #252525;
      border: none;
      border-radius: 14px;
      color: #ddd;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
      text-align: left;
    }

    .layer-option:hover { background: #2e2e2e; }

    .layer-option.active {
      background: #2e8bc9;
      color: #fff;
    }

    .layer-option i {
      width: 18px;
      text-align: center;
    }

    /* Toggle 3D */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding: 10px 12px;
      background: #252525;
      border-radius: 14px;
    }

    .toggle-label {
      color: #ddd;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .switch {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #3a3a3c;
      border-radius: 24px;
      transition: 0.2s;
    }

    .slider:before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }

    .switch input:checked + .slider {
      background: #2e8bc9;
    }

    .switch input:checked + .slider:before {
      transform: translateX(20px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-preview">
      <div class="location-badge" id="locBadge">
        <i class="fa-solid fa-location-dot"></i>
        <span id="locBadgeText">A localizar…</span>
      </div>
      <div id="mapEl"></div>
      <button class="layers-btn" id="layersBtn" title="Alterar vista do mapa">
        <i class="fa-solid fa-layer-group"></i>
      </button>
      <button class="recenter-btn" id="recenterBtn" title="Centrar na minha localização">
        <i class="fa-solid fa-location-crosshairs"></i>
      </button>
    </div>

    <div class="card-actions">
      <input type="text" class="search-input" id="searchInput" placeholder="Procurar morada ou local…" />
      <button class="btn-circle" id="searchBtn" title="Procurar">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>
  </div>

  <!-- Modal de camadas -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Vista do Mapa</h3>
        <button class="modal-close" id="modalClose"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <button class="layer-option active" data-layer="satellite">
        <i class="fa-solid fa-satellite"></i> Satélite
      </button>
      <button class="layer-option" data-layer="streets">
        <i class="fa-solid fa-road"></i> Ruas
      </button>
      <button class="layer-option" data-layer="dark">
        <i class="fa-solid fa-moon"></i> Escuro
      </button>
      <button class="layer-option" data-layer="terrain">
        <i class="fa-solid fa-mountain"></i> Terreno
      </button>
      <div class="toggle-row">
        <span class="toggle-label">
          <i class="fa-solid fa-building"></i> Edifícios 3D
        </span>
        <label class="switch">
          <input type="checkbox" id="toggle3d">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- OSM Buildings (opcional, para 3D) -->
  <script src="https://osmbuildings.org/OSMBuildings-Leaflet.js"></script>
  <script>
    // ---------- Localização inicial ----------
    var DEFAULT_LAT = 38.7223;
    var DEFAULT_LNG = -9.1393;
    var DEFAULT_ZOOM = 13;
    var DEFAULT_LABEL = 'Lisboa, Portugal';

    var map = L.map('mapEl', {
      zoomControl: true,
      attributionControl: true
    }).setView([DEFAULT_LAT, DEFAULT_LNG], DEFAULT_ZOOM);

    // ---------- Definição das camadas ----------
    var layerDefs = {
      satellite: {
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        attribution: '&copy; <a href="https://www.esri.com/">Esri</a>',
        maxZoom: 20
      },
      streets: {
        url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19,
        subdomains: 'abc'
      },
      dark: {
        url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
        maxZoom: 19,
        subdomains: 'abcd'
      },
      terrain: {
        url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://opentopomap.org/">OpenTopoMap</a>',
        maxZoom: 17,
        subdomains: 'abc'
      }
    };

    var currentTileLayer = L.tileLayer(layerDefs.satellite.url, {
      attribution: layerDefs.satellite.attribution,
      maxZoom: layerDefs.satellite.maxZoom
    }).addTo(map);

    // ---------- Marcador ----------
    var currentMarker = null;
    var pulseIcon = L.divIcon({
      className: 'custom-pulse-icon',
      html: '<div style="position:relative;width:18px;height:18px;">' +
              '<div style="position:absolute;inset:0;background:#2e8bc9;border-radius:50%;opacity:0.35;animation:pulseRing 1.8s ease-out infinite;"></div>' +
              '<div style="position:absolute;top:4px;left:4px;width:10px;height:10px;background:#2e8bc9;border:2px solid #fff;border-radius:50%;"></div>' +
            '</div>' +
            '<style>@keyframes pulseRing{0%{transform:scale(0.6);opacity:0.6;}100%{transform:scale(2.2);opacity:0;}}</style>',
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    function setMarker(lat, lng, label) {
      if (currentMarker) map.removeLayer(currentMarker);
      currentMarker = L.marker([lat, lng], { icon: pulseIcon }).addTo(map);
      if (label) currentMarker.bindPopup(label);
      document.getElementById('locBadgeText').textContent = label || (lat.toFixed(4) + ', ' + lng.toFixed(4));
    }

    setMarker(DEFAULT_LAT, DEFAULT_LNG, DEFAULT_LABEL);

    // ---------- Geolocalização ----------
    function locateUser() {
      if (!navigator.geolocation) return;
      document.getElementById('locBadgeText').textContent = 'A localizar…';
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          var lat = pos.coords.latitude;
          var lng = pos.coords.longitude;
          map.setView([lat, lng], 15);
          setMarker(lat, lng, 'A sua localização');
        },
        function() {
          document.getElementById('locBadgeText').textContent = DEFAULT_LABEL;
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    document.getElementById('recenterBtn').addEventListener('click', locateUser);
    locateUser();

    // ---------- Procura ----------
    var searchInput = document.getElementById('searchInput');
    var searchBtn = document.getElementById('searchBtn');

    function doSearch() {
      var query = searchInput.value.trim();
      if (!query) return;

      document.getElementById('locBadgeText').textContent = 'A procurar…';

      fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query))
        .then(function(res) { return res.json(); })
        .then(function(results) {
          if (!results.length) {
            document.getElementById('locBadgeText').textContent = 'Local não encontrado';
            return;
          }
          var r = results[0];
          var lat = parseFloat(r.lat);
          var lng = parseFloat(r.lon);
          map.setView([lat, lng], 14);
          setMarker(lat, lng, r.display_name.split(',').slice(0, 2).join(','));
        })
        .catch(function() {
          document.getElementById('locBadgeText').textContent = 'Erro na procura';
        });
    }

    searchBtn.addEventListener('click', doSearch);
    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doSearch();
    });

    // ---------- Troca de camadas ----------
    var layersBtn = document.getElementById('layersBtn');
    var modalOverlay = document.getElementById('modalOverlay');
    var modalClose = document.getElementById('modalClose');
    var layerOptions = document.querySelectorAll('.layer-option');

    layersBtn.addEventListener('click', function() {
      modalOverlay.classList.add('active');
    });

    modalClose.addEventListener('click', function() {
      modalOverlay.classList.remove('active');
    });

    modalOverlay.addEventListener('click', function(e) {
      if (e.target === modalOverlay) modalOverlay.classList.remove('active');
    });

    layerOptions.forEach(function(btn) {
      btn.addEventListener('click', function() {
        var layerKey = btn.getAttribute('data-layer');
        if (layerDefs[layerKey]) {
          map.removeLayer(currentTileLayer);
          var def = layerDefs[layerKey];
          currentTileLayer = L.tileLayer(def.url, {
            attribution: def.attribution,
            maxZoom: def.maxZoom,
            subdomains: def.subdomains || 'abc'
          }).addTo(map);
          // Atualiza estado ativo
          layerOptions.forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          modalOverlay.classList.remove('active');
        }
      });
    });

    // ---------- Modo 3D (OSM Buildings) ----------
    var osmbLayer = null;
    var toggle3d = document.getElementById('toggle3d');

    toggle3d.addEventListener('change', function() {
      if (this.checked) {
        if (typeof OSMBuildings !== 'undefined') {
          if (!osmbLayer) {
            osmbLayer = new OSMBuildings(map).load();
          }
          map.addLayer(osmbLayer);
        } else {
          alert('A biblioteca 3D não carregou. Verifica a ligação à internet.');
          this.checked = false;
        }
      } else {
        if (osmbLayer && map.hasLayer(osmbLayer)) {
          map.removeLayer(osmbLayer);
        }
      }
    });

    // Leaflet precisa de recalcular o tamanho depois do layout assentar
    setTimeout(function() { map.invalidateSize(); }, 100);
    window.addEventListener('resize', function() { map.invalidateSize(); });
  </script>
</body>
</html>
