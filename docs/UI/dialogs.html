<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dialog</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 0 16px;
    }

    .dialog-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
    }

    .dialog {
      background: #1c1c1e;
      border-radius: 32px;
      padding: 26px 22px 10px;
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }

    .dialog-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .dialog-message {
      font-size: 13.5px;
      color: #999;
      line-height: 1.5;
      margin-top: -8px;
    }

    .dialog-actions {
      display: flex;
      width: 100%;
      background: #252525;
      border-radius: 50px;
      padding: 5px;
      gap: 6px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 50px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
    }

    .btn-red  { background: #e05e5e; }
    .btn-red:active  { background: #c94f4f; }

    .btn-blue { background: #2e8bc9; }
    .btn-blue:active { background: #2578b0; }
  </style>
</head>
<body>

  <div class="dialog-overlay">
    <div class="dialog">
      <div class="dialog-title">Eliminar evento?</div>
      <div class="dialog-message">Esta ação não pode ser desfeita.</div>
      <div class="dialog-actions">
        <button class="btn btn-red">Eliminar</button>
        <button class="btn btn-blue">Cancelar</button>
      </div>
    </div>
  </div>

</body>
</html>
