<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste de Tools — Worker</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0d0d0d;
    color: #eee;
    margin: 0;
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  h2 { font-size: 14px; color: #999; margin-top: 24px; margin-bottom: 8px; }
  input, select, textarea, button {
    width: 100%;
    padding: 10px;
    margin: 4px 0;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #eee;
    font-size: 14px;
  }
  textarea { min-height: 60px; font-family: monospace; }
  button {
    background: #6F5AF6;
    border: none;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
  }
  button:disabled { opacity: 0.5; }
  button.secondary { background: #333; }
  button.danger { background: #b91c1c; }
  #status {
    font-size: 12px;
    color: #999;
    margin: 8px 0;
    white-space: pre-wrap;
  }
  #rawOutput {
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    font-family: monospace;
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 300px;
    overflow-y: auto;
    margin-top: 12px;
  }
  #renderOutput { margin-top: 16px; }
  #renderOutput img { max-width: 100%; border-radius: 8px; margin: 4px 0; display: block; }
  .card {
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    margin: 8px 0;
    background: #1a1a1a;
  }
  .cardTitle {
    font-size: 12px;
    font-weight: bold;
    color: #ccc;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }
  .ok { color: #4ade80; }
  .err { color: #f87171; }
  .warn { color: #fbbf24; }
  .imgRow { display: flex; gap: 8px; overflow-x: auto; }
  .imgRow img { width: 120px; height: 120px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  a.dl { color: #6F5AF6; word-break: break-all; }
  pre.textPreview {
    background: #111;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 8px;
    font-size: 11px;
    max-height: 160px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 6px 0;
  }
  table.previewTable { width: 100%; border-collapse: collapse; font-size: 11px; margin: 6px 0; }
  table.previewTable th, table.previewTable td { border: 1px solid #333; padding: 4px 6px; text-align: left; }
  table.previewTable th { background: #222; }
  .fileList { list-style: none; padding: 0; margin: 6px 0; font-size: 11px; }
  .fileList li { padding: 3px 0; border-bottom: 1px solid #222; }
  .badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #333; margin-left: 4px; }

  /* ── Progress bar individual (por execução isolada) ── */
  #singleProgressWrap {
    display: none;
    margin: 8px 0;
  }
  #singleProgressWrap.active { display: block; }
  .progressBarOuter {
    width: 100%;
    height: 8px;
    background: #1a1a1a;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid #333;
  }
  .progressBarInner {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6F5AF6, #a78bfa);
    transition: width 0.15s linear;
  }
  .progressBarInner.indeterminate {
    width: 40% !important;
    animation: indet 1.1s ease-in-out infinite;
  }
  @keyframes indet {
    0% { margin-left: -40%; }
    100% { margin-left: 100%; }
  }
  #singleProgressLabel {
    font-size: 11px;
    color: #999;
    margin-top: 4px;
    display: flex;
    justify-content: space-between;
  }

  /* ── Progress bar agregada (corrida em lote) ── */
  #allRunPanel {
    display: none;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    margin: 12px 0;
    background: #151515;
  }
  #allRunPanel.active { display: block; }
  #allProgressLabel {
    font-size: 12px;
    color: #ccc;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }
  #allProgressBarOuter {
    width: 100%;
    height: 10px;
    background: #1a1a1a;
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid #333;
  }
  #allProgressBarInner {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4ade80, #22c55e);
    transition: width 0.25s ease;
  }
  #allCurrentTool {
    font-size: 11px;
    color: #999;
    margin-top: 6px;
    font-family: monospace;
  }
  #allResultsSummary {
    margin-top: 10px;
    font-size: 11px;
  }
  .resultRow {
    display: flex;
    justify-content: space-between;
    padding: 4px 6px;
    border-bottom: 1px solid #222;
    font-family: monospace;
  }
  .resultRow.rowOk { color: #4ade80; }
  .resultRow.rowErr { color: #f87171; }
  .resultRow .toolTime { color: #777; margin-left: 8px; }
  .btnRow { display: flex; gap: 8px; }
  .btnRow button { flex: 1; }

  /* ── Lista de checkboxes por tool ── */
  #toolCheckList {
    border: 1px solid #333;
    border-radius: 8px;
    max-height: 280px;
    overflow-y: auto;
    margin: 6px 0;
    background: #111;
  }
  .checkGroupTitle {
    font-size: 11px;
    color: #777;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 8px 10px 4px 10px;
    background: #1a1a1a;
    position: sticky;
    top: 0;
  }
  .checkRow {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    font-size: 12px;
    border-bottom: 1px solid #1c1c1c;
  }
  .checkRow input[type="checkbox"] {
    width: 16px;
    height: 16px;
    margin: 0;
    flex-shrink: 0;
    accent-color: #6F5AF6;
  }
  .checkRow label {
    flex: 1;
    cursor: pointer;
  }
  #selectAllRow {
    display: flex;
    gap: 8px;
    margin: 8px 0;
  }
  #selectAllRow button { flex: 1; margin-top: 0; }

  /* ── Envio de email manual (secção 4) ── */
  #emailImagePreviewRow {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin: 6px 0;
  }
  #emailImagePreviewRow .emailImgThumb {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
    border: 1px solid #333;
  }
  .cidHint {
    font-size: 11px;
    color: #6F5AF6;
    background: #1a1a2e;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 6px 8px;
    margin: 4px 0;
    font-family: monospace;
  }
</style>
</head>
<body>

<h1>Teste de Tools — Worker</h1>
<div id="status">Não autenticado</div>

<h2>1. Login</h2>
<input id="apiBase" value="https://ipc.alfredopjonas.workers.dev" placeholder="API base">
<input id="email" placeholder="email">
<input id="password" type="password" placeholder="password">
<button onclick="doLogin()">Entrar</button>

<h2>2. Testar tools (seleciona quais correr)</h2>
<div id="selectAllRow">
  <button class="secondary" onclick="selectAllTools()">Selecionar todas</button>
  <button class="secondary" onclick="clearAllTools()">Limpar seleção</button>
</div>
<div id="toolCheckList"></div>
<div class="btnRow">
  <button id="runAllBtn" onclick="runSelectedTools()" disabled>▶ Correr selecionadas</button>
  <button id="stopAllBtn" class="danger" onclick="stopAllTools()" disabled style="display:none;">■ Parar</button>
</div>
<div id="allRunPanel">
  <div id="allProgressLabel"><span id="allProgressText">0 / 0</span><span id="allProgressPct">0%</span></div>
  <div id="allProgressBarOuter"><div id="allProgressBarInner"></div></div>
  <div id="allCurrentTool">—</div>
  <div id="allResultsSummary"></div>
</div>

<h2>3. Testar uma tool isolada</h2>
<select id="toolName" onchange="updateInputHint()"></select>
<div id="inputHint" style="font-size:11px;color:#777;margin-bottom:4px;"></div>
<textarea id="toolInput">{}</textarea>
<button id="runBtn" onclick="runTool()" disabled>Executar tool</button>

<div id="singleProgressWrap">
  <div class="progressBarOuter"><div id="singleProgressBar" class="progressBarInner indeterminate"></div></div>
  <div id="singleProgressLabel"><span id="singleProgressName">—</span><span id="singleProgressTime">0.0s</span></div>
</div>

<h2>4. Enviar email de teste (formulário dedicado)</h2>
<input id="emailTo" placeholder="destinatário@example.com">
<input id="emailSubject" placeholder="Assunto do email">
<input id="emailFromName" placeholder="Nome do remetente (opcional, ex: Nexa)">
<textarea id="emailContent" placeholder="Corpo em HTML. Ex: &lt;h1&gt;Olá&lt;/h1&gt;&lt;p&gt;Texto...&lt;/p&gt;">&lt;div style="font-family:sans-serif;padding:20px;"&gt;
  &lt;h1 style="color:#6F5AF6;"&gt;Olá!&lt;/h1&gt;
  &lt;p&gt;Este é um email de teste com &lt;strong&gt;HTML estilizado&lt;/strong&gt;.&lt;/p&gt;
&lt;/div&gt;</textarea>

<input type="file" id="emailImageFile" accept="image/*" onchange="handleEmailImageSelect(event)">
<div id="emailImagePreviewRow"></div>
<div id="cidHintArea"></div>

<button id="sendEmailBtn" onclick="sendTestEmail()" disabled>✉ Enviar email</button>
<div id="emailSendStatus" style="font-size:12px;margin-top:6px;"></div>

<div id="renderOutput"></div>
<div id="rawOutput"></div>

<script>
let TOKEN = null;
let ALL_RUN_ABORT = false;
let EMAIL_IMAGES = []; // { content_base64, content_id, filename }

  "download_image_for_project", "send_email",

  "generate_qrcode", "generate_barcode", "generate_chart", "generate_function_plot",

  "create_pdf_structured", "html_to_pdf", "create_project_zip",

  "merge_pdfs", "split_pdf_pages",

async function doLogin() {
  const base = document.getElementById('apiBase').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  setStatus('A autenticar...');
  try {
    const res = await fetch(`${base}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    if (!data.token) throw new Error('Login respondeu sem campo "token": ' + JSON.stringify(data));
    TOKEN = data.token;
    setStatus('✓ Autenticado. Token guardado em memória.', 'ok');
    document.getElementById('runBtn').disabled = false;
    document.getElementById('runAllBtn').disabled = false;
    document.getElementById('sendEmailBtn').disabled = false;
  } catch (e) {
    setStatus('✗ Erro no login: ' + e.message, 'err');
    document.getElementById('runBtn').disabled = true;
    document.getElementById('runAllBtn').disabled = true;
    document.getElementById('sendEmailBtn').disabled = true;
  }
}

// ═══════════════════════════════════════════════════════════
// EXECUÇÃO DE UMA TOOL — chamada de baixo nível reutilizada
// tanto pelo modo isolado como pela corrida em lote.
// Devolve { ok, elapsedSec, data, error }.
// ═══════════════════════════════════════════════════════════
async function callTool(base, name, input) {
  const startTime = performance.now();
  try {
    const res = await fetch(`${base}/tools/execute`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${TOKEN}`,
      },
      body: JSON.stringify({ name, input }),
    });
    const elapsedSec = (performance.now() - startTime) / 1000;
    const data = await res.json();
    if (!res.ok) {
      return { ok: false, elapsedSec, data, error: `HTTP ${res.status}` };
    }
    const result = data.result !== undefined ? data.result : data;
    if (result && result.found === false) {
      return { ok: false, elapsedSec, data, error: result.reason || '(sem reason)' };
    }
    return { ok: true, elapsedSec, data };
  } catch (e) {
    const elapsedSec = (performance.now() - startTime) / 1000;
    return { ok: false, elapsedSec, data: null, error: 'Erro de rede/fetch: ' + e.message };
  }
}

// ═══════════════════════════════════════════════════════════
// MODO ISOLADO — barra individual com tempo decorrido ao vivo
// enquanto espera a resposta desta chamada específica.
// ═══════════════════════════════════════════════════════════
async function runTool() {
  const base = document.getElementById('apiBase').value.trim();
  const name = document.getElementById('toolName').value;
  let input;
  try {
    input = JSON.parse(document.getElementById('toolInput').value);
  } catch (e) {
    setStatus('✗ JSON de input inválido: ' + e.message, 'err');
    return;
  }

  document.getElementById('renderOutput').innerHTML = '';
  document.getElementById('rawOutput').textContent = '';
  document.getElementById('runBtn').disabled = true;

  const wrap = document.getElementById('singleProgressWrap');
  const bar = document.getElementById('singleProgressBar');
  const nameEl = document.getElementById('singleProgressName');
  const timeEl = document.getElementById('singleProgressTime');
  wrap.classList.add('active');
  bar.classList.add('indeterminate');
  nameEl.textContent = name;
  const tickStart = performance.now();
  const ticker = setInterval(() => {
    timeEl.textContent = ((performance.now() - tickStart) / 1000).toFixed(1) + 's';
  }, 100);

  setStatus(`A executar "${name}"...`);

  const outcome = await callTool(base, name, input);

  clearInterval(ticker);
  wrap.classList.remove('active');
  document.getElementById('runBtn').disabled = false;

  const elapsed = outcome.elapsedSec.toFixed(1);
  if (!outcome.ok && !outcome.data) {
    setStatus(`✗ ${outcome.error} após ${elapsed}s`, 'err');
    return;
  }
  if (!outcome.ok) {
    setStatus(`✗ found:false após ${elapsed}s — ${outcome.error}`, 'err');
    document.getElementById('rawOutput').textContent = JSON.stringify(outcome.data, null, 2);
    renderResult(name, outcome.data);
    return;
  }

  setStatus(`✓ Resposta recebida em ${elapsed}s. Vê abaixo o JSON bruto e a renderização.`, 'ok');
  document.getElementById('rawOutput').textContent = JSON.stringify(outcome.data, null, 2);
  renderResult(name, outcome.data);
}

// ═══════════════════════════════════════════════════════════
// CORRIDA EM LOTE — corre RUN_ORDER filtrado pelas checkboxes
// marcadas, preservando a ordem relativa (simples→complexo),
// para as dependências entre tools continuarem a funcionar
// mesmo com um subconjunto selecionado. Barra agregada + lista
// de resultado por tool com tempo individual, e no fim mostra
// o resultado de TODAS as tools desta corrida de uma só vez na
// área de baixo (um card por tool, acumulado, não substituído).
// Não interrompe em erro — regista e segue, porque o objetivo é
// mapear os limites, não parar no primeiro problema.
// ═══════════════════════════════════════════════════════════
async function runSelectedTools() {
  const base = document.getElementById('apiBase').value.trim();
  const selectedNames = new Set(getSelectedToolNames());

  if (selectedNames.size === 0) {
    setStatus('✗ Nenhuma tool selecionada — marca pelo menos uma checkbox.', 'err');
    return;
  }

  if (selectedNames.has('send_email')) {
    const proceed = confirm('send_email está selecionada — isto vai ENVIAR um email real (to vazio no preset vai provavelmente falhar, mas confirma antes de continuar). Continuar?');
    if (!proceed) {
      setStatus('Corrida cancelada pelo utilizador (send_email estava selecionada).', 'warn');
      return;
    }
  }

  const orderedSelection = RUN_ORDER.filter(n => selectedNames.has(n));
  selectedNames.forEach(n => { if (!orderedSelection.includes(n)) orderedSelection.push(n); });

  ALL_RUN_ABORT = false;

  document.getElementById('runAllBtn').style.display = 'none';
  document.getElementById('stopAllBtn').style.display = 'block';
  document.getElementById('stopAllBtn').disabled = false;
  document.getElementById('runBtn').disabled = true;

  const panel = document.getElementById('allRunPanel');
  panel.classList.add('active');
  const progressText = document.getElementById('allProgressText');
  const progressPct = document.getElementById('allProgressPct');
  const barInner = document.getElementById('allProgressBarInner');
  const currentToolEl = document.getElementById('allCurrentTool');
  const summaryEl = document.getElementById('allResultsSummary');
  summaryEl.innerHTML = '';

  document.getElementById('renderOutput').innerHTML = '';
  document.getElementById('rawOutput').textContent = '';

  const artifacts = { pdfBase64: null, zipBase64: null, xlsxBase64: null, pngBase64: null, docxBase64: null, pptxBase64: null };

  const results = [];
  const total = orderedSelection.length;

  for (let i = 0; i < total; i++) {
    if (ALL_RUN_ABORT) break;
    const name = orderedSelection[i];

    let input;
    try {
      input = JSON.parse(PRESETS[name] || '{}');
    } catch (e) {
      input = {};
    }

    if (name === 'read_pdf_contents' || name === 'extract_document_outline' || name === 'pdf_to_images' || name === 'split_pdf_pages') {
      if (artifacts.pdfBase64) input.pdf_base64 = artifacts.pdfBase64;
    }
    if (name === 'read_zip_contents') {
      if (artifacts.zipBase64) input.zip_base64 = artifacts.zipBase64;
    }
    if (name === 'xlsx_to_json') {
      if (artifacts.xlsxBase64) input.xlsx_base64 = artifacts.xlsxBase64;
    }
    if (name === 'docx_to_html') {
      if (artifacts.docxBase64) input.docx_base64 = artifacts.docxBase64;
    }
    if (name === 'pptx_to_images') {
      if (artifacts.pptxBase64) input.pptx_base64 = artifacts.pptxBase64;
    }
    if (['get_image_colors', 'convert_image_format', 'resize_image', 'crop_image', 'watermark_image', 'image_metadata', 'vectorize_image', 'ocr_extract_text'].includes(name)) {
      if (artifacts.pngBase64) input.image_base64 = artifacts.pngBase64;
    }
    if (name === 'merge_pdfs') {
      if (artifacts.pdfBase64) input.pdfs_base64 = [artifacts.pdfBase64, artifacts.pdfBase64];
    }

    currentToolEl.textContent = `A correr: ${name}`;
    progressText.textContent = `${i + 1} / ${total}`;
    progressPct.textContent = Math.round(((i) / total) * 100) + '%';
    barInner.style.width = Math.round(((i) / total) * 100) + '%';

    const outcome = await callTool(base, name, input);

    if (outcome.ok && outcome.data) {
      const r = outcome.data.result !== undefined ? outcome.data.result : outcome.data;
      if (r && typeof r.content_base64 === 'string' && r.content_base64.length > 0) {
        const mime = r.mime_type || '';
        if (name === 'create_pdf' || name === 'create_pdf_structured' || name === 'html_to_pdf') artifacts.pdfBase64 = r.content_base64;
        if (name === 'create_project_zip') artifacts.zipBase64 = r.content_base64;
        if (name === 'create_xlsx') artifacts.xlsxBase64 = r.content_base64;
        if (name === 'create_docx') artifacts.docxBase64 = r.content_base64;
        if (name === 'create_pptx') artifacts.pptxBase64 = r.content_base64;
        if (mime.startsWith('image/') && !artifacts.pngBase64) artifacts.pngBase64 = r.content_base64;
      }
    }

    results.push({ name, ok: outcome.ok, elapsedSec: outcome.elapsedSec, error: outcome.error });

    const row = document.createElement('div');
    row.className = 'resultRow ' + (outcome.ok ? 'rowOk' : 'rowErr');
    row.innerHTML = `<span>${outcome.ok ? '✓' : '✗'} ${name}</span><span class="toolTime">${outcome.elapsedSec.toFixed(1)}s</span>`;
    if (!outcome.ok) row.title = outcome.error || '';
    summaryEl.appendChild(row);
    summaryEl.scrollTop = summaryEl.scrollHeight;

    appendBatchResultCard(name, outcome);
  }

  progressText.textContent = `${results.length} / ${total}`;
  const pct = Math.round((results.length / total) * 100);
  progressPct.textContent = pct + '%';
  barInner.style.width = pct + '%';

  const okCount = results.filter(r => r.ok).length;
  const failCount = results.length - okCount;
  const totalTime = results.reduce((s, r) => s + r.elapsedSec, 0);
  const slowest = results.slice().sort((a, b) => b.elapsedSec - a.elapsedSec).slice(0, 3);

  currentToolEl.innerHTML = ALL_RUN_ABORT
    ? `Parado manualmente após ${results.length}/${total}.`
    : `Concluído: ${okCount} ok, ${failCount} falharam, ${totalTime.toFixed(1)}s no total.` +
      (slowest.length ? `<br>Mais lentas: ${slowest.map(s => `${s.name} (${s.elapsedSec.toFixed(1)}s)`).join(', ')}` : '');

  document.getElementById('runAllBtn').style.display = 'block';
  document.getElementById('stopAllBtn').style.display = 'none';
  document.getElementById('runBtn').disabled = false;

  setStatus(ALL_RUN_ABORT ? `Corrida interrompida (${results.length}/${total}).` : `Corrida completa: ${okCount}/${total} tools ok.`, ALL_RUN_ABORT ? 'warn' : (failCount === 0 ? 'ok' : 'warn'));
}

function stopAllTools() {
  ALL_RUN_ABORT = true;
  document.getElementById('stopAllBtn').disabled = true;
}

// ═══════════════════════════════════════════════════════════
// SECÇÃO 4 — ENVIO DE EMAIL MANUAL DEDICADO
// Formulário próprio para testar send_email de forma direta,
// incluindo seleção de imagem local → conversão para base64 →
// geração automática de content_id → botão para inserir a tag
// <img src="cid:..."> no textarea do conteúdo.
// ═══════════════════════════════════════════════════════════
function handleEmailImageSelect(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result;
    const base64Only = dataUrl.split(',')[1];
    const contentId = 'img_' + Date.now() + '_' + Math.floor(Math.random() * 1000);

    EMAIL_IMAGES.push({
      content_base64: base64Only,
      content_id: contentId,
      filename: file.name || `${contentId}.png`,
      previewDataUrl: dataUrl,
    });

    renderEmailImagePreviews();
    event.target.value = '';
  };
  reader.readAsDataURL(file);
}

function renderEmailImagePreviews() {
  const row = document.getElementById('emailImagePreviewRow');
  const hintArea = document.getElementById('cidHintArea');
  row.innerHTML = '';
  hintArea.innerHTML = '';

  EMAIL_IMAGES.forEach((img, idx) => {
    const wrap = document.createElement('div');
    wrap.style.position = 'relative';
    wrap.style.flexShrink = '0';

    const thumb = document.createElement('img');
    thumb.src = img.previewDataUrl;
    thumb.className = 'emailImgThumb';
    thumb.title = `Clica para inserir <img src="cid:${img.content_id}"> no conteúdo`;
    thumb.style.cursor = 'pointer';
    thumb.onclick = () => insertCidTagIntoContent(img.content_id);

    const removeBtn = document.createElement('button');
    removeBtn.textContent = '✕';
    removeBtn.style.position = 'absolute';
    removeBtn.style.top = '-6px';
    removeBtn.style.right = '-6px';
    removeBtn.style.width = '20px';
    removeBtn.style.height = '20px';
    removeBtn.style.padding = '0';
    removeBtn.style.borderRadius = '50%';
    removeBtn.style.background = '#b91c1c';
    removeBtn.style.margin = '0';
    removeBtn.style.fontSize = '11px';
    removeBtn.style.lineHeight = '1';
    removeBtn.onclick = () => { EMAIL_IMAGES.splice(idx, 1); renderEmailImagePreviews(); };

    wrap.appendChild(thumb);
    wrap.appendChild(removeBtn);
    row.appendChild(wrap);

    const hint = document.createElement('div');
    hint.className = 'cidHint';
    hint.textContent = `cid:${img.content_id}  →  clica na miniatura para inserir a tag <img> no conteúdo`;
    hintArea.appendChild(hint);
  });
}

function insertCidTagIntoContent(contentId) {
  const textarea = document.getElementById('emailContent');
  const tag = `<img src="cid:${contentId}" style="max-width:100%;border-radius:8px;" />`;
  const pos = textarea.selectionStart || textarea.value.length;
  textarea.value = textarea.value.slice(0, pos) + tag + textarea.value.slice(pos);
  textarea.focus();
}

async function sendTestEmail() {
  const base = document.getElementById('apiBase').value.trim();
  const to = document.getElementById('emailTo').value.trim();
  const subject = document.getElementById('emailSubject').value.trim();
  const content = document.getElementById('emailContent').value.trim();
  const fromName = document.getElementById('emailFromName').value.trim();
  const statusEl = document.getElementById('emailSendStatus');
  const btn = document.getElementById('sendEmailBtn');

  if (!to || !subject || !content) {
    statusEl.innerHTML = '<span class="err">Preenche pelo menos: destinatário, assunto e conteúdo.</span>';
    return;
  }

  const input = { to, subject, content };
  if (fromName) input.from_name = fromName;
  if (EMAIL_IMAGES.length > 0) {
    input.images = EMAIL_IMAGES.map(img => ({
      content_base64: img.content_base64,
      content_id: img.content_id,
      filename: img.filename,
    }));
  }

  btn.disabled = true;
  statusEl.innerHTML = '<span class="warn">A enviar...</span>';

  const outcome = await callTool(base, 'send_email', input);

  btn.disabled = false;

  document.getElementById('renderOutput').innerHTML = '';
  document.getElementById('rawOutput').textContent = JSON.stringify(outcome.data, null, 2);

  if (outcome.ok) {
    const r = outcome.data.result !== undefined ? outcome.data.result : outcome.data;
    statusEl.innerHTML = `<span class="ok">✓ Enviado! email_id: ${r.email_id || '(sem id)'} · imagens anexadas: ${r.images_attached ?? 0} · ${outcome.elapsedSec.toFixed(1)}s</span>`;
  } else {
    statusEl.innerHTML = `<span class="err">✗ Falhou: ${outcome.error}</span>`;
  }

  renderResult('send_email', outcome.data);
}

// ═══════════════════════════════════════════════════════════
// CARD DE RESULTADO — usado tanto no modo isolado (renderResult,
// que limpa e mostra um único card) como na corrida em lote
// (appendBatchResultCard, que acrescenta um card por tool sem
// apagar os anteriores, para no fim aparecerem todos juntos).
// Ambos delegam no mesmo buildResultCardBody() para não haver
// duas implementações divergentes do mesmo render.
// ═══════════════════════════════════════════════════════════
function renderResult(toolName, data) {
  const out = document.getElementById('renderOutput');
  out.innerHTML = '';
  const card = buildResultCardBody(toolName, data);
  out.appendChild(card);
}

function appendBatchResultCard(toolName, outcome) {
  const out = document.getElementById('renderOutput');
  const card = buildResultCardBody(toolName, outcome.data, outcome);
  out.appendChild(card);
}

function buildResultCardBody(toolName, data, outcomeForBatch) {
  const card = document.createElement('div');
  card.className = 'card';

  const titleRow = document.createElement('div');
  titleRow.className = 'cardTitle';
  const nameSpan = document.createElement('span');
  nameSpan.textContent = toolName;
  titleRow.appendChild(nameSpan);
  if (outcomeForBatch) {
    const timeSpan = document.createElement('span');
    timeSpan.className = outcomeForBatch.ok ? 'ok' : 'err';
    timeSpan.textContent = `${outcomeForBatch.ok ? '✓' : '✗'} ${outcomeForBatch.elapsedSec.toFixed(1)}s`;
    titleRow.appendChild(timeSpan);
  }
  card.appendChild(titleRow);

  if (!data) {
    const p = document.createElement('div');
    p.className = 'err';
    p.textContent = 'Sem resposta do servidor (erro de rede/fetch).';
    card.appendChild(p);
    return card;
  }

  const result = data.result !== undefined ? data.result : data;

  if (result === null || result === undefined) {
    const p = document.createElement('div');
    p.className = 'err';
    p.textContent = 'result veio null/undefined — nada para renderizar.';
    card.appendChild(p);
    return card;
  }

  if (result.found === false) {
    const p = document.createElement('div');
    p.innerHTML = `<span class="err">found: false</span><br>reason: ${escapeHtml(result.reason || '(sem reason)')}`;
    card.appendChild(p);
    return card;
  }

  const handlers = {
    read_website: renderKeyValue,
    search_images: renderSearchImages,
    search_videos: renderSearchVideos,
    search_books: renderSearchBooks,
    download_image_for_project: renderContentBase64Card,
    search_market: renderKeyValue,
    search_place: renderKeyValue,
    search_calendar_date: renderKeyValue,
    get_weather: renderWeatherAndImage,
    send_email: renderSendEmail,
    generate_function_plot: renderContentBase64Card,
    generate_math_sheet: renderContentBase64Card,
    generate_color_scheme: renderKeyValue,
    text_summary_stats: renderKeyValue,
    count_tokens_estimate: renderKeyValue,
    extract_urls_from_text: renderKeyValue,
    diff_text: renderKeyValue,
    str_replace_file: renderKeyValue,
    format_markdown_to_html: renderKeyValue,
    image_metadata: renderKeyValue,
    get_image_colors: renderKeyValue,
    youtube_thumbnail_extract: renderKeyValue,
    extract_document_outline: renderKeyValue,
    read_zip_contents: renderZipContents,
    read_pdf_contents: renderPdfContents,
    pdf_to_images: renderPdfToImages,
    pptx_to_images: renderPptxToImages,
    vectorize_image: renderVectorized,
    docx_to_html: renderDocxToHtml,
    audio_duration_check: renderKeyValue,
    csv_to_xlsx: renderContentBase64Card,
    json_transform: renderJsonTransform,
    xlsx_to_json: renderKeyValue,
    html_to_docx: renderContentBase64Card,
    html_to_pdf: renderContentBase64Card,
    html_to_xlsx: renderContentBase64Card,
    html_to_pptx: renderContentBase64Card,
    create_project_zip: renderContentBase64Card,
  };

  const handler = handlers[toolName] || renderContentBase64Card;
  handler(card, result);
  return card;
}

function renderSendEmail(card, result) {
  const pre = document.createElement('pre');
  pre.className = 'textPreview';
  pre.textContent = JSON.stringify(result, null, 2);
  card.appendChild(document.createTextNode('Resposta do envio:'));
  card.appendChild(pre);
}

function renderSearchImages(card, result) {
  if (!Array.isArray(result.images) || result.images.length === 0) {
    card.innerHTML += '<span class="err">Sem campo "images" (array) ou array vazio. server.js devolve result.images[].url</span>';
    return;
  }
  const row = document.createElement('div');
  row.className = 'imgRow';
  result.images.forEach(img => {
    if (!img.url) return;
    const im = document.createElement('img');
    im.src = img.url;
    im.title = img.title || '';
    im.onerror = () => { im.style.border = '2px solid #f87171'; im.alt = 'FALHOU AO CARREGAR'; };
    row.appendChild(im);
  });
  card.appendChild(document.createTextNode(`${result.total_returned ?? result.images.length} imagens encontradas:`));
  card.appendChild(row);
}

function renderSearchVideos(card, result) {
  if (!Array.isArray(result.videos) || result.videos.length === 0) {
    card.innerHTML += '<span class="err">Sem campo "videos" (array) ou array vazio. Nota: nome do campo "videos" na resposta Serper nunca foi confirmado contra resposta real — ver [search_videos] no log do Render se isto falhar sistematicamente.</span>';
    return;
  }
  result.videos.forEach(v => {
    const row = document.createElement('div');
    row.style.marginBottom = '6px';
    row.innerHTML = `<strong>${escapeHtml(v.title || '(sem título)')}</strong><br><a class="dl" href="${v.link}" target="_blank">${v.link}</a>`;
    if (v.thumbnailUrl) {
      const im = document.createElement('img');
      im.src = v.thumbnailUrl;
      im.style.width = '160px';
      im.style.borderRadius = '6px';
      row.appendChild(document.createElement('br'));
      row.appendChild(im);
    }
    card.appendChild(row);
  });
}

function renderSearchBooks(card, result) {
  if (!Array.isArray(result.books) || result.books.length === 0) {
    card.innerHTML += '<span class="err">Sem campo "books" (array) ou array vazio. server.js devolve result.books[] via Google Books API.</span>';
    return;
  }
  result.books.forEach(b => {
    const row = document.createElement('div');
    row.style.display = 'flex';
    row.style.gap = '8px';
    row.style.marginBottom = '8px';
    if (b.thumbnail) {
      const im = document.createElement('img');
      im.src = b.thumbnail;
      im.style.width = '56px';
      im.style.borderRadius = '4px';
      im.style.flexShrink = '0';
      row.appendChild(im);
    }
    const info = document.createElement('div');
    info.innerHTML = `<strong>${escapeHtml(b.title || '(sem título)')}</strong><br><span style="color:#999;">${escapeHtml((b.authors || []).join(', ') || 'autor desconhecido')}</span>${b.average_rating ? `<br><span style="color:#fbbf24;">★ ${b.average_rating} (${b.ratings_count || 0})</span>` : ''}`;
    row.appendChild(info);
    card.appendChild(row);
  });
}

function renderKeyValue(card, result) {
  const { found, ...rest } = result;
  const pre = document.createElement('pre');
  pre.className = 'textPreview';
  pre.textContent = JSON.stringify(rest, null, 2);
  card.appendChild(document.createTextNode('Campos devolvidos:'));
  card.appendChild(pre);
}

function renderWeatherAndImage(card, result) {
  const { found, content_base64, mime_type, ...rest } = result;
  const pre = document.createElement('pre');
  pre.className = 'textPreview';
  pre.textContent = JSON.stringify(rest, null, 2);
  card.appendChild(document.createTextNode('Dados do clima:'));
  card.appendChild(pre);
  if (content_base64) {
    renderContentBase64Card(card, result, true);
  } else {
    const warn = document.createElement('div');
    warn.className = 'warn';
    warn.textContent = 'content_base64 é null — normal se as fontes Inter ainda não estiverem em ./fonts/ (o card visual falha mas os dados de clima continuam válidos).';
    card.appendChild(warn);
  }
}

function renderZipContents(card, result) {
  const files = Array.isArray(result.files) ? result.files : [];
  const summary = document.createElement('div');
  summary.textContent = `total_entries: ${result.total_entries} | files_read: ${result.files_read}`;
  card.appendChild(summary);

  const textFiles = files.filter(f => f.type === 'text');
  const imageFiles = files.filter(f => f.type === 'image');
  const binaryFiles = files.filter(f => f.type === 'binary');

  if (textFiles.length > 0) {
    const ul = document.createElement('ul');
    ul.className = 'fileList';
    textFiles.forEach(f => {
      const li = document.createElement('li');
      li.textContent = f.path;
      if (f.truncated) {
        const b = document.createElement('span');
        b.className = 'badge';
        b.textContent = 'truncado';
        li.appendChild(b);
      }
      ul.appendChild(li);
    });
    card.appendChild(document.createTextNode('Ficheiros de texto:'));
    card.appendChild(ul);
  }

  if (imageFiles.length > 0) {
    const row = document.createElement('div');
    row.className = 'imgRow';
    imageFiles.forEach(img => {
      const im = document.createElement('img');
      im.src = `data:${img.mime_type};base64,${img.content_base64}`;
      im.title = img.path;
      row.appendChild(im);
    });
    card.appendChild(document.createTextNode('Imagens no zip:'));
    card.appendChild(row);
  }

  if (binaryFiles.length > 0) {
    const pre = document.createElement('pre');
    pre.className = 'textPreview';
    pre.textContent = binaryFiles.map(f => `${f.path} (${f.size_bytes} bytes)`).join('\n');
    card.appendChild(document.createTextNode('Binários (conteúdo não incluído):'));
    card.appendChild(pre);
  }
}

function renderPdfContents(card, result) {
  const summary = document.createElement('div');
  summary.textContent = `total_pages: ${result.total_pages}`;
  card.appendChild(summary);

  if (result.note) {
    const note = document.createElement('div');
    note.className = 'warn';
    note.textContent = result.note;
    card.appendChild(note);
  }

  const pre = document.createElement('pre');
  pre.className = 'textPreview';
  const text = result.text || '';
  pre.textContent = text.slice(0, 800) + (text.length > 800 ? '…' : '');
  card.appendChild(document.createTextNode('Texto extraído:'));
  card.appendChild(pre);
}

function renderPdfToImages(card, result) {
  if (result.note) {
    const note = document.createElement('div');
    note.className = 'warn';
    note.textContent = result.note;
    card.appendChild(note);
  }
  (result.images || []).forEach(img => {
    const im = document.createElement('img');
    im.src = `data:${img.mime_type};base64,${img.content_base64}`;
    card.appendChild(document.createTextNode(`Página ${img.page}:`));
    card.appendChild(im);
  });
}

function renderPptxToImages(card, result) {
  if (result.note) {
    const note = document.createElement('div');
    note.className = 'warn';
    note.textContent = result.note;
    card.appendChild(note);
  }
  card.appendChild(document.createTextNode(`${result.total_slides} slides:`));
  (result.images || []).forEach(img => {
    const im = document.createElement('img');
    im.src = `data:${img.mime_type};base64,${img.content_base64}`;
    card.appendChild(document.createTextNode(`Slide ${img.slide}:`));
    card.appendChild(im);
  });
}

function renderVectorized(card, result) {
  if (typeof result.svg !== 'string' || !result.svg) {
    card.innerHTML += '<span class="err">Sem campo "svg" (string).</span>';
    return;
  }
  const wrap = document.createElement('div');
  wrap.style.background = '#fff';
  wrap.style.padding = '8px';
  wrap.style.borderRadius = '6px';
  wrap.innerHTML = result.svg;
  card.appendChild(document.createTextNode('SVG vetorizado:'));
  card.appendChild(wrap);
}

function renderDocxToHtml(card, result) {
  if (typeof result.html !== 'string') {
    card.innerHTML += '<span class="err">Sem campo "html" (string).</span>';
    return;
  }
  const pre = document.createElement('pre');
  pre.className = 'textPreview';
  pre.textContent = result.html.slice(0, 800) + (result.html.length > 800 ? '…' : '');
  card.appendChild(document.createTextNode('HTML convertido:'));
  card.appendChild(pre);
  if (Array.isArray(result.warnings) && result.warnings.length > 0) {
    const warn = document.createElement('div');
    warn.className = 'warn';
    warn.textContent = `Avisos do mammoth: ${result.warnings.join('; ')}`;
    card.appendChild(warn);
  }
}

function renderJsonTransform(card, result) {
  if (!Array.isArray(result.headers) || !Array.isArray(result.rows)) {
    card.innerHTML += '<span class="err">Sem "headers"/"rows" válidos.</span>';
    return;
  }
  const table = document.createElement('table');
  table.className = 'previewTable';
  const thead = document.createElement('tr');
  result.headers.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    thead.appendChild(th);
  });
  table.appendChild(thead);
  result.rows.slice(0, 10).forEach(row => {
    const tr = document.createElement('tr');
    row.forEach(cell => {
      const td = document.createElement('td');
      td.textContent = cell;
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  card.appendChild(document.createTextNode(`${result.rows.length} linhas:`));
  card.appendChild(table);
  if (result.rows.length > 10) {
    card.appendChild(document.createTextNode(`(+ ${result.rows.length - 10} linhas não mostradas aqui)`));
  }
}

function renderContentBase64Card(card, result, skipEmptyMsg) {
  const hasBase64 = typeof result.content_base64 === 'string' && result.content_base64.length > 0;
  if (!hasBase64) {
    if (!skipEmptyMsg) {
      card.innerHTML += '<span class="err">Sem campo "content_base64" (string não-vazia). O app procura exatamente result.content_base64 — sem isto, nenhum card aparece no Flutter.</span>';
    }
    return;
  }

  const mime = result.mime_type || 'application/octet-stream';
  const isImage = mime.startsWith('image/');

  if (isImage) {
    const img = document.createElement('img');
    img.src = `data:${mime};base64,${result.content_base64}`;
    card.appendChild(document.createTextNode('content_base64 presente e é imagem — renderizado abaixo:'));
    card.appendChild(img);
  } else {
    const link = document.createElement('a');
    link.className = 'dl';
    link.href = `data:${mime};base64,${result.content_base64}`;
    link.download = result.filename || 'ficheiro';
    link.textContent = `⬇ ${result.filename || 'download'} (${mime})`;
    card.appendChild(document.createTextNode('content_base64 presente — documento pronto:'));
    card.appendChild(document.createElement('br'));
    card.appendChild(link);
  }

  if (result.label) {
    card.appendChild(document.createElement('br'));
    const lbl = document.createElement('span');
    lbl.style.color = '#777';
    lbl.style.fontSize = '11px';
    lbl.textContent = `label: ${result.label}`;
    card.appendChild(lbl);
  }

  if (Array.isArray(result.roots_approx) && result.roots_approx.length > 0) {
    card.appendChild(document.createElement('br'));
    card.appendChild(document.createTextNode(`Raízes aproximadas: ${result.roots_approx.join(', ')}`));
  }

  if (typeof result.has_graph === 'boolean') {
    card.appendChild(document.createElement('br'));
    card.appendChild(document.createTextNode(`has_graph: ${result.has_graph}`));
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
