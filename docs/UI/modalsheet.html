<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #d8c9a8;
      --btn-bg: rgba(255, 255, 255, 0.14);
      --btn-border: rgba(255, 255, 255, 0.35);
      --btn-hover: rgba(255, 255, 255, 0.22);
      --text: #fdfaf3;
      --text-muted: rgba(253, 250, 243, 0.68);
      --accent: #c1502e;

      --radius-btn: 999px;
      --btn-height: 54px;
      --gap-btn: 14px;

      --logo-size: 120px;
      --font-size-subtitle: 15px;
      --font-size-stream: 17px;
      --font-size-btn: 15px;
      --font-size-signup: 14px;

      --max-width: 430px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      color: var(--text);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg) url("background.png") center / cover no-repeat fixed;
    }

    .login-screen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        calc(48px + env(safe-area-inset-top))
        24px
        calc(28px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }

    .hero {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-wrap {
      width: var(--logo-size);
      height: var(--logo-size);
      margin-bottom: 96px;
      position: relative;
    }

    /* Camada 1: o logo em si, com gradiente de cor animado por trás,
       recortado na forma do SVG via mask-image */
    .logo,
    .logo-shimmer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      -webkit-mask-image: url("logo.svg");
      -webkit-mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-image: url("logo.svg");
      mask-size: contain;
      mask-repeat: no-repeat;
      mask-position: center;
    }

    .logo {
      filter: drop-shadow(0 1px 16px rgba(0, 0, 0, 0.25));
      background: linear-gradient(
        120deg,
        #f4c98b,
        #c1502e,
        #7a8fc9,
        #f4c98b
      );
      background-size: 300% 300%;
      animation: logoGradient 6s ease-in-out infinite;
    }

    @keyframes logoGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Camada 2: uma faixa de luz clara que desliza por cima, mesmo recorte */
    .logo-shimmer {
      background: linear-gradient(
        100deg,
        transparent 40%,
        rgba(255, 255, 255, 0.9) 50%,
        transparent 60%
      );
      background-size: 250% 250%;
      background-position: -100% -100%;
      mix-blend-mode: overlay;
      animation: shimmerSweep 3.2s ease-in-out infinite;
      animation-delay: 1s;
    }

    @keyframes shimmerSweep {
      0% { background-position: -120% -120%; }
      55% { background-position: 120% 120%; }
      100% { background-position: 120% 120%; }
    }

    .stream-wrap {
      width: 100%;
      max-width: var(--max-width);
      margin: auto auto;
      text-align: center;
      padding: 0 8px;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stream-text {
      font-family: 'Space Grotesk', Arial, sans-serif;
      font-size: var(--font-size-stream);
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.4;
      color: var(--text);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .stream-text.visible {
      opacity: 1;
    }

    .cursor {
      display: inline-block;
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }

    .bottom {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      position: relative;
    }

    .subtitle {
      position: absolute;
      bottom: calc(100% + 14px);
      left: 0;
      right: 0;
      text-align: center;
      color: var(--text-muted);
      font-size: var(--font-size-subtitle);
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: var(--gap-btn);
    }

    .btn {
      width: 100%;
      height: var(--btn-height);
      border: 1px solid var(--btn-border);
      border-radius: var(--radius-btn);
      background: var(--btn-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text);
      font-size: var(--font-size-btn);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: background 0.15s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: var(--btn-hover);
    }

    .btn svg {
      flex-shrink: 0;
    }

    .btn-email .icon-envelope {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .signup {
      margin-top: 28px;
      text-align: center;
      color: var(--text-muted);
      font-size: var(--font-size-signup);
    }

    .signup a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main class="login-screen">
    <div class="hero">
      <div class="logo-wrap">
        <div class="logo"></div>
        <div class="logo-shimmer"></div>
      </div>
    </div>

    <div class="stream-wrap">
      <p class="stream-text" id="streamText"></p>
    </div>

    <div class="bottom">
      <p class="subtitle">
        Entre na sua conta para continuar.
      </p>

      <div class="actions">
        <a href="#" class="btn btn-google">
          <svg width="20" height="20" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
            <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
            <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
            <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
          </svg>
          Continuar com Google
        </a>

        <a href="#" class="btn btn-email">
          <svg class="icon-envelope" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          Continuar com email
        </a>
      </div>

      <div class="signup">
        Ainda não tem uma conta?
        <a href="#">Criar conta</a>
      </div>
    </div>
  </main>

  <script>
    const phrases = [
      "Descubra mais sobre o universo com a nexa ai",
      "Explore ideias sem limites, uma pergunta de cada vez",
      "Inteligência que aprende com você, todos os dias",
      "Bem-vindo ao nexa ai"
    ];

    const el = document.getElementById("streamText");
    const HOLD_TIME = 2200;
    const FADE_TIME = 600;
    const GAP_TIME = 300;

    let phraseIndex = 0;

    function renderCursor(text) {
      return text + '<span class="cursor">_</span>';
    }

    function showPhrase() {
      const isLast = phraseIndex === phrases.length - 1;
      const text = phrases[phraseIndex];

      el.innerHTML = renderCursor(text);
      requestAnimationFrame(() => {
        el.classList.add("visible");
      });

      if (isLast) return;

      setTimeout(() => {
        el.classList.remove("visible");
        setTimeout(() => {
          phraseIndex++;
          setTimeout(showPhrase, GAP_TIME);
        }, FADE_TIME);
      }, HOLD_TIME);
    }

    showPhrase();
  </script>
</body>
</html>
