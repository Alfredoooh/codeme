function updateInputHint() {
  const name = document.getElementById('toolName').value;
  document.getElementById('toolInput').value = PRESETS[name] || '{}';
  document.getElementById('inputHint').textContent = HINTS[name] || '';
}

function setStatus(text, cls) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = cls || '';
}

async function doLogin() {
  const base = document.getElementById('apiBase').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  setStatus('A autenticar...');
  try {
    const res = await fetch(`${base}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    if (!data.token) throw new Error('Login respondeu sem campo "token": ' + JSON.stringify(data));
    TOKEN = data.token;
    setStatus('✓ Autenticado. Token guardado em memória.', 'ok');
    document.getElementById('runBtn').disabled = false;
  } catch (e) {
    setStatus('✗ Erro no login: ' + e.message, 'err');
    document.getElementById('runBtn').disabled = true;
  }
}

// callTool nunca engole o corpo de erro — guarda rawText sempre,
// e só tenta JSON.parse depois. Isto cobre 3 casos distintos:
// 1) erro de rede (fetch nunca completou)
// 2) resposta não é JSON válido (ex: 502 do proxy, texto puro)
// 3) resposta é JSON mas found:false ou tem campo "error"
async function callTool(base, name, input) {
  const startTime = performance.now();
  let res, rawText, data;
  try {
    res = await fetch(`${base}/tools/execute`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${TOKEN}`,
      },
      body: JSON.stringify({ name, input }),
    });
  } catch (e) {
    const elapsedSec = (performance.now() - startTime) / 1000;
    return { ok: false, elapsedSec, data: null, rawText: null, error: 'Erro de rede/fetch: ' + e.message };
  }

  const elapsedSec = (performance.now() - startTime) / 1000;
  rawText = await res.text();
  try {
    data = JSON.parse(rawText);
  } catch (e) {
    return { ok: false, elapsedSec, data: null, rawText, error: `Resposta não-JSON (HTTP ${res.status})` };
  }

  if (!res.ok) {
    return { ok: false, elapsedSec, data, rawText, error: data.error || `HTTP ${res.status}` };
  }

  const result = data.result !== undefined ? data.result : data;
  if (result && result.found === false) {
    return { ok: false, elapsedSec, data, rawText, error: result.reason || '(sem reason)' };
  }
  if (result && typeof result.error === 'string') {
    return { ok: false, elapsedSec, data, rawText, error: result.error };
  }
  return { ok: true, elapsedSec, data, rawText };
}

async function runTool() {
  const base = document.getElementById('apiBase').value.trim();
  const selectedKey = document.getElementById('toolName').value;
  const actualName = TOOL_NAME_MAP[selectedKey] || selectedKey;
  let input;
  try {
    input = JSON.parse(document.getElementById('toolInput').value);
  } catch (e) {
    setStatus('✗ JSON de input inválido: ' + e.message, 'err');
    return;
  }

  document.getElementById('renderOutput').innerHTML = '';
  document.getElementById('rawOutput').textContent = '';
  document.getElementById('runBtn').disabled = true;

  const wrap = document.getElementById('singleProgressWrap');
  const nameEl = document.getElementById('singleProgressName');
  const timeEl = document.getElementById('singleProgressTime');
  wrap.classList.add('active');
  nameEl.textContent = actualName;
  const tickStart = performance.now();
  const ticker = setInterval(() => {
    timeEl.textContent = ((performance.now() - tickStart) / 1000).toFixed(1) + 's';
  }, 100);

  setStatus(`A gerar "${actualName}"... (passa por subprocess Python — showcases com gráficos/imagens demoram mais)`);

  const outcome = await callTool(base, actualName, input);

  clearInterval(ticker);
  wrap.classList.remove('active');
  document.getElementById('runBtn').disabled = false;

  const elapsed = outcome.elapsedSec.toFixed(1);
  if (!outcome.ok && !outcome.data) {
    setStatus(`✗ ${outcome.error} após ${elapsed}s`, 'err');
    if (outcome.rawText) {
      document.getElementById('rawOutput').textContent = outcome.rawText;
    }
    return;
  }
  if (!outcome.ok) {
    setStatus(`✗ Erro após ${elapsed}s — ${outcome.error}`, 'err');
    document.getElementById('rawOutput').textContent = JSON.stringify(outcome.data, null, 2);
    renderResult(actualName, outcome.data);
    return;
  }

  setStatus(`✓ Gerado em ${elapsed}s.`, 'ok');
  document.getElementById('rawOutput').textContent = JSON.stringify(outcome.data, null, 2);
  renderResult(actualName, outcome.data);
}

// RAW_FIELD_BY_TOOL — as 4 funções do documents.py devolvem o
// documento cru em base64 sob um campo próprio (pdf_base64/
// docx_base64/xlsx_base64/pptx_base64), sem found/mime_type/
// filename — diferente do formato "normal" { found, content_base64,
// mime_type, filename } que outras tools do servidor Node usam.
const RAW_FIELD_BY_TOOL = {
  create_pdf: { field: 'pdf_base64', mime: 'application/pdf', ext: 'pdf' },
  create_docx: { field: 'docx_base64', mime: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', ext: 'docx' },
  create_xlsx: { field: 'xlsx_base64', mime: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', ext: 'xlsx' },
  create_pptx: { field: 'pptx_base64', mime: 'application/vnd.openxmlformats-officedocument.presentationml.presentation', ext: 'pptx' },
};

function renderResult(toolName, data) {
  const out = document.getElementById('renderOutput');
  out.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'card';

  const titleRow = document.createElement('div');
  titleRow.className = 'cardTitle';
  titleRow.textContent = toolName;
  card.appendChild(titleRow);

  if (!data) {
    card.innerHTML += '<span class="err">Sem resposta do servidor.</span>';
    out.appendChild(card);
    return;
  }

  const result = data.result !== undefined ? data.result : data;

  if (result === null || result === undefined) {
    card.innerHTML += '<span class="err">result veio null/undefined.</span>';
    out.appendChild(card);
    return;
  }

  // documents.py devolve {"error": "..."} quando a função Python
  // lança exceção (campo em falta, URL de imagem que falha, etc).
  if (typeof result.error === 'string') {
    const errBox = document.createElement('div');
    errBox.className = 'errBox';
    errBox.textContent = 'Erro do servidor (Python):\n' + result.error;
    card.appendChild(errBox);
    out.appendChild(card);
    return;
  }

  if (result.found === false) {
    const errBox = document.createElement('div');
    errBox.className = 'errBox';
    errBox.textContent = 'found: false\nreason: ' + (result.reason || '(sem reason)');
    card.appendChild(errBox);
    out.appendChild(card);
    return;
  }

  const rawCfg = RAW_FIELD_BY_TOOL[toolName];
  let base64Str = null, mime = null, filename = null;

  if (rawCfg && typeof result[rawCfg.field] === 'string' && result[rawCfg.field].length > 0) {
    base64Str = result[rawCfg.field];
    mime = rawCfg.mime;
    filename = `documento.${rawCfg.ext}`;
  } else if (typeof result.content_base64 === 'string' && result.content_base64.length > 0) {
    base64Str = result.content_base64;
    mime = result.mime_type || 'application/octet-stream';
    filename = result.filename || 'ficheiro';
  }

  if (!base64Str) {
    card.innerHTML += '<span class="err">Sem content_base64 nem pdf_base64/docx_base64/xlsx_base64/pptx_base64 na resposta.</span>';
    out.appendChild(card);
    return;
  }

  const link = document.createElement('a');
  link.className = 'dl';
  link.href = `data:${mime};base64,${base64Str}`;
  link.download = filename;
  link.textContent = `⬇ ${filename} (${mime})`;
  card.appendChild(document.createTextNode('Documento pronto:'));
  card.appendChild(document.createElement('br'));
  card.appendChild(link);

  if (result.label) {
    card.appendChild(document.createElement('br'));
    const lbl = document.createElement('span');
    lbl.style.color = '#777';
    lbl.style.fontSize = '11px';
    lbl.textContent = `label: ${result.label}`;
    card.appendChild(lbl);
  }

  // Preview inline: só o browser sabe renderizar PDF via <iframe>
  // com data URL. DOCX/XLSX/PPTX ficam só com o link de download.
  if (mime === 'application/pdf') {
    const iframe = document.createElement('iframe');
    iframe.id = 'pdfPreview';
    iframe.src = `data:${mime};base64,${base64Str}`;
    card.appendChild(document.createElement('br'));
    card.appendChild(iframe);
  }

  out.appendChild(card);
}
</script>
