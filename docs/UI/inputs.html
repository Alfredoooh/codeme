<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inputs</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 40px 20px 80px;
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .group-label {
      font-size: 11px;
      font-weight: 700;
      color: #4a4a4a;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 0 2px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: #ccc;
      padding: 0 4px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hint {
      font-size: 12px;
      color: #666;
      padding: 0 16px;
    }

    .hint.error {
      color: #e08080;
    }

    /* ---------- Base input ---------- */
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: #1c1c1e;
      border-radius: 50px;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: inset 0 0 0 1.5px transparent;
    }

    .input-wrap:focus-within {
      background: #202022;
      box-shadow: inset 0 0 0 1.5px #2e8bc9;
    }

    .input-wrap.error {
      box-shadow: inset 0 0 0 1.5px #e05e5e;
    }

    .input-wrap .icon-left {
      padding-left: 18px;
      color: #666;
      font-size: 14px;
      flex-shrink: 0;
    }

    .input-wrap:focus-within .icon-left {
      color: #2e8bc9;
    }

    .input-wrap.error .icon-left {
      color: #e05e5e;
    }

    input, textarea {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      width: 100%;
      padding: 13px 18px;
    }

    .input-wrap .icon-left + input {
      padding-left: 10px;
    }

    input::placeholder, textarea::placeholder {
      color: #5a5a5a;
      font-weight: 400;
    }

    .icon-right {
      padding-right: 16px;
      color: #666;
      font-size: 13px;
      display: flex;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .icon-right:hover { color: #aaa; }

    .clear-btn {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #333;
      color: #999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      cursor: pointer;
      flex-shrink: 0;
      margin-right: 14px;
      transition: background-color 0.15s ease;
    }

    .clear-btn:hover { background: #3d3d3d; color: #fff; }

    /* ---------- Tamanhos ---------- */
    .input-sm input { padding: 9px 16px; font-size: 13px; }
    .input-lg input { padding: 16px 20px; font-size: 15px; }

    /* ---------- Textarea (cantos menos extremos, é multi-linha) ---------- */
    .textarea-wrap {
      background: #1c1c1e;
      border-radius: 24px;
      box-shadow: inset 0 0 0 1.5px transparent;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .textarea-wrap:focus-within {
      background: #202022;
      box-shadow: inset 0 0 0 1.5px #2e8bc9;
    }

    textarea {
      resize: none;
      min-height: 90px;
      line-height: 1.5;
      padding: 14px 18px;
    }

    /* ---------- Search ---------- */
    .search-wrap {
      background: #1a1a1a;
    }

    /* ---------- Disabled ---------- */
    .input-wrap.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* ---------- Toggle / Switch ---------- */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1c1c1e;
      border-radius: 20px;
      padding: 14px 18px;
    }

    .switch-row .label {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .switch-row .sublabel {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
    }

    .switch {
      position: relative;
      width: 46px;
      height: 27px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      padding: 0;
    }

    .switch .track {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 50px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .switch .track::before {
      content: '';
      position: absolute;
      width: 23px;
      height: 23px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }

    .switch input:checked + .track {
      background: #2e8bc9;
    }

    .switch input:checked + .track::before {
      transform: translateX(19px);
    }

    /* ---------- Checkbox ---------- */
    .check-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1c1c1e;
      border-radius: 18px;
      padding: 13px 16px;
      cursor: pointer;
    }

    .checkbox {
      position: relative;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .checkbox input {
      opacity: 0;
      width: 22px;
      height: 22px;
      padding: 0;
      position: absolute;
      cursor: pointer;
      margin: 0;
    }

    .checkbox .box {
      position: absolute;
      inset: 0;
      background: #2a2a2a;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 12px;
      transition: background-color 0.15s ease;
      pointer-events: none;
    }

    .checkbox input:checked + .box {
      background: #2e8bc9;
      color: #fff;
    }

    .check-row .label {
      font-size: 14px;
      font-weight: 500;
      color: #ddd;
    }

    /* ---------- Radio ---------- */
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .radio-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1c1c1e;
      border-radius: 18px;
      padding: 13px 16px;
      cursor: pointer;
    }

    .radio {
      position: relative;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .radio input {
      opacity: 0;
      width: 22px;
      height: 22px;
      position: absolute;
      cursor: pointer;
      margin: 0;
      padding: 0;
    }

    .radio .dot {
      position: absolute;
      inset: 0;
      background: #2a2a2a;
      border-radius: 50%;
      pointer-events: none;
      transition: background-color 0.15s ease;
    }

    .radio .dot::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.15s ease;
    }

    .radio input:checked + .dot {
      background: #2e8bc9;
    }

    .radio input:checked + .dot::after {
      transform: translate(-50%, -50%) scale(1);
    }

    /* ---------- OTP / código ---------- */
    .otp-row {
      display: flex;
      gap: 8px;
    }

    .otp-digit {
      width: 46px;
      height: 54px;
      background: #1c1c1e;
      border-radius: 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      box-shadow: inset 0 0 0 1.5px transparent;
    }

    .otp-digit:focus {
      background: #202022;
      box-shadow: inset 0 0 0 1.5px #2e8bc9;
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="group">
      <div class="group-label">Texto simples</div>
      <div class="field">
        <div class="field-label">Nome do evento</div>
        <div class="input-wrap">
          <input type="text" placeholder="Reunião de equipa" />
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-label">Com ícone</div>
      <div class="field">
        <div class="input-wrap">
          <span class="icon-left"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" placeholder="Email" />
        </div>
      </div>
      <div class="field">
        <div class="input-wrap">
          <span class="icon-left"><i class="fa-solid fa-lock"></i></span>
          <input type="password" placeholder="Palavra-passe" />
          <span class="icon-right"><i class="fa-solid fa-eye"></i></span>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-label">Search com clear</div>
      <div class="field">
        <div class="input-wrap search-wrap">
          <span class="icon-left"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input type="text" placeholder="Pesquisar eventos" value="Reunião" />
          <span class="clear-btn"><i class="fa-solid fa-xmark"></i></span>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-label">Estado de erro</div>
      <div class="field">
        <div class="field-label">Título</div>
        <div class="input-wrap error">
          <span class="icon-left"><i class="fa-solid fa-triangle-exclamation"></i></span>
          <input type="text" placeholder="Título do evento" />
        </div>
        <div class="hint error">Este campo é obrigatório</div>
      </div>
    </div>

    <div class="group">
      <div class="group-label">Tamanhos</div>
      <div class="field">
        <div class="input-wrap input-sm">
          <input type="text" placeholder="Pequeno" />
        </div>
      </div>
      <div class="field">
        <div class="input-wrap">
          <input type="text" placeholder="Médio" />
        </div>
      </div>
      <div class="field">
        <div class="input-wrap input-lg">
          <input type="text" placeholder="Grande" />
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-label">Desativado</div>
      <div class="field">
        <div class="input-wrap disabled">
          <input type="text" placeholder="Indisponível" disabled />
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-label">Textarea</div>
      <div class="field">
        <div class="field-label">Notas</div>
        <div class="textarea-wrap">
          <textarea placeholder="Adiciona uma descrição..."></textarea>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-label">Código OTP</div>
      <div class="otp-row">
        <input class="otp-digit" maxlength="1" value="4" />
        <input class="otp-digit" maxlength="1" value="2" />
        <input class="otp-digit" maxlength="1" />
        <input class="otp-digit" maxlength="1" />
      </div>
    </div>

    <div class="group">
      <div class="group-label">Switch</div>
      <div class="switch-row">
        <div>
          <div class="label">Notificações</div>
          <div class="sublabel">Alertas antes de cada evento</div>
        </div>
        <label class="switch">
          <input type="checkbox" checked />
          <span class="track"></span>
        </label>
      </div>
      <div class="switch-row">
        <div>
          <div class="label">Repetir semanalmente</div>
        </div>
        <label class="switch">
          <input type="checkbox" />
          <span class="track"></span>
        </label>
      </div>
    </div>

    <div class="group">
      <div class="group-label">Checkbox</div>
      <label class="check-row">
        <div class="checkbox">
          <input type="checkbox" checked />
          <span class="box"><i class="fa-solid fa-check"></i></span>
        </div>
        <span class="label">Enviar convite por email</span>
      </label>
      <label class="check-row">
        <div class="checkbox">
          <input type="checkbox" />
          <span class="box"><i class="fa-solid fa-check"></i></span>
        </div>
        <span class="label">Marcar como privado</span>
      </label>
    </div>

    <div class="group">
      <div class="group-label">Radio</div>
      <div class="radio-group">
        <label class="radio-row">
          <div class="radio">
            <input type="radio" name="freq" checked />
            <span class="dot"></span>
          </div>
          <span class="label">Não repetir</span>
        </label>
        <label class="radio-row">
          <div class="radio">
            <input type="radio" name="freq" />
            <span class="dot"></span>
          </div>
          <span class="label">Todos os dias</span>
        </label>
        <label class="radio-row">
          <div class="radio">
            <input type="radio" name="freq" />
            <span class="dot"></span>
          </div>
          <span class="label">Todas as semanas</span>
        </label>
      </div>
    </div>

  </div>
</body>
</html>
