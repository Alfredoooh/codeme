<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML → Imagem</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #111;
    --surface: #1c1c1e;
    --surface-alt: #232325;
    --border: #2e2e30;
    --accent: #2e8bc9;
    --accent-hover: #3a9cdb;
    --text: #f2f2f2;
    --text-dim: #9a9a9d;
    --danger: #d9534f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 32px 20px 60px;
  }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 28px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 6px;
  }

  .sub {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  @media (min-width: 860px) {
    .grid {
      grid-template-columns: 1fr 1fr;
    }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
  }

  textarea {
    width: 100%;
    min-height: 320px;
    resize: vertical;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    padding: 14px;
    font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    outline: none;
  }

  textarea:focus {
    border-color: var(--accent);
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 12px;
    color: var(--text-dim);
  }

  input[type="number"], select {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    outline: none;
  }

  input[type="number"] {
    width: 90px;
  }

  input[type="color"] {
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: none;
    padding: 0;
    cursor: pointer;
  }

  .btn {
    border: none;
    border-radius: 999px;
    padding: 11px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--accent-hover);
  }

  .btn-ghost {
    background: var(--surface-alt);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover {
    border-color: var(--accent);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .preview-shell {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 14px;
    min-height: 320px;
    max-height: 520px;
    overflow: auto;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
  }

  #renderTarget {
    display: inline-block;
  }

  .result-img {
    max-width: 100%;
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .status {
    font-size: 12px;
    color: var(--text-dim);
    min-height: 16px;
  }

  .status.error {
    color: var(--danger);
  }

  .status.ok {
    color: #6fcf97;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>HTML → Imagem</h1>
    <p class="sub">Cole um trecho de HTML, veja a pré-visualização e baixe como PNG real.</p>
  </header>

  <div class="grid">
    <div class="card">
      <div class="card-title">Código HTML</div>
      <textarea id="htmlInput" spellcheck="false">&lt;div style="padding:40px; background:linear-gradient(135deg,#2e8bc9,#1c1c1e); border-radius:24px; font-family:sans-serif; color:#fff; width:500px;"&gt;
  &lt;h2 style="margin:0 0 12px;"&gt;Título de exemplo&lt;/h2&gt;
  &lt;p style="margin:0; opacity:0.85;"&gt;Edite este HTML e clique em "Gerar imagem" para converter em PNG.&lt;/p&gt;
&lt;/div&gt;</textarea>

      <div class="row">
        <div class="field">
          <label for="scale">Escala</label>
          <input type="number" id="scale" value="2" min="1" max="4" step="1">
        </div>
        <div class="field">
          <label for="bgColor">Fundo</label>
          <input type="color" id="bgColor" value="#ffffff">
        </div>
        <div class="field">
          <label for="transparentBg">Transparente</label>
          <select id="transparentBg">
            <option value="no">Não</option>
            <option value="yes">Sim</option>
          </select>
        </div>
      </div>

      <div class="row">
        <button class="btn btn-primary" id="renderBtn">Gerar imagem</button>
        <button class="btn btn-ghost" id="downloadBtn" disabled>Baixar PNG</button>
      </div>

      <div class="status" id="statusMsg"></div>
    </div>

    <div class="card">
      <div class="card-title">Pré-visualização / Resultado</div>
      <div class="preview-shell">
        <div id="renderTarget"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const htmlInput = document.getElementById('htmlInput');
  const renderTarget = document.getElementById('renderTarget');
  const renderBtn = document.getElementById('renderBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const scaleInput = document.getElementById('scale');
  const bgColorInput = document.getElementById('bgColor');
  const transparentSelect = document.getElementById('transparentBg');
  const statusMsg = document.getElementById('statusMsg');

  let lastCanvas = null;

  function setStatus(msg, type) {
    statusMsg.textContent = msg || '';
    statusMsg.className = 'status' + (type ? ' ' + type : '');
  }

  async function renderToImage() {
    const rawHtml = htmlInput.value;

    if (!rawHtml.trim()) {
      setStatus('Cole algum HTML antes de gerar a imagem.', 'error');
      return;
    }

    setStatus('Renderizando...', '');
    renderBtn.disabled = true;
    downloadBtn.disabled = true;

    // limpa alvo anterior
    renderTarget.innerHTML = '';

    // cria um container isolado para não herdar estilos da página
    const container = document.createElement('div');
    container.style.display = 'inline-block';
    container.innerHTML = rawHtml;
    renderTarget.appendChild(container);

    // espera imagens internas carregarem, se houver
    const imgs = container.querySelectorAll('img');
    if (imgs.length) {
      await Promise.all(Array.from(imgs).map(img => {
        if (img.complete) return Promise.resolve();
        return new Promise(res => {
          img.addEventListener('load', res, { once: true });
          img.addEventListener('error', res, { once: true });
        });
      }));
    }

    const scale = Math.max(1, Math.min(4, parseInt(scaleInput.value, 10) || 2));
    const isTransparent = transparentSelect.value === 'yes';

    try {
      const canvas = await html2canvas(container, {
        backgroundColor: isTransparent ? null : bgColorInput.value,
        scale: scale,
        useCORS: true,
        logging: false
      });

      lastCanvas = canvas;

      // troca a pré-visualização pela imagem resultante
      renderTarget.innerHTML = '';
      const img = document.createElement('img');
      img.className = 'result-img';
      img.src = canvas.toDataURL('image/png');
      renderTarget.appendChild(img);

      downloadBtn.disabled = false;
      setStatus('Imagem gerada com sucesso.', 'ok');
    } catch (err) {
      console.error(err);
      setStatus('Erro ao gerar imagem: ' + err.message, 'error');
    } finally {
      renderBtn.disabled = false;
    }
  }

  function downloadImage() {
    if (!lastCanvas) return;
    const link = document.createElement('a');
    link.download = 'html-para-imagem.png';
    link.href = lastCanvas.toDataURL('image/png');
    link.click();
  }

  renderBtn.addEventListener('click', renderToImage);
  downloadBtn.addEventListener('click', downloadImage);
</script>

</body>
</html>
