<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste de Tools — Worker</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0d0d0d;
    color: #eee;
    margin: 0;
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  h2 { font-size: 14px; color: #999; margin-top: 24px; margin-bottom: 8px; }
  input, select, textarea, button {
    width: 100%;
    padding: 10px;
    margin: 4px 0;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #eee;
    font-size: 14px;
  }
  textarea { min-height: 60px; font-family: monospace; }
  button {
    background: #6F5AF6;
    border: none;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
  }
  button:disabled { opacity: 0.5; }
  #status {
    font-size: 12px;
    color: #999;
    margin: 8px 0;
    white-space: pre-wrap;
  }
  #rawOutput {
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    font-family: monospace;
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 300px;
    overflow-y: auto;
    margin-top: 12px;
  }
  #renderOutput { margin-top: 16px; }
  #renderOutput img { max-width: 100%; border-radius: 8px; margin: 4px 0; display: block; }
  .card {
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    margin: 8px 0;
    background: #1a1a1a;
  }
  .ok { color: #4ade80; }
  .err { color: #f87171; }
  .imgRow { display: flex; gap: 8px; overflow-x: auto; }
  .imgRow img { width: 120px; height: 120px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  a.dl { color: #6F5AF6; word-break: break-all; }
</style>
</head>
<body>

<h1>Teste de Tools — Worker</h1>
<div id="status">Não autenticado</div>

<h2>1. Login</h2>
<input id="apiBase" value="https://ipc.alfredopjonas.workers.dev" placeholder="API base">
<input id="email" placeholder="email">
<input id="password" type="password" placeholder="password">
<button onclick="doLogin()">Entrar</button>

<h2>2. Escolher tool</h2>
<select id="toolName" onchange="updateInputHint()">
  <option value="web_search">web_search</option>
  <option value="search_images" selected>search_images</option>
  <option value="search_market">search_market</option>
  <option value="search_place">search_place</option>
  <option value="search_calendar_date">search_calendar_date</option>
  <option value="get_weather">get_weather</option>
  <option value="generate_chart">generate_chart</option>
  <option value="generate_mindmap">generate_mindmap</option>
  <option value="generate_qrcode">generate_qrcode</option>
  <option value="generate_barcode">generate_barcode</option>
  <option value="generate_math">generate_math</option>
  <option value="generate_table_image">generate_table_image</option>
  <option value="create_pdf">create_pdf</option>
  <option value="create_docx">create_docx</option>
  <option value="create_xlsx">create_xlsx</option>
  <option value="create_pptx">create_pptx</option>
</select>
<div id="inputHint" style="font-size:11px;color:#777;margin-bottom:4px;"></div>
<textarea id="toolInput">{"query":"Cristiano Ronaldo"}</textarea>
<button id="runBtn" onclick="runTool()" disabled>Executar tool</button>

<div id="renderOutput"></div>
<div id="rawOutput"></div>

<script>
let TOKEN = null;

const PRESETS = {
  web_search: '{"query":"resultado do jogo de ontem"}',
  search_images: '{"query":"Cristiano Ronaldo"}',
  search_market: '{"query":"bitcoin"}',
  search_place: '{"query":"Torre Eiffel"}',
  search_calendar_date: '{"query":"amanhã"}',
  get_weather: '{"city":"Lisboa"}',
  generate_chart: '{"chart_type":"bar","title":"Teste","labels":["Jan","Fev","Mar"],"datasets":[{"label":"Vendas","data":[10,20,15]}]}',
  generate_mindmap: '{"root":{"label":"Raiz","children":[{"label":"Filho A"},{"label":"Filho B"}]}}',
  generate_qrcode: '{"content":"https://exemplo.com","size":300}',
  generate_barcode: '{"content":"123456789012","format":"code128"}',
  generate_math: '{"expression":"2^10"}',
  generate_table_image: '{"title":"Tabela Teste","headers":["Nome","Idade"],"rows":[["Ana","30"],["Bruno","25"]]}',
  create_pdf: '{"title":"Documento Teste","html_content":"<h1>Titulo</h1><p>Paragrafo de teste.</p><ul><li>Item 1</li><li>Item 2</li></ul>"}',
  create_docx: '{"title":"Documento Teste","html_content":"<h1>Titulo</h1><p>Paragrafo de teste.</p>"}',
  create_xlsx: '{"sheet_name":"Dados","headers":["Nome","Idade"],"rows":[["Ana","30"],["Bruno","25"]]}',
  create_pptx: '{"title":"Apresentacao Teste","slides":[{"heading":"Slide 1","bullets":["Ponto A","Ponto B"]}]}',
};

function updateInputHint() {
  const name = document.getElementById('toolName').value;
  document.getElementById('toolInput').value = PRESETS[name] || '{}';
  document.getElementById('inputHint').textContent = 'Preset carregado — edita se quiseres';
}
updateInputHint();

function setStatus(text, cls) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = cls || '';
}

async function doLogin() {
  const base = document.getElementById('apiBase').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  setStatus('A autenticar...');
  try {
    const res = await fetch(`${base}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    if (!data.token) throw new Error('Login respondeu sem campo "token": ' + JSON.stringify(data));
    TOKEN = data.token;
    setStatus('✓ Autenticado. Token guardado em memória.', 'ok');
    document.getElementById('runBtn').disabled = false;
  } catch (e) {
    setStatus('✗ Erro no login: ' + e.message, 'err');
    document.getElementById('runBtn').disabled = true;
  }
}

async function runTool() {
  const base = document.getElementById('apiBase').value.trim();
  const name = document.getElementById('toolName').value;
  let input;
  try {
    input = JSON.parse(document.getElementById('toolInput').value);
  } catch (e) {
    setStatus('✗ JSON de input inválido: ' + e.message, 'err');
    return;
  }

  document.getElementById('renderOutput').innerHTML = '';
  document.getElementById('rawOutput').textContent = '';
  setStatus(`A executar "${name}"...`);
  const startTime = performance.now();

  try {
    const res = await fetch(`${base}/tools/execute`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${TOKEN}`,
      },
      body: JSON.stringify({ name, input }),
    });
    const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
    const data = await res.json();

    if (!res.ok) {
      setStatus(`✗ HTTP ${res.status} após ${elapsed}s`, 'err');
      document.getElementById('rawOutput').textContent = JSON.stringify(data, null, 2);
      return;
    }

    setStatus(`✓ Resposta recebida em ${elapsed}s. Vê abaixo o JSON bruto e a renderização.`, 'ok');
    document.getElementById('rawOutput').textContent = JSON.stringify(data, null, 2);

    renderResult(name, data);
  } catch (e) {
    setStatus('✗ Erro de rede/fetch: ' + e.message, 'err');
  }
}

function renderResult(toolName, data) {
  const out = document.getElementById('renderOutput');
  out.innerHTML = '';

  // O worker devolve { tool_name, result }. Extraímos result tal
  // como o app Flutter faz em ToolsApiService.executeTool.
  const result = data.result !== undefined ? data.result : data;

  const card = document.createElement('div');
  card.className = 'card';

  if (result === null || result === undefined) {
    card.innerHTML = '<span class="err">result veio null/undefined — nada para renderizar.</span>';
    out.appendChild(card);
    return;
  }

  if (result.found === false) {
    card.innerHTML = `<span class="err">found: false</span><br>reason: ${escapeHtml(result.reason || '(sem reason)')}`;
    out.appendChild(card);
    return;
  }

  // search_images — testa exatamente a chave que buildImagesMarker usa: images[].imageUrl
  if (toolName === 'search_images') {
    if (!Array.isArray(result.images) || result.images.length === 0) {
      card.innerHTML = '<span class="err">Sem campo "images" (array) ou array vazio. O app espera exatamente result.images[].imageUrl</span>';
    } else {
      const row = document.createElement('div');
      row.className = 'imgRow';
      result.images.forEach(img => {
        if (!img.imageUrl) return;
        const im = document.createElement('img');
        im.src = img.imageUrl;
        im.title = img.title || '';
        im.onerror = () => { im.style.border = '2px solid #f87171'; im.alt = 'FALHOU AO CARREGAR'; };
        row.appendChild(im);
      });
      card.appendChild(document.createTextNode(`${result.images.length} imagens encontradas:`));
      card.appendChild(row);
    }
    out.appendChild(card);
    return;
  }

  // tools visuais/documento — testa exatamente a chave que o app lê: content_base64
  const hasBase64 = typeof result.content_base64 === 'string' && result.content_base64.length > 0;
  if (!hasBase64) {
    card.innerHTML = '<span class="err">Sem campo "content_base64" (string não-vazia). O app procura exatamente result.content_base64 — sem isto, nenhum card aparece no Flutter.</span>';
    out.appendChild(card);
    return;
  }

  const mime = result.mime_type || 'application/octet-stream';
  const isImage = mime.startsWith('image/');

  if (isImage) {
    const img = document.createElement('img');
    img.src = `data:${mime};base64,${result.content_base64}`;
    card.appendChild(document.createTextNode('content_base64 presente e é imagem — renderizado abaixo:'));
    card.appendChild(img);
  } else {
    const link = document.createElement('a');
    link.className = 'dl';
    link.href = `data:${mime};base64,${result.content_base64}`;
    link.download = result.filename || 'ficheiro';
    link.textContent = `⬇ ${result.filename || 'download'} (${mime})`;
    card.appendChild(document.createTextNode('content_base64 presente — documento pronto:'));
    card.appendChild(document.createElement('br'));
    card.appendChild(link);
  }
  out.appendChild(card);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
