<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teste Nexa</title>
</head>
<body style="margin:0;padding:40px;font-family:sans-serif;background:#fff;color:#000;">
<div id="root">A carregar...</div>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1"
  }
}
</script>
<script type="module">
  import React from "react";
  import ReactDOM from "react-dom/client";

  const root = document.getElementById("root");
  root.textContent = "Módulos ES a carregar...";

  try {
    const container = document.getElementById("root");
    const reactRoot = ReactDOM.createRoot(container);
    reactRoot.render(React.createElement("h1", null, "Funciona! React " + React.version));
  } catch (err) {
    root.textContent = "ERRO: " + err.message;
    root.style.color = "red";
  }
</script>
</body>
</html>
