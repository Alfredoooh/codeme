name: nexa
description: CodeMe App - Custom UI Native

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_svg: ^2.0.10+1
  file_picker: ^8.0.0
  image_picker: ^1.2.3
  image_cropper: any
  youtube_explode_dart: ^2.0.0
  just_audio: ^0.9.36
  geolocator: any
  http: any
  shared_preferences: any
  clipboard: ^0.1.3
  math_expressions: ^2.6.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  pdf: ^3.10.0
  html: ^0.15.0
  archive: ^3.4.0
  pdfx: ^2.6.0
  share_plus: any
  path_provider: any
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  visibility_detector: ^0.4.0+2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/outline/
    - assets/fonts/
    - assets/icons/png/
    - assets/icons/apps/
    - assets/editor/docs.html
    - assets/editor/sheets.html
    - assets/editor/slides.html
    #- assets/logo.png
    - assets/images/background1.jpg

  fonts:
    - family: IndispensableSerif
      fonts:
        - asset: assets/fonts/IndispensableSerif.ttf