name: nexa
description: AI.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.12.1
  record: ^6.2.0
  animated_check: ^1.0.0
  google_fonts: ^6.2.1
  flutter_inappwebview: ^6.1.5
  flutter_svg: ^2.0.10+1
  file_picker: ^8.0.0
  image_picker: ^1.2.3
  image_cropper: ^11.0.0
  url_launcher: ^6.3.2
  youtube_explode_dart: ^2.0.0
  just_audio: ^0.9.36
  geolocator: ^14.0.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  clipboard: ^0.1.3
  math_expressions: ^2.6.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  pdf: ^3.10.0
  html: ^0.15.0
  archive: ^3.4.0
  pdfx: ^2.6.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  visibility_detector: ^0.4.0+2
  flutter_image_compress: ^2.3.0
  lottie: ^3.1.2

  qr_flutter: ^4.1.0
  qr: ^3.0.2
  barcode: ^2.2.8
  excel: ^4.0.6
  syncfusion_flutter_pdf: ^27.1.48
  fl_chart: ^0.69.0
  google_mlkit_text_recognition: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/apps/apps.json
    - assets/icons/outline/
    - assets/icons/editor/
    - assets/fonts/
    - assets/images/logo.svg
    - assets/images/background.png
    - assets/fonts/inter/
    - assets/icons/png/
    - assets/icons/apps/
    - assets/icons/lottie/
    - assets/apps/docs/manifest.json
    - assets/apps/docs/docs.mcp.json
    - assets/apps/sheets/manifest.json
    - assets/apps/sheets/sheets.mcp.json
    - assets/apps/slides/manifest.json
    - assets/apps/slides/slides.mcp.json
    - assets/apps/sound/manifest.json
    - assets/apps/sound/sound.mcp.json
    - assets/editor/docs.html
    - assets/editor/sheets.html
    - assets/editor/slides.html

  fonts:
    - family: IndispensableSerif
      fonts:
        - asset: assets/fonts/IndispensableSerif.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter_24pt-SemiBold.ttf
          weight: 600
    - family: TimesNewRoman
      fonts:
        - asset: assets/fonts/Times New Roman/regular.ttf
        - asset: assets/fonts/Times New Roman/bold.ttf
          weight: 700
        - asset: assets/fonts/Times New Roman/italic.ttf
          style: italic
        - asset: assets/fonts/Times New Roman/bold_italic.ttf
          weight: 700
          style: italic