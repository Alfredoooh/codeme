<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Biblioteca — Vibely</title>
<link rel="stylesheet" href="css/theme.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

<div class="top-bar">
    <button class="icon-btn" onclick="VibelyBridge.openDrawer()">
        <ion-icon name="menu-outline"></ion-icon>
    </button>
    <div class="title">Biblioteca</div>
    <button class="icon-btn" onclick="VibelyBridge.navigateTo('search')">
        <ion-icon name="search-outline"></ion-icon>
    </button>
</div>

<div class="content with-mini-player">
    <div style="padding: 16px; text-align:center; color: var(--on-surface-variant); font-size: 14px; margin-top: 40px;">
        A tua biblioteca está vazia.
    </div>
</div>

<div class="bottom-nav">
    <div class="bottom-nav-item" onclick="VibelyBridge.navigateTo('home')">
        <ion-icon name="home-outline"></ion-icon>
        <span>Início</span>
    </div>
    <div class="bottom-nav-item" onclick="VibelyBridge.navigateTo('search')">
        <ion-icon name="search-outline"></ion-icon>
        <span>Pesquisar</span>
    </div>
    <div class="bottom-nav-item active">
        <ion-icon name="albums"></ion-icon>
        <span>Biblioteca</span>
    </div>
</div>

<div class="drawer-overlay" id="drawer-overlay" onclick="VibelyBridge.closeDrawer()"></div>
<div class="drawer" id="drawer">
    <div class="drawer-header">
        <div class="drawer-logo">V</div>
        <div class="drawer-title">Vibely</div>
    </div>
    <div class="drawer-item" onclick="VibelyBridge.navigateTo('settings')">
        <ion-icon name="settings-outline"></ion-icon>
        <span>Configurações</span>
    </div>
    <div class="drawer-item">
        <ion-icon name="rocket-outline"></ion-icon>
        <span>Upgrade</span>
    </div>
</div>

<script src="js/bridge.js"></script>
<script src="js/mini-player.js"></script>
</body>
</html>
