<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Configurações — Vibely</title>
<link rel="stylesheet" href="css/theme.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

<div class="top-bar">
    <button class="icon-btn" onclick="VibelyBridge.goBack()">
        <ion-icon name="chevron-back-outline"></ion-icon>
    </button>
    <div class="title">Configurações</div>
    <div style="width:40px;"></div>
</div>

<div class="content" style="padding: 0 8px;">

    <div class="section-label">Aparência</div>

    <input type="radio" name="theme-option" id="theme-light" value="light" onclick="handleThemeChange('light')">
    <label for="theme-light" class="theme-option">
        <div class="theme-option-left">
            <ion-icon name="sunny-outline"></ion-icon>
            <span class="settings-row-label">Claro</span>
        </div>
        <ion-icon name="checkmark" class="check"></ion-icon>
    </label>

    <input type="radio" name="theme-option" id="theme-dark" value="dark" onclick="handleThemeChange('dark')">
    <label for="theme-dark" class="theme-option">
        <div class="theme-option-left">
            <ion-icon name="moon-outline"></ion-icon>
            <span class="settings-row-label">Escuro</span>
        </div>
        <ion-icon name="checkmark" class="check"></ion-icon>
    </label>

    <input type="radio" name="theme-option" id="theme-system" value="system" onclick="handleThemeChange('system')">
    <label for="theme-system" class="theme-option">
        <div class="theme-option-left">
            <ion-icon name="phone-portrait-outline"></ion-icon>
            <span class="settings-row-label">Automático (sistema)</span>
        </div>
        <ion-icon name="checkmark" class="check"></ion-icon>
    </label>

    <div class="section-label">Sobre</div>
    <div class="settings-row">
        <span class="settings-row-label">Versão</span>
        <span style="color: var(--on-surface-variant); font-size: 14px;">1.0</span>
    </div>

</div>

<script src="js/bridge.js"></script>
<script>
function handleThemeChange(value) {
    VibelyBridge.setTheme(value);
}
</script>
</body>
</html>
