<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Pesquisar — Vibely</title>
<link rel="stylesheet" href="css/theme.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

<div class="top-bar">
    <button class="icon-btn" onclick="VibelyBridge.goBack()">
        <ion-icon name="chevron-back-outline"></ion-icon>
    </button>
    <div class="title">Pesquisar</div>
    <div style="width:40px;"></div>
</div>

<div class="search-bar-wrap">
    <div class="search-input-box">
        <ion-icon name="search-outline"></ion-icon>
        <input type="text" id="search-input" placeholder="Músicas, artistas..." autocomplete="off">
    </div>
</div>

<div class="content with-mini-player" id="results-container">
    <div class="empty-state">Pesquisa por uma música ou artista</div>
</div>

<script src="js/bridge.js"></script>
<script src="js/mini-player.js"></script>
<script>
let searchTimeout = null;
let lastResults = [];
const input = document.getElementById('search-input');
const container = document.getElementById('results-container');

input.addEventListener('input', function() {
    clearTimeout(searchTimeout);
    const query = input.value.trim();
    if (query.length === 0) {
        container.innerHTML = '<div class="empty-state">Pesquisa por uma música ou artista</div>';
        return;
    }
    searchTimeout = setTimeout(function() { performSearch(query); }, 500);
});

function performSearch(query) {
    container.innerHTML = '<div class="loading-state">A pesquisar...</div>';
    VibelyBridge.searchMusic(query, function(resultsJson) {
        try {
            const results = typeof resultsJson === 'string' ? JSON.parse(resultsJson) : resultsJson;
            lastResults = results;
            renderResults(results);
        } catch (e) {
            container.innerHTML = '<div class="empty-state">Erro ao processar resultados</div>';
        }
    });
}

function renderResults(results) {
    if (!results || results.length === 0) {
        container.innerHTML = '<div class="empty-state">Nenhum resultado encontrado</div>';
        return;
    }
    let html = '';
    results.forEach(function(item, index) {
        const thumb = item.thumbnail || '';
        const title = escapeHtml(item.title || '');
        const channel = escapeHtml(item.channel || '');
        const duration = escapeHtml(item.duration || '');
        html += '<div class="result-item" data-index="' + index + '" id="result-' + item.videoId + '" onclick="handlePlay(' + index + ')">' +
            '<div class="result-thumb-wrap">' +
                '<img class="result-thumb" src="' + thumb + '" loading="lazy">' +
                '<div class="result-thumb-play-overlay" id="overlay-' + item.videoId + '"><ion-icon name="play"></ion-icon></div>' +
            '</div>' +
            '<div class="result-info">' +
                '<div class="result-title">' + title + '</div>' +
                '<div class="result-meta">' + channel + '</div>' +
            '</div>' +
            '<div class="result-duration">' + duration + '</div>' +
        '</div>';
    });
    container.innerHTML = html;
}

function handlePlay(index) {
    const item = lastResults[index];
    if (!item) return;
    VibelyBridge.playTrack(item.videoId, item.url, item.title, item.channel, item.thumbnail);
    document.querySelectorAll('.result-item').forEach(function(el) { el.classList.remove('playing'); });
    const row = document.getElementById('result-' + item.videoId);
    if (row) row.classList.add('playing');
}

window.onTrackPlayingStateChanged = function(isPlaying, isLoading, videoId) {
    document.querySelectorAll('.result-thumb-play-overlay').forEach(function(el) { el.classList.remove('visible'); });
    if (videoId) {
        const overlay = document.getElementById('overlay-' + videoId);
        if (overlay) {
            overlay.classList.add('visible');
            overlay.querySelector('ion-icon').setAttribute('name', isLoading ? 'hourglass-outline' : (isPlaying ? 'pause' : 'play'));
        }
    }
};

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}
</script>
</body>
</html>
