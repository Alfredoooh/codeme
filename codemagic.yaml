      - name: Start shimmer AnimationDrawable on window focus (pré-Android 12)
        script: |
          MAIN_ACTIVITY=$(find "${CM_BUILD_DIR}/android/app/src/main" -name "MainActivity.kt" -o -name "MainActivity.java" | head -1)
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "❌ MainActivity não encontrada — não é possível iniciar o AnimationDrawable do shimmer"
            exit 1
          fi
          echo "MainActivity encontrada em: $MAIN_ACTIVITY"

          python3 << PYEOF
          import re

          path = "$MAIN_ACTIVITY"
          with open(path, "r") as f:
              content = f.read()

          is_kotlin = path.endswith(".kt")

          if is_kotlin:
              if "onWindowFocusChanged" not in content:
                  marker = "class MainActivity"
                  idx = content.find(marker)
                  if idx == -1:
                      raise SystemExit("❌ Declaração de MainActivity não encontrada no Kotlin")
                  brace_idx = content.find("{", idx)
                  injected = content[:brace_idx+1] + '''

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) {
                      val bg = window.decorView.background
                      if (bg is android.graphics.drawable.LayerDrawable) {
                          for (i in 0 until bg.numberOfLayers) {
                              val d = bg.getDrawable(i)
                              if (d is android.graphics.drawable.AnimationDrawable) {
                                  d.start()
                              }
                          }
                      }
                  }
              }
          ''' + content[brace_idx+1:]
                  with open(path, "w") as f:
                      f.write(injected)
                  print("✅ onWindowFocusChanged (start do shimmer) injetado em MainActivity.kt")
              else:
                  print("✅ onWindowFocusChanged já presente em MainActivity.kt — verificar manualmente se inicia o shimmer")
          else:
              if "onWindowFocusChanged" not in content:
                  marker = re.search(r'public class MainActivity[^{]*\{', content)
                  if not marker:
                      raise SystemExit("❌ Declaração de MainActivity não encontrada no Java")
                  brace_idx = marker.end()
                  injected = content[:brace_idx] + '''

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      android.graphics.drawable.Drawable bg = getWindow().getDecorView().getBackground();
                      if (bg instanceof android.graphics.drawable.LayerDrawable) {
                          android.graphics.drawable.LayerDrawable layerBg = (android.graphics.drawable.LayerDrawable) bg;
                          for (int i = 0; i < layerBg.getNumberOfLayers(); i++) {
                              android.graphics.drawable.Drawable d = layerBg.getDrawable(i);
                              if (d instanceof android.graphics.drawable.AnimationDrawable) {
                                  ((android.graphics.drawable.AnimationDrawable) d).start();
                              }
                          }
                      }
                  }
              }
          ''' + content[brace_idx:]
                  with open(path, "w") as f:
                      f.write(injected)
                  print("✅ onWindowFocusChanged (start do shimmer) injetado em MainActivity.java")
              else:
                  print("✅ onWindowFocusChanged já presente em MainActivity.java — verificar manualmente se inicia o shimmer")
          PYEOF

