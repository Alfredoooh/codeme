      - name: Patch flutter_inappwebview proguard method call
        script: |
          python3 << 'PYEOF'
          import os
          import glob

          home = os.environ["HOME"]
          pattern = os.path.join(home, ".pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle")
          candidates = [f for f in glob.glob(pattern) if "example" not in f]

          if not candidates:
              print("❌ build.gradle do flutter_inappwebview_android não encontrado")
              raise SystemExit(1)

          target = candidates[0]
          print(f"Arquivo encontrado: {target}")

          with open(target, "r") as f:
              content = f.read()

          new_content = content.replace(
              "getDefaultProguardFile('proguard-android.txt')",
              "getDefaultProguardFile('proguard-android-optimize.txt')"
          ).replace(
              'getDefaultProguardFile("proguard-android.txt")',
              'getDefaultProguardFile("proguard-android-optimize.txt")'
          )

          if new_content == content:
              print("⚠️ Nenhuma ocorrência de proguard-android.txt encontrada — verificar manualmente")
          else:
              with open(target, "w") as f:
                  f.write(new_content)
              print("✅ proguard-android.txt substituído por proguard-android-optimize.txt")

          for i, line in enumerate(new_content.splitlines(), 1):
              if "getDefaultProguardFile" in line:
                  print(f"  linha {i}: {line.strip()}")
          PYEOF

      - name: Patch file_picker compileSdk to 36
        script: |
          python3 << 'PYEOF'
          import os
          import re
          import glob

          home = os.environ["HOME"]
          pattern = os.path.join(home, ".pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle")
          candidates = [f for f in glob.glob(pattern) if "example" not in f]

          if not candidates:
              pattern_kts = os.path.join(home, ".pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle.kts")
              candidates = [f for f in glob.glob(pattern_kts) if "example" not in f]

          if not candidates:
              print("❌ build.gradle do file_picker não encontrado — verificar manualmente")
              raise SystemExit(1)

          target = candidates[0]
          print(f"Arquivo encontrado: {target}")

          with open(target, "r") as f:
              content = f.read()

          original = content

          content = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', content)
          content = re.sub(r'compileSdk\s+flutter\.compileSdkVersion', 'compileSdk 36', content)
          content = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', content)
          content = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', content)
          content = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', content)
          content = re.sub(r'compileSdkVersion\s*\(\s*\d+\s*\)', 'compileSdkVersion(36)', content)
          content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', content)

          if content == original:
              print("⚠️ Nenhuma substituição aplicada — padrão de compileSdk não reconhecido, verificar manualmente")
              print("--- Trecho relevante do arquivo original ---")
              for i, line in enumerate(original.splitlines(), 1):
                  if "compileSdk" in line:
                      print(f"  linha {i}: {line.strip()}")
          else:
              with open(target, "w") as f:
                  f.write(content)
              print("✅ compileSdk do file_picker ajustado para 36")
              for i, line in enumerate(content.splitlines(), 1):
                  if "compileSdk" in line:
                      print(f"  linha {i}: {line.strip()}")
          PYEOF

