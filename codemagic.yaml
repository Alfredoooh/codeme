workflows:
  android-release:
    name: Nexa Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.codeme.app"
        GRADLE_OPTS: "-Xmx8G -XX:MaxMetaspaceSize=4G"
    scripts:
      - name: Generate key.properties
        script: |
          cat > "${CM_BUILD_DIR}/android/key.properties" << EOF
          storePassword=Test@Codeme2026
          keyPassword=Test@Codeme2026
          keyAlias=codeme-test
          storeFile=codeme-release.jks
          EOF
          echo "✅ key.properties gerado"

      - name: Instalar dependências
        script: |
          flutter pub get

      - name: Build APKs divididos por arquitetura (release, com shrink)
        script: |
          flutter build apk --release --split-per-abi

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - seu_email@exemplo.com
        notify:
          success: true
          failure: true