workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      groups:
        - codeme_keystore
    scripts:
      - name: Generate Android project from scratch
        script: |
          cd "${CM_BUILD_DIR}"
          if [ ! -d "android" ]; then
            echo "Pasta android/ não existe, gerando projeto Flutter completo..."
            flutter create --platforms=android --org com.jj_group --project-name nexa .
          else
            echo "Pasta android/ já existe, pulando geração."
          fi

      - name: Generate key.properties
        script: |
          cat > "${CM_BUILD_DIR}/android/key.properties" << EOF
          storePassword=Test@Codeme2026
          keyPassword=Test@Codeme2026
          keyAlias=codeme-test
          storeFile=codeme-release.jks
          EOF
          echo "✅ key.properties gerado"

      - name: Install Pillow
        script: pip3 install Pillow --quiet

      - name: Process launcher icons + dual splash (light/dark)
        script: |
          python3 << 'PYEOF'
          import os
          from PIL import Image, ImageDraw

          CM      = os.environ["CM_BUILD_DIR"]
          RES     = os.path.join(CM, "android/app/src/main/res")
          LAUNCHER        = os.path.join(CM, "ic_launcher.png")
          SPLASH_LIGHT    = os.path.join(CM, "splash_icon_light.png")
          SPLASH_DARK     = os.path.join(CM, "splash_icon_dark.png")
          # Fallback: se não existir splash dedicado, usa o launcher centralizado
          SPLASH_FALLBACK = LAUNCHER

          if not os.path.exists(LAUNCHER):
              raise FileNotFoundError("ic_launcher.png não encontrado na raiz do repo!")

          DENSITIES = {
              "mipmap-ldpi":36,"mipmap-mdpi":48,"mipmap-hdpi":72,
              "mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192
          }
          FG_SIZES = {
              "mipmap-mdpi":108,"mipmap-hdpi":162,"mipmap-xhdpi":216,
              "mipmap-xxhdpi":324,"mipmap-xxxhdpi":432
          }

          def fluent_rounded(img, size, ratio=0.22):
              img = img.convert("RGBA").resize((size, size), Image.LANCZOS)
              mask = Image.new("L", (size, size), 0)
              ImageDraw.Draw(mask).rounded_rectangle(
                  [0, 0, size-1, size-1], radius=int(size*ratio), fill=255)
              out = Image.new("RGBA", (size, size), (0,0,0,0))
              out.paste(img, (0, 0), mask)
              return out

          def save(img, path):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              img.save(path, "PNG", optimize=True)
              print(f"  -> {path}")

          # ── Ícones do launcher ──────────────────────────────────────────
          src = Image.open(LAUNCHER)
          for d, sz in DENSITIES.items():
              save(fluent_rounded(src, sz, 0.22), os.path.join(RES, d, "ic_launcher.png"))
              save(fluent_rounded(src, sz, 0.50), os.path.join(RES, d, "ic_launcher_round.png"))
          for d, fg in FG_SIZES.items():
              icon_sz = int(fg * 0.66)
              fg_img  = src.copy().convert("RGBA").resize((icon_sz, icon_sz), Image.LANCZOS)
              canvas  = Image.new("RGBA", (fg, fg), (0,0,0,0))
              off     = (fg - icon_sz) // 2
              canvas.paste(fg_img, (off, off), fg_img)
              save(canvas, os.path.join(RES, d, "ic_launcher_foreground.png"))

          # ── Splash icon LIGHT ───────────────────────────────────────────
          def make_splash(source_path, dest_path):
              CANVAS, ICON = 288, 288
              src_img = Image.open(source_path).convert("RGBA")
              # Se a imagem for menor que o canvas, centraliza num fundo transparente
              if src_img.size != (CANVAS, CANVAS):
                  ICON = 160
                  canvas = Image.new("RGBA", (CANVAS, CANVAS), (0, 0, 0, 0))
                  icon   = src_img.resize((ICON, ICON), Image.LANCZOS)
                  off    = (CANVAS - ICON) // 2
                  canvas.paste(icon, (off, off), icon)
                  canvas.save(dest_path, "PNG", optimize=True)
              else:
                  src_img.save(dest_path, "PNG", optimize=True)
              print(f"  -> {dest_path}")

          drawable_light = os.path.join(RES, "drawable")
          drawable_dark  = os.path.join(RES, "drawable-night")
          os.makedirs(drawable_light, exist_ok=True)
          os.makedirs(drawable_dark,  exist_ok=True)

          # Light splash
          light_src = SPLASH_LIGHT if os.path.exists(SPLASH_LIGHT) else SPLASH_FALLBACK
          make_splash(light_src, os.path.join(drawable_light, "splash_icon.png"))
          if light_src == SPLASH_FALLBACK:
              print("  ⚠️  splash_icon_light.png não encontrado — usando ic_launcher como fallback")

          # Dark splash
          dark_src = SPLASH_DARK if os.path.exists(SPLASH_DARK) else SPLASH_FALLBACK
          make_splash(dark_src, os.path.join(drawable_dark, "splash_icon.png"))
          if dark_src == SPLASH_FALLBACK:
              print("  ⚠️  splash_icon_dark.png não encontrado — usando ic_launcher como fallback")

          print("✅ Ícones e splash (light/dark) processados com sucesso!")
          PYEOF

      - name: Write launch_background XMLs (light + dark)
        script: |
          RES="${CM_BUILD_DIR}/android/app/src/main/res"

          # Light: fundo branco + splash_icon centrado
          mkdir -p "${RES}/drawable"
          cat > "${RES}/drawable/launch_background.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
              <item>
                  <bitmap
                      android:gravity="center"
                      android:src="@drawable/splash_icon" />
              </item>
          </layer-list>
          EOF
          echo "✅ drawable/launch_background.xml (light) criado"

          # Dark: fundo #0d0d0d + splash_icon centrado (vem de drawable-night)
          mkdir -p "${RES}/drawable-night"
          cat > "${RES}/drawable-night/launch_background.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <color android:color="#0d0d0d" />
              </item>
              <item>
                  <bitmap
                      android:gravity="center"
                      android:src="@drawable/splash_icon" />
              </item>
          </layer-list>
          EOF
          echo "✅ drawable-night/launch_background.xml (dark) criado"

      - name: Write styles XMLs (light + dark)
        script: |
          RES="${CM_BUILD_DIR}/android/app/src/main/res"

          # values/styles.xml — tema claro (padrão)
          mkdir -p "${RES}/values"
          cat > "${RES}/values/styles.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:windowFullscreen">false</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:windowFullscreen">false</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF
          echo "✅ values/styles.xml (light) escrito"

          # values-night/styles.xml — tema escuro
          mkdir -p "${RES}/values-night"
          cat > "${RES}/values-night/styles.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:windowFullscreen">false</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:statusBarColor">#0d0d0d</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:navigationBarColor">#0d0d0d</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">#0d0d0d</item>
                  <item name="android:windowFullscreen">false</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:statusBarColor">#0d0d0d</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:navigationBarColor">#0d0d0d</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF
          echo "✅ values-night/styles.xml (dark) escrito"

          # values-v27/styles.xml — claro, API 27+ (windowLightNavigationBar)
          mkdir -p "${RES}/values-v27"
          cat > "${RES}/values-v27/styles.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          EOF
          echo "✅ values-v27/styles.xml (light v27) escrito"

          # values-night-v27/styles.xml — escuro, API 27+
          mkdir -p "${RES}/values-night-v27"
          cat > "${RES}/values-night-v27/styles.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:statusBarColor">#0d0d0d</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:navigationBarColor">#0d0d0d</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">#0d0d0d</item>
                  <item name="android:statusBarColor">#0d0d0d</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:navigationBarColor">#0d0d0d</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          EOF
          echo "✅ values-night-v27/styles.xml (dark v27) escrito"

      - name: Remove stale adaptive icon (anydpi-v26)
        script: |
          rm -rf "${CM_BUILD_DIR}/android/app/src/main/res/mipmap-anydpi-v26"
          echo "✅ mipmap-anydpi-v26 removido (se existia)"

      - name: Set applicationId and app label
        script: |
          BUILD_GRADLE="${CM_BUILD_DIR}/android/app/build.gradle"
          if [ -f "${CM_BUILD_DIR}/android/app/build.gradle.kts" ]; then
            BUILD_GRADLE="${CM_BUILD_DIR}/android/app/build.gradle.kts"
          fi
          MANIFEST="${CM_BUILD_DIR}/android/app/src/main/AndroidManifest.xml"

          sed -i 's/applicationId = "com.example.nexa"/applicationId = "com.jj_group.nexa"/' "$BUILD_GRADLE"
          sed -i 's/applicationId "com.example.nexa"/applicationId "com.jj_group.nexa"/' "$BUILD_GRADLE"
          sed -i 's/android:label="nexa"/android:label="Nexa"/' "$MANIFEST"

          echo "✅ applicationId ajustado para com.jj_group.nexa"
          echo "✅ Nome do app ajustado para Nexa"

      - name: Get Flutter packages
        script: |
          cd "${CM_BUILD_DIR}"
          flutter packages pub get

      - name: Enable R8 + resource shrinking
        script: |
          GRADLE_FILE="${CM_BUILD_DIR}/android/app/build.gradle"
          if ! grep -q "shrinkResources true" "$GRADLE_FILE"; then
            sed -i 's/minifyEnabled false/minifyEnabled true/' "$GRADLE_FILE"
            sed -i 's/shrinkResources false/shrinkResources true/' "$GRADLE_FILE"
            echo "✅ R8 + shrinkResources ativados"
          else
            echo "✅ shrinkResources já configurado"
          fi

      - name: Build release APK (split per ABI)
        script: |
          cd "${CM_BUILD_DIR}"
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Build release AAB
        script: |
          cd "${CM_BUILD_DIR}"
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

    artifacts:
      - build/app/outputs/apk/release/*.apk
      - build/app/outputs/bundle/release/*.aab
      - build/symbols/*
    publishing:
      email:
        recipients:
          - dev@example.com
        notify:
          success: true
          failure: true

