      # ──────────────────────────────────────────────────────
      # 12. UI: IdeRootScreen
      #    CORRIGIDO: import clickable, WidgetsPlusSlash -> Widgets
      # ──────────────────────────────────────────────────────
      - name: Write IdeRootScreen
        script: |
          set -e
          ROOT="$CM_BUILD_DIR/$APP_DIR"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          UI="$ROOT/app/src/main/java/$PKG_PATH/ui"

          cat > "$UI/IdeRootScreen.kt" << EOF
          package $PKG.ui

          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.rounded.Menu
          import androidx.compose.material.icons.rounded.PlayArrow
          import androidx.compose.material.icons.rounded.UploadFile
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.launch
          import $PKG.data.PreferencesRepository
          import $PKG.data.ProjectRepository
          import $PKG.data.LocalWebServer
          import $PKG.data.SavedProject
          import $PKG.ui.drawer.AppDrawerContent
          import $PKG.ui.editor.CodeEditorScreen
          import $PKG.ui.runner.RunnerWebView
          import $PKG.ui.settings.SettingsScreen
          import java.io.File

          private const val LOCAL_PORT = 8034

          private enum class Screen { IDE, SETTINGS }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun IdeRootScreen(
              prefsRepo: PreferencesRepository,
              pickedZipPath: String?,
              onZipConsumed: () -> Unit,
              onRequestZipPick: () -> Unit,
              pickError: String? = null,
              onPickErrorShown: () -> Unit = {}
          ) {
              val context = LocalContext.current
              val repo = remember { ProjectRepository(context) }
              val drawerState = rememberDrawerState(DrawerValue.Closed)
              val scope = rememberCoroutineScope()
              val snackbarHostState = remember { SnackbarHostState() }

              val savedProjects by prefsRepo.savedProjects.collectAsState(initial = emptyList())
              val lastOpenPath by prefsRepo.lastOpenProjectPath.collectAsState(initial = null)

              var screen by remember { mutableStateOf(Screen.IDE) }
              var currentProject by remember { mutableStateOf<File?>(null) }
              var files by remember { mutableStateOf<List<File>>(emptyList()) }
              var selectedFile by remember { mutableStateOf<File?>(null) }
              var fileContent by remember { mutableStateOf("") }
              var isRunning by remember { mutableStateOf(false) }
              var isImporting by remember { mutableStateOf(false) }
              var server by remember { mutableStateOf<LocalWebServer?>(null) }
              var showTemplateSheet by remember { mutableStateOf(false) }
              var didAutoRestore by remember { mutableStateOf(false) }

              fun openDir(dir: File) {
                  currentProject = dir
                  files = repo.fileTree(dir)
                  selectedFile = null
                  isRunning = false
              }

              LaunchedEffect(pickError) {
                  if (pickError != null) {
                      snackbarHostState.showSnackbar(pickError)
                      onPickErrorShown()
                  }
              }

              LaunchedEffect(lastOpenPath, savedProjects) {
                  if (!didAutoRestore && lastOpenPath != null && currentProject == null) {
                      val match = savedProjects.find { it.path == lastOpenPath }
                      val dir = match?.let { File(it.path) } ?: File(lastOpenPath!!)
                      if (dir.exists()) openDir(dir)
                      didAutoRestore = true
                  }
              }

              LaunchedEffect(pickedZipPath) {
                  val path = pickedZipPath ?: return@LaunchedEffect
                  isImporting = true
                  try {
                      val name = "projeto_\${System.currentTimeMillis()}"
                      val dir = repo.importZip(path, name)
                      openDir(dir)
                      prefsRepo.addOrUpdateProject(SavedProject(name = dir.name, path = dir.absolutePath))
                      snackbarHostState.showSnackbar("Projeto importado: \${dir.name}")
                  } catch (e: Exception) {
                      snackbarHostState.showSnackbar("Erro ao importar: \${e.message}")
                  } finally {
                      isImporting = false
                      onZipConsumed()
                  }
              }

              fun runProject() {
                  val project = currentProject ?: return
                  server?.stop()
                  val srv = LocalWebServer(LOCAL_PORT, project)
                  srv.start()
                  server = srv
                  isRunning = true
              }

              fun createFromTemplate(templateId: String, label: String) {
                  scope.launch {
                      isImporting = true
                      try {
                          val name = "\${label}_\${System.currentTimeMillis()}"
                          val dir = repo.importFromAssetsTemplate(templateId, name)
                          openDir(dir)
                          prefsRepo.addOrUpdateProject(SavedProject(name = dir.name, path = dir.absolutePath))
                          snackbarHostState.showSnackbar("Projeto criado: \${dir.name}")
                      } catch (e: Exception) {
                          snackbarHostState.showSnackbar("Erro ao criar projeto: \${e.message}")
                      } finally {
                          isImporting = false
                          showTemplateSheet = false
                      }
                  }
              }

              if (screen == Screen.SETTINGS) {
                  SettingsScreen(prefsRepo = prefsRepo, onBack = { screen = Screen.IDE })
                  return
              }

              if (showTemplateSheet) {
                  ModalBottomSheet(onDismissRequest = { showTemplateSheet = false }) {
                      Column(modifier = Modifier.padding(16.dp).padding(bottom = 24.dp)) {
                          Text("Escolha um template", style = MaterialTheme.typography.titleLarge)
                          Spacer(modifier = Modifier.height(12.dp))
                          TemplateRow("HTML / CSS / JS básico") { createFromTemplate("html_basic", "html") }
                          TemplateRow("React (JSX, client-side)") { createFromTemplate("react_basic", "react") }
                          TemplateRow("TypeScript puro") { createFromTemplate("ts_basic", "ts") }
                          Spacer(modifier = Modifier.height(8.dp))
                          Text(
                              "Obs.: este IDE compila localmente com esbuild (sem Node). " +
                              "Templates de frameworks com servidor (como Next.js) não são suportados.",
                              style = MaterialTheme.typography.bodyMedium,
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }
                  }
              }

              ModalNavigationDrawer(
                  drawerState = drawerState,
                  drawerContent = {
                      AppDrawerContent(
                          projectName = currentProject?.name.orEmpty(),
                          savedProjects = savedProjects,
                          currentFiles = files,
                          onFileClick = { f ->
                              if (f.isFile) {
                                  selectedFile = f
                                  fileContent = repo.readFile(f)
                                  isRunning = false
                              }
                              scope.launch { drawerState.close() }
                          },
                          onOpenSavedProject = { proj ->
                              val dir = File(proj.path)
                              if (dir.exists()) openDir(dir)
                              scope.launch { drawerState.close() }
                          },
                          onRemoveSavedProject = { proj ->
                              scope.launch { prefsRepo.removeProject(proj.path) }
                          },
                          onUploadZipClick = {
                              scope.launch { drawerState.close() }
                              onRequestZipPick()
                          },
                          onNewFromTemplateClick = {
                              scope.launch { drawerState.close() }
                              showTemplateSheet = true
                          },
                          onSettingsClick = {
                              scope.launch { drawerState.close() }
                              screen = Screen.SETTINGS
                          }
                      )
                  }
              ) {
                  Scaffold(
                      snackbarHost = { SnackbarHost(snackbarHostState) },
                      topBar = {
                          TopAppBar(
                              title = { Text(currentProject?.name ?: "Code IDE") },
                              navigationIcon = {
                                  IconButton(onClick = { scope.launch { drawerState.open() } }) {
                                      Icon(Icons.Rounded.Menu, contentDescription = "Menu")
                                  }
                              },
                              actions = {
                                  FilledIconButton(onClick = { runProject() }, enabled = currentProject != null) {
                                      Icon(Icons.Rounded.PlayArrow, contentDescription = "Run")
                                  }
                                  Spacer(modifier = Modifier.width(8.dp))
                              }
                          )
                      }
                  ) { padding ->
                      Box(modifier = Modifier.fillMaxSize().padding(padding)) {
                          when {
                              isImporting -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                      CircularProgressIndicator()
                                      Spacer(modifier = Modifier.height(12.dp))
                                      Text("Preparando projeto...")
                                  }
                              }
                              isRunning -> RunnerWebView(url = "http://127.0.0.1:\$LOCAL_PORT/")
                              selectedFile != null -> CodeEditorScreen(
                                  content = fileContent,
                                  onContentChange = { fileContent = it; selectedFile?.let { f -> repo.writeFile(f, fileContent) } }
                              )
                              else -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                      Icon(
                                          Icons.Rounded.UploadFile, contentDescription = null,
                                          modifier = Modifier.size(48.dp), tint = MaterialTheme.colorScheme.primary
                                      )
                                      Spacer(modifier = Modifier.height(12.dp))
                                      Text("Importe um .zip ou escolha um template")
                                      Spacer(modifier = Modifier.height(16.dp))
                                      Row {
                                          FilledTonalButton(onClick = onRequestZipPick) { Text("Importar .zip") }
                                          Spacer(modifier = Modifier.width(12.dp))
                                          FilledTonalButton(onClick = { showTemplateSheet = true }) { Text("Templates") }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun TemplateRow(label: String, onClick: () -> Unit) {
              ListItem(
                  headlineContent = { Text(label) },
                  modifier = Modifier
                      .fillMaxWidth()
                      .clickable(onClick = onClick)
              )
          }
          EOF

      # ──────────────────────────────────────────────────────
      # 13. Templates prontos embutidos em assets
      # ──────────────────────────────────────────────────────
