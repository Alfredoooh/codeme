          cat > "$TPL/react_basic/src/App.jsx" << 'EOF'
          import { useState } from 'react';

          export default function App() {
            const [count, setCount] = useState(0);
            return (
              <div style={{ fontFamily: 'sans-serif', textAlign: 'center', marginTop: 60 }}>
                <h1>Olá, React!</h1>
                <p>Contador: {count}</p>
                <button onClick={() => setCount(count + 1)}>Incrementar</button>
              </div>
            );
          }
          EOF

          cat > "$TPL/react_basic/src/main.jsx" << 'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import App from './App.jsx';

          createRoot(document.getElementById('root')).render(<App />);
          EOF

          cat > "$TPL/ts_basic/index.html" << 'EOF'
          <!DOCTYPE html>
          <html lang="pt">
          <head>
            <meta charset="UTF-8" />
            <title>Projeto TypeScript</title>
          </head>
          <body>
            <h1>Olá, TypeScript!</h1>
            <script type="module" src="src/main.ts"></script>
          </body>
          </html>
          EOF

          cat > "$TPL/ts_basic/src/main.ts" << 'EOF'
          function saudacao(nome: string): string {
            return `Olá, ${nome}!`;
          }

          document.body.insertAdjacentHTML(
            'beforeend',
            `<p>${saudacao('Code IDE')}</p>`
          );
          EOF

      # ──────────────────────────────────────────────────────
      # 14. Gradle wrapper jar + local.properties
      # ──────────────────────────────────────────────────────
      - name: Fetch gradle wrapper jar
        script: |
          set -e
          ROOT="$CM_BUILD_DIR/$APP_DIR"
          cd "$ROOT"
          curl -sSL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          curl -sSL -o gradlew \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew
          chmod +x gradlew

      - name: Write local.properties
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/$APP_DIR/local.properties"

      # ──────────────────────────────────────────────────────
      # 15. Build
      # ──────────────────────────────────────────────────────
      - name: Build debug APK
        script: |
          set -e
          cd "$CM_BUILD_DIR/$APP_DIR"
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - android-ide/app/build/outputs/**/*.apk
      - android-ide/app/build/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - seu-email@exemplo.com
        notify:
          success: true
          failure: true