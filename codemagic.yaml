          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "⚠️  Permissão INTERNET ausente — adicionando..."
            python3 << PYEOF
          import re

          path = "$MANIFEST"
          with open(path, "r") as f:
              content = f.read()

          permission_line = '    <uses-permission android:name="android.permission.INTERNET" />\n'

          if "<manifest" in content:
              content = re.sub(
                  r'(<manifest[^>]*>)',
                  r'\1\n' + permission_line.rstrip('\n'),
                  content,
                  count=1,
              )
              with open(path, "w") as f:
                  f.write(content)
              print("✅ Permissão INTERNET adicionada ao AndroidManifest.xml")
          else:
              raise SystemExit("❌ Tag <manifest> não encontrada — manifest inválido")
          PYEOF
          else
            echo "✅ Permissão INTERNET já presente no AndroidManifest.xml"
          fi

      - name: Ensure CAMERA permission in AndroidManifest
