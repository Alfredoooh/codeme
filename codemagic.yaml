              splash_src.save(dest, "PNG", optimize=True)
              print(f"  -> {dest} (splash_icon.png dedicado)")
          else:
              CANVAS = 288
              ICON   = 160
              canvas = Image.new("RGBA", (CANVAS, CANVAS), (0, 0, 0, 0))
              icon   = src.convert("RGBA").resize((ICON, ICON), Image.LANCZOS)
              off    = (CANVAS - ICON) // 2
              canvas.paste(icon, (off, off), icon)
              canvas.save(dest, "PNG", optimize=True)
              print(f"  -> {dest} (splash gerado a partir do launcher)")

          print("Icones e splash processados com sucesso!")
          PYEOF

      - name: Remove stale adaptive icon (anydpi-v26)
        script: |
          rm -rf "${CM_BUILD_DIR}/android/app/src/main/res/mipmap-anydpi-v26"
          echo "✅ mipmap-anydpi-v26 removido (se existia)"

      - name: Get Flutter packages
        script: |
          cd "${CM_BUILD_DIR}"
          flutter packages pub get

      - name: Build debug APK
        script: |
          cd "${CM_BUILD_DIR}"
          flutter build apk --debug

    artifacts:
      - build/app/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - dev@example.com
        notify:
          success: false
          failure: true

  web-release:
    name: Web Release Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          cd "${CM_BUILD_DIR}"
          flutter packages pub get

      - name: Build web release
        script: |
          cd "${CM_BUILD_DIR}"
          flutter build web --release

    artifacts:
      - build/web/**
    publishing:
      email:
        recipients:
          - dev@example.com
        notify:
          success: false
          failure: true