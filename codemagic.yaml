workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      groups:
        - codeme_keystore
    scripts:
      - name: Generate Android project from scratch
        script: |
          cd "${CM_BUILD_DIR}"
          if [ ! -d "android" ]; then
            echo "Pasta android/ não existe, gerando projeto Flutter completo..."
            flutter create --platforms=android --org com.jj_group --project-name nexa .
          else
            echo "Pasta android/ já existe, pulando geração."
          fi

      - name: Generate key.properties
        script: |
          cat > "${CM_BUILD_DIR}/android/key.properties" << EOF
          storePassword=Test@Codeme2026
          keyPassword=Test@Codeme2026
          keyAlias=codeme-test
          storeFile=codeme-release.jks
          EOF
          echo "✅ key.properties gerado"

      - name: Ensure INTERNET permission in AndroidManifest
        script: |
          MANIFEST="${CM_BUILD_DIR}/android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "❌ AndroidManifest.xml não encontrado em $MANIFEST"
            exit 1
          fi
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "⚠️  Permissão INTERNET ausente — adicionando..."
            python3 << PYEOF
          import re

          path = "$MANIFEST"
          with open(path, "r") as f:
              content = f.read()

          permission_line = '    <uses-permission android:name="android.permission.INTERNET" />\n'

          if "<manifest" in content:
              content = re.sub(
                  r'(<manifest[^>]*>)',
                  r'\1\n' + permission_line.rstrip('\n'),
                  content,
                  count=1,
              )
              with open(path, "w") as f:
                  f.write(content)
              print("✅ Permissão INTERNET adicionada ao AndroidManifest.xml")
          else:
              raise SystemExit("❌ Tag <manifest> não encontrada — manifest inválido")
          PYEOF
          else
            echo "✅ Permissão INTERNET já presente no AndroidManifest.xml"
          fi
          echo "--- Permissões atuais ---"
          grep "uses-permission" "$MANIFEST" || echo "(nenhuma encontrada)"

      - name: Ensure CAMERA permission in AndroidManifest
        script: |
          MANIFEST="${CM_BUILD_DIR}/android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "❌ AndroidManifest.xml não encontrado em $MANIFEST"
            exit 1
          fi

          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            echo "⚠️  Permissão CAMERA ausente — adicionando..."
            python3 << PYEOF
          import re

          path = "$MANIFEST"
          with open(path, "r") as f:
              content = f.read()

          permissions = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-feature android:name="android.hardware.camera" android:required="false" />',
              '<uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />',
          ]

          if "<manifest" not in content:
              raise SystemExit("❌ Tag <manifest> não encontrada — manifest inválido")

          block = "\n    ".join(permissions) + "\n"
          content = re.sub(
              r'(<manifest[^>]*>)',
              r'\1\n    ' + block.rstrip('\n'),
              content,
              count=1,
          )
          with open(path, "w") as f:
              f.write(content)
          print("✅ Permissões CAMERA + features adicionadas ao AndroidManifest.xml")
          PYEOF
          else
            echo "✅ Permissão CAMERA já presente no AndroidManifest.xml"
          fi
          echo "--- Permissões atuais ---"
          grep -E "uses-permission|uses-feature" "$MANIFEST" || echo "(nenhuma encontrada)"

      - name: Ensure network access XML (cleartext + config)
        script: |
          RES="${CM_BUILD_DIR}/android/app/src/main/res"
          MANIFEST="${CM_BUILD_DIR}/android/app/src/main/AndroidManifest.xml"

          mkdir -p "${RES}/xml"
          cat > "${RES}/xml/network_security_config.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF
          echo "✅ res/xml/network_security_config.xml criado"

          if ! grep -q 'networkSecurityConfig' "$MANIFEST"; then
            python3 << PYEOF
          import re

          path = "$MANIFEST"
          with open(path, "r") as f:
              content = f.read()

          if "<application" in content and "networkSecurityConfig" not in content:
              content = re.sub(
                  r'(<application)',
                  r'\1\n        android:networkSecurityConfig="@xml/network_security_config"',
                  content,
                  count=1,
              )
              with open(path, "w") as f:
                  f.write(content)
              print("✅ networkSecurityConfig referenciado no AndroidManifest.xml")
          PYEOF
          else
            echo "✅ networkSecurityConfig já referenciado"
          fi

      - name: Install Pillow
        script: pip3 install Pillow --quiet

      - name: Process launcher icons + dual splash (light/dark) — SEM fallback
        script: |
          python3 << 'PYEOF'
          import os
          from PIL import Image, ImageDraw

          CM   = os.environ["CM_BUILD_DIR"]
          RES  = os.path.join(CM, "android/app/src/main/res")
          LAUNCHER     = os.path.join(CM, "ic_launcher.png")
          SPLASH_LIGHT = os.path.join(CM, "splash_icon_light.png")
          SPLASH_DARK  = os.path.join(CM, "splash_icon_dark.png")

          # Falha o build explicitamente se os ícones reais não existirem —
          # nunca deve cair em fallback para o ic_launcher.
          missing = [p for p in (LAUNCHER, SPLASH_LIGHT, SPLASH_DARK) if not os.path.exists(p)]
          if missing:
              raise FileNotFoundError(
                  "Ficheiro(s) obrigatório(s) em falta na raiz do repo: " + ", ".join(missing)
              )

          DENSITIES = {
              "mipmap-ldpi":36,"mipmap-mdpi":48,"mipmap-hdpi":72,
              "mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192
          }
          FG_SIZES = {
              "mipmap-mdpi":108,"mipmap-hdpi":162,"mipmap-xhdpi":216,
              "mipmap-xxhdpi":324,"mipmap-xxxhdpi":432
          }
          # Densidades usadas para o splash "legacy" (Android < 12), em px,
          # para que o ícone real apareça nítido em qualquer versão do SO.
          SPLASH_DENSITIES = {
              "drawable-mdpi": 192,
              "drawable-hdpi": 288,
              "drawable-xhdpi": 384,
              "drawable-xxhdpi": 576,
              "drawable-xxxhdpi": 768,
          }

          def fluent_rounded(img, size, ratio=0.22):
              img = img.convert("RGBA").resize((size, size), Image.LANCZOS)
              mask = Image.new("L", (size, size), 0)
              ImageDraw.Draw(mask).rounded_rectangle(
                  [0, 0, size-1, size-1], radius=int(size*ratio), fill=255)
              out = Image.new("RGBA", (size, size), (0,0,0,0))
              out.paste(img, (0, 0), mask)
              return out

          def save(img, path):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              img.save(path, "PNG", optimize=True)
              print(f"  -> {path}")

          # ── Ícones do launcher ──────────────────────────────────────────
          src = Image.open(LAUNCHER)
          for d, sz in DENSITIES.items():
              save(fluent_rounded(src, sz, 0.22), os.path.join(RES, d, "ic_launcher.png"))
              save(fluent_rounded(src, sz, 0.50), os.path.join(RES, d, "ic_launcher_round.png"))
          for d, fg in FG_SIZES.items():
              icon_sz = int(fg * 0.66)
              fg_img  = src.copy().convert("RGBA").resize((icon_sz, icon_sz), Image.LANCZOS)
              canvas  = Image.new("RGBA", (fg, fg), (0,0,0,0))
              off     = (fg - icon_sz) // 2
              canvas.paste(fg_img, (off, off), fg_img)
              save(canvas, os.path.join(RES, d, "ic_launcher_foreground.png"))

          # ── Splash icon — SEMPRE usa o PNG real do repo, redimensionado
          #    para cada densidade, sem qualquer fallback. Isto garante que
          #    o Android 12+ (SplashScreen API) E versões anteriores (via
          #    launch_background.xml) mostram o ícone verdadeiro.
          def make_splash_variants(source_path, drawable_prefix):
              src_img = Image.open(source_path).convert("RGBA")
              for density_dir, target_px in SPLASH_DENSITIES.items():
                  full_dir = f"{drawable_prefix}-{density_dir.split('-')[1]}" if False else None
              # Gera um bitmap único por densidade, mantendo proporção do
              # ícone original dentro de uma tela quadrada transparente.
              for density_dir, target_px in SPLASH_DENSITIES.items():
                  canvas_size = target_px
                  icon_size = int(canvas_size * 0.55)
                  canvas = Image.new("RGBA", (canvas_size, canvas_size), (0, 0, 0, 0))
                  icon = src_img.resize((icon_size, icon_size), Image.LANCZOS)
                  off = (canvas_size - icon_size) // 2
                  canvas.paste(icon, (off, off), icon)
                  dest_dir = os.path.join(RES, density_dir if drawable_prefix == "drawable" else density_dir.replace("drawable", "drawable-night"))
                  dest_path = os.path.join(dest_dir, "splash_icon.png")
                  os.makedirs(dest_dir, exist_ok=True)
                  canvas.save(dest_path, "PNG", optimize=True)
                  print(f"  -> {dest_path}")
              # Também grava uma cópia em drawable/ e drawable-night/ (sem
              # sufixo de densidade) para telas que caem no default bucket.
              default_dir = os.path.join(RES, "drawable" if drawable_prefix == "drawable" else "drawable-night")
              os.makedirs(default_dir, exist_ok=True)
              default_size = 480
              icon_size = int(default_size * 0.55)
              canvas = Image.new("RGBA", (default_size, default_size), (0, 0, 0, 0))
              icon = src_img.resize((icon_size, icon_size), Image.LANCZOS)
              off = (default_size - icon_size) // 2
              canvas.paste(icon, (off, off), icon)
              default_path = os.path.join(default_dir, "splash_icon.png")
              canvas.save(default_path, "PNG", optimize=True)
              print(f"  -> {default_path}")

          make_splash_variants(SPLASH_LIGHT, "drawable")
          make_splash_variants(SPLASH_DARK, "drawable-night")

          print("✅ Ícones e splash (light/dark), sem fallback, processados com sucesso!")
          PYEOF

      - name: Write Android 12+ splash screen (values/styles + themes)
        script: |
          RES="${CM_BUILD_DIR}/android/app/src/main/res"

          # Android 12+ usa a SplashScreen API nativa via tema, não mais
          # apenas o launch_background.xml. Configuramos os dois caminhos
          # para que o ícone real apareça em qualquer versão (incluindo
          # Android 13, testado pelo utilizador).
          mkdir -p "${RES}/values-v31"
          cat > "${RES}/values-v31/styles.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowSplashScreenBackground">@android:color/white</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">@android:color/white</item>
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF
          echo "✅ values-v31/styles.xml (Android 12+ splash nativo, light) criado"

          mkdir -p "${RES}/values-night-v31"
          cat > "${RES}/values-night-v31/styles.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowSplashScreenBackground">#0d0d0d</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">#0d0d0d</item>
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:statusBarColor">#0d0d0d</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:navigationBarColor">#0d0d0d</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">#0d0d0d</item>
                  <item name="android:statusBarColor">#0d0d0d</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:navigationBarColor">#0d0d0d</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF
          echo "✅ values-night-v31/styles.xml (Android 12+ splash nativo, dark) criado"

      - name: Write launch_background XMLs (light + dark) — pré Android 12
        script: |
          RES="${CM_BUILD_DIR}/android/app/src/main/res"

          mkdir -p "${RES}/drawable"
          cat > "${RES}/drawable/launch_background.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
              <item>
                  <bitmap
                      android:gravity="center"
                      android:src="@drawable/splash_icon" />
              </item>
          </layer-list>
          EOF
          echo "✅ drawable/launch_background.xml (light) criado"

          mkdir -p "${RES}/drawable-night"
          cat > "${RES}/drawable-night/launch_background.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <color android:color="#0d0d0d" />
              </item>
              <item>
                  <bitmap
                      android:gravity="center"
                      android:src="@drawable/splash_icon" />
              </item>
          </layer-list>
          EOF
          echo "✅ drawable-night/launch_background.xml (dark) criado"

