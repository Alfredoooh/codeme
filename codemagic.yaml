      - name: Process launcher icons + dual splash (light/dark) — SEM fallback
        script: |
          python3 << 'PYEOF'
          import os
          from PIL import Image, ImageDraw

          CM   = os.environ["CM_BUILD_DIR"]
          RES  = os.path.join(CM, "android/app/src/main/res")
          LAUNCHER     = os.path.join(CM, "ic_launcher.png")
          SPLASH_LIGHT = os.path.join(CM, "splash_icon_light.png")
          SPLASH_DARK  = os.path.join(CM, "splash_icon_dark.png")

          missing = [p for p in (LAUNCHER, SPLASH_LIGHT, SPLASH_DARK) if not os.path.exists(p)]
          if missing:
              raise FileNotFoundError(
                  "Ficheiro(s) obrigatório(s) em falta na raiz do repo: " + ", ".join(missing)
              )

          DENSITIES = {
              "mipmap-ldpi":36,"mipmap-mdpi":48,"mipmap-hdpi":72,
              "mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192
          }
          FG_SIZES = {
              "mipmap-mdpi":108,"mipmap-hdpi":162,"mipmap-xhdpi":216,
              "mipmap-xxhdpi":324,"mipmap-xxxhdpi":432
          }
          SPLASH_DENSITIES = {
              "drawable-mdpi": 192,
              "drawable-hdpi": 288,
              "drawable-xhdpi": 384,
              "drawable-xxhdpi": 576,
              "drawable-xxxhdpi": 768,
          }

          def fluent_rounded(img, size, ratio=0.22):
              img = img.convert("RGBA").resize((size, size), Image.LANCZOS)
              mask = Image.new("L", (size, size), 0)
              ImageDraw.Draw(mask).rounded_rectangle(
                  [0, 0, size-1, size-1], radius=int(size*ratio), fill=255)
              out = Image.new("RGBA", (size, size), (0,0,0,0))
              out.paste(img, (0, 0), mask)
              return out

          def save(img, path):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              img.save(path, "PNG", optimize=True)
              print(f"  -> {path}")

          src = Image.open(LAUNCHER)
          for d, sz in DENSITIES.items():
              save(fluent_rounded(src, sz, 0.22), os.path.join(RES, d, "ic_launcher.png"))
              save(fluent_rounded(src, sz, 0.50), os.path.join(RES, d, "ic_launcher_round.png"))
          for d, fg in FG_SIZES.items():
              icon_sz = int(fg * 0.66)
              fg_img  = src.copy().convert("RGBA").resize((icon_sz, icon_sz), Image.LANCZOS)
              canvas  = Image.new("RGBA", (fg, fg), (0,0,0,0))
              off     = (fg - icon_sz) // 2
              canvas.paste(fg_img, (off, off), fg_img)
              save(canvas, os.path.join(RES, d, "ic_launcher_foreground.png"))

          def make_splash_variants(source_path, drawable_prefix):
              src_img = Image.open(source_path).convert("RGBA")
              for density_dir, target_px in SPLASH_DENSITIES.items():
                  canvas_size = target_px
                  icon_size = int(canvas_size * 0.55)
                  canvas = Image.new("RGBA", (canvas_size, canvas_size), (0, 0, 0, 0))
                  icon = src_img.resize((icon_size, icon_size), Image.LANCZOS)
                  off = (canvas_size - icon_size) // 2
                  canvas.paste(icon, (off, off), icon)
                  dest_dir = os.path.join(RES, density_dir if drawable_prefix == "drawable" else density_dir.replace("drawable", "drawable-night"))
                  dest_path = os.path.join(dest_dir, "splash_icon.png")
                  os.makedirs(dest_dir, exist_ok=True)
                  canvas.save(dest_path, "PNG", optimize=True)
                  print(f"  -> {dest_path}")
              default_dir = os.path.join(RES, "drawable" if drawable_prefix == "drawable" else "drawable-night")
              os.makedirs(default_dir, exist_ok=True)
              default_size = 480
              icon_size = int(default_size * 0.55)
              canvas = Image.new("RGBA", (default_size, default_size), (0, 0, 0, 0))
              icon = src_img.resize((icon_size, icon_size), Image.LANCZOS)
              off = (default_size - icon_size) // 2
              canvas.paste(icon, (off, off), icon)
              default_path = os.path.join(default_dir, "splash_icon.png")
              canvas.save(default_path, "PNG", optimize=True)
              print(f"  -> {default_path}")

          make_splash_variants(SPLASH_LIGHT, "drawable")
          make_splash_variants(SPLASH_DARK, "drawable-night")

          print("✅ Ícones e splash (light/dark), sem fallback, processados com sucesso!")
          PYEOF

