      - name: Start shimmer AnimationDrawable on window focus (pré-Android 12)
        script: |
          MAIN_ACTIVITY=$(find "${CM_BUILD_DIR}/android/app/src/main" -name "MainActivity.kt" -o -name "MainActivity.java" | head -1)
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "❌ MainActivity não encontrada"
            exit 1
          fi
          echo "MainActivity encontrada em: $MAIN_ACTIVITY"

          python3 << PYEOF
          import re

          path = "$MAIN_ACTIVITY"
          with open(path, "r") as f:
              content = f.read()

          is_kotlin = path.endswith(".kt")

          if is_kotlin and "onWindowFocusChanged" not in content:
              # flutter create pode gerar classe sem corpo: "class MainActivity: FlutterActivity()"
              # Normaliza para ter corpo antes de injetar
              content = re.sub(
                  r'(class MainActivity\s*:\s*FlutterActivity\(\))\s*$',
                  r'\1 {}',
                  content,
                  flags=re.MULTILINE
              )

              shimmer_code = '''

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) {
                      val bg = window.decorView.background
                      if (bg is android.graphics.drawable.LayerDrawable) {
                          for (i in 0 until bg.numberOfLayers) {
                              val d = bg.getDrawable(i)
                              if (d is android.graphics.drawable.AnimationDrawable) {
                                  d.start()
                              }
                          }
                      }
                  }
              }
          '''

              # Encontra o { de abertura da classe e injeta antes do } de fecho
              idx = content.find("class MainActivity")
              if idx == -1:
                  raise SystemExit("❌ class MainActivity não encontrada")

              brace_open = content.find("{", idx)
              if brace_open == -1:
                  raise SystemExit("❌ { de abertura da classe não encontrado")

              brace_close = content.rfind("}")
              if brace_close == -1 or brace_close <= brace_open:
                  raise SystemExit("❌ } de fecho da classe não encontrado")

              injected = content[:brace_close] + shimmer_code + content[brace_close:]

              with open(path, "w") as f:
                  f.write(injected)
              print("✅ onWindowFocusChanged injetado em MainActivity.kt")
          elif is_kotlin:
              print("✅ onWindowFocusChanged já presente — nada a fazer")
          PYEOF

