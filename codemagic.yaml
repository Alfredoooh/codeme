      - name: Ensure READ_MEDIA + WRITE permissions for image_picker
        script: |
          MANIFEST="${CM_BUILD_DIR}/android/app/src/main/AndroidManifest.xml"
          python3 << PYEOF
          import re

          path = "$MANIFEST"
          with open(path, "r") as f:
              content = f.read()

          to_add = []
          perms = [
              'android.permission.READ_MEDIA_IMAGES',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.WRITE_EXTERNAL_STORAGE',
          ]
          for p in perms:
              if p not in content:
                  to_add.append(f'<uses-permission android:name="{p}" />')

          if to_add:
              block = "\n    ".join(to_add)
              content = re.sub(
                  r'(<manifest[^>]*>)',
                  r'\1\n    ' + block,
                  content,
                  count=1,
              )
              with open(path, "w") as f:
                  f.write(content)
              print(f"✅ Permissões de storage adicionadas: {', '.join(p.split('.')[-1] for p in perms if p in open(path).read())}")
          else:
              print("✅ Permissões de storage já presentes")
          PYEOF

      - name: Add R8 keep rules for google_mlkit_text_recognition
        script: |
          PROGUARD="${CM_BUILD_DIR}/android/app/proguard-rules.pro"
          touch "$PROGUARD"
          if ! grep -q "mlkit.vision.text" "$PROGUARD"; then
            cat >> "$PROGUARD" << 'EOF'

          # google_mlkit_text_recognition — keep all script option classes
          # (Chinese, Devanagari, Japanese, Korean) so R8 does not fail when
          # the optional script model AARs are absent at compile time.
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          -keep class com.google.mlkit.vision.text.** { *; }
          -keep class com.google_mlkit_text_recognition.** { *; }
          EOF
            echo "✅ Keep rules mlkit adicionadas ao proguard-rules.pro"
          else
            echo "✅ Keep rules mlkit já presentes"
          fi

          # Garante que o build.gradle referencia o proguard-rules.pro
          GRADLE_FILE="${CM_BUILD_DIR}/android/app/build.gradle"
          if grep -q "proguardFiles" "$GRADLE_FILE" && ! grep -q "proguard-rules.pro" "$GRADLE_FILE"; then
            sed -i "s|getDefaultProguardFile('proguard-android-optimize.txt')|getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'|g" "$GRADLE_FILE"
