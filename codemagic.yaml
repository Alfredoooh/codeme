# ══════════════════════════════════════════════════════════════
# codemagic.yaml
# Gera TODO o projeto Android/Kotlin (Jetpack Compose, M3 Expressive)
# do zero, em runtime, e builda o APK. O repositório Git só
# precisa conter este arquivo.
# ══════════════════════════════════════════════════════════════
workflows:
  code-ide-android:
    name: Code IDE (Kotlin/Compose) - Full Scaffold + Build
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      vars:
        PKG: "com.yourorg.codeide"
        APP_DIR: "android-ide"
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true

    scripts:
      # ──────────────────────────────────────────────────────
      # 1. Estrutura de pastas
      # ──────────────────────────────────────────────────────
      - name: Create folder structure
        script: |
          set -e
          ROOT="$CM_BUILD_DIR/$APP_DIR"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          mkdir -p "$ROOT/app/src/main/java/$PKG_PATH/ui/theme"
          mkdir -p "$ROOT/app/src/main/java/$PKG_PATH/ui/drawer"
          mkdir -p "$ROOT/app/src/main/java/$PKG_PATH/ui/editor"
          mkdir -p "$ROOT/app/src/main/java/$PKG_PATH/ui/runner"
          mkdir -p "$ROOT/app/src/main/java/$PKG_PATH/ui/settings"
          mkdir -p "$ROOT/app/src/main/java/$PKG_PATH/data"
          mkdir -p "$ROOT/app/src/main/res/values"
          mkdir -p "$ROOT/app/src/main/res/mipmap-anydpi-v26"
          mkdir -p "$ROOT/app/src/main/res/drawable"
          mkdir -p "$ROOT/app/src/main/res/xml"
          mkdir -p "$ROOT/app/src/main/assets/webruntime"
          mkdir -p "$ROOT/app/src/main/assets/templates/html_basic"
          mkdir -p "$ROOT/app/src/main/assets/templates/react_basic/src"
          mkdir -p "$ROOT/app/src/main/assets/templates/ts_basic/src"
          mkdir -p "$ROOT/gradle/wrapper"
          echo "PKG_PATH=$PKG_PATH" >> $CM_ENV

      # ──────────────────────────────────────────────────────
      # 2. Gradle root files
      # ──────────────────────────────────────────────────────
      - name: Write root Gradle files
        script: |
          set -e
          ROOT="$CM_BUILD_DIR/$APP_DIR"

          cat > "$ROOT/settings.gradle.kts" << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CodeIDE"
          include(":app")
          EOF

          cat > "$ROOT/build.gradle.kts" << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "1.9.24" apply false
          }
          EOF

          cat > "$ROOT/gradle.properties" << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          android.suppressUnsupportedCompileSdk=35
          EOF

          cat > "$ROOT/gradle/wrapper/gradle-wrapper.properties" << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      # ──────────────────────────────────────────────────────
      # 3. app/build.gradle.kts + Manifest
      #    (kotlinx.serialization rebaixado para 1.6.3, compatível
      #     com Kotlin 1.9.24 — corrige o erro do log)
      # ──────────────────────────────────────────────────────
      - name: Write app module Gradle + Manifest
        script: |
          set -e
          ROOT="$CM_BUILD_DIR/$APP_DIR"

          cat > "$ROOT/app/build.gradle.kts" << EOF
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.serialization")
          }

          android {
              namespace = "$PKG"
              compileSdk = 35

              defaultConfig {
                  applicationId = "$PKG"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              packaging {
                  resources.excludes.add("META-INF/*")
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.6")

              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3:1.4.0-alpha09")
              implementation("androidx.compose.material:material-icons-extended:1.7.5")
              implementation("androidx.navigation:navigation-compose:2.8.3")

              implementation("androidx.datastore:datastore-preferences:1.1.1")
              // ATENÇÃO: 1.6.3 é a última versão de kotlinx.serialization
              // compatível com Kotlin 1.9.x. Versões 1.7.x exigem Kotlin 2.0+.
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3")

              implementation("org.nanohttpd:nanohttpd:2.3.1")
              implementation("org.apache.commons:commons-compress:1.27.1")

              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          mkdir -p "$ROOT/app/src/main"
          cat > "$ROOT/app/src/main/AndroidManifest.xml" << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Internet só é usada pelo CÓDIGO IMPORTADO pelo usuário
                   (fetch/API/imagens remotas). O IDE em si roda 100% local. -->
              <uses-permission android:name="android.permission.INTERNET" />

              <!-- Necessárias para o seletor de arquivos conseguir ler
                   o .zip escolhido pelo usuário em qualquer origem
                   (armazenamento local, Drive, Downloads, etc.) -->
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />

              <!-- Para o modo "rodar em segundo plano" -->
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:name=".CodeIdeApp"
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Code IDE"
                  android:theme="@style/Theme.CodeIDE"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:theme="@style/Theme.CodeIDE">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$ROOT/app/src/main/res/values/themes.xml" << 'EOF'
          <resources>
              <style name="Theme.CodeIDE" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat > "$ROOT/app/src/main/res/values/strings.xml" << 'EOF'
          <resources>
              <string name="app_name">Code IDE</string>
          </resources>
          EOF

      # ──────────────────────────────────────────────────────
      # 4. Ícone do app (adaptive icon, 100% vetor)
      # ──────────────────────────────────────────────────────
      - name: Write app icon (adaptive vector)
        script: |
          set -e
          ROOT="$CM_BUILD_DIR/$APP_DIR"
          RES="$ROOT/app/src/main/res"

          cat > "$RES/drawable/ic_launcher_background.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#3D5AFE" android:pathData="M0,0h108v108h-108z" />
          </vector>
          EOF

          cat > "$RES/drawable/ic_launcher_foreground.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFF"
                  android:strokeWidth="6" android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M35,40 L20,54 L35,68" />
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFF"
                  android:strokeWidth="6" android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M73,40 L88,54 L73,68" />
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFF"
                  android:strokeWidth="6" android:strokeLineCap="round"
                  android:pathData="M62,32 L46,76" />
          </vector>
          EOF

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

      # ──────────────────────────────────────────────────────
      # 5. Tema M3 Expressive (Compose) — claro + escuro
      # ──────────────────────────────────────────────────────
      - name: Write Compose theme (M3 Expressive, light+dark)
        script: |
          set -e
          ROOT="$CM_BUILD_DIR/$APP_DIR"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          DIR="$ROOT/app/src/main/java/$PKG_PATH/ui/theme"

          cat > "$DIR/Color.kt" << EOF
          package $PKG.ui.theme

          import androidx.compose.ui.graphics.Color

          val Primary = Color(0xFF3D5AFE)
          val OnPrimary = Color(0xFFFFFFFF)
          val PrimaryContainer = Color(0xFFDEE0FF)
          val OnPrimaryContainer = Color(0xFF00107A)
          val Secondary = Color(0xFF00BFA5)
          val Tertiary = Color(0xFFFF6D00)
          val Surface = Color(0xFFFDFBFF)
          val OnSurface = Color(0xFF1B1B1F)
          val SurfaceDark = Color(0xFF121318)
          val OnSurfaceDark = Color(0xFFE4E1E9)
          val Background = Color(0xFFFAFAFA)
          val BackgroundDark = Color(0xFF0F0F13)
          val SurfaceVariantDark = Color(0xFF1E2027)
          EOF

          cat > "$DIR/Type.kt" << EOF
          package $PKG.ui.theme

          import androidx.compose.material3.Typography
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp

          val AppTypography = Typography(
              headlineMedium = TextStyle(fontWeight = FontWeight.Bold, fontSize = 26.sp),
              titleLarge = TextStyle(fontWeight = FontWeight.SemiBold, fontSize = 20.sp),
              titleMedium = TextStyle(fontWeight = FontWeight.Medium, fontSize = 16.sp),
              bodyLarge = TextStyle(fontWeight = FontWeight.Normal, fontSize = 15.sp),
              bodyMedium = TextStyle(fontWeight = FontWeight.Normal, fontSize = 13.sp),
              labelLarge = TextStyle(fontWeight = FontWeight.Medium, fontSize = 13.sp)
          )
          EOF

          cat > "$DIR/Theme.kt" << EOF
          package $PKG.ui.theme

          import android.os.Build
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.dynamicDarkColorScheme
          import androidx.compose.material3.dynamicLightColorScheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.platform.LocalContext
          import $PKG.data.AppThemeMode

          private val LightColors = lightColorScheme(
              primary = Primary, onPrimary = OnPrimary,
              primaryContainer = PrimaryContainer, onPrimaryContainer = OnPrimaryContainer,
              secondary = Secondary, tertiary = Tertiary,
              background = Background, surface = Surface, onSurface = OnSurface
          )

          private val DarkColors = darkColorScheme(
              primary = Primary, onPrimary = OnPrimary,
              secondary = Secondary, tertiary = Tertiary,
              background = BackgroundDark, surface = SurfaceDark, onSurface = OnSurfaceDark,
              surfaceVariant = SurfaceVariantDark
          )

          @Composable
          fun CodeIdeTheme(
              themeMode: AppThemeMode,
              systemDark: Boolean,
              dynamicColor: Boolean = false,
              content: @Composable () -> Unit
          ) {
              val darkTheme = when (themeMode) {
                  AppThemeMode.LIGHT -> false
                  AppThemeMode.DARK -> true
                  AppThemeMode.SYSTEM -> systemDark
              }
              val context = LocalContext.current
              val colorScheme = when {
                  dynamicColor && Build.VERSION.SDK_INT >= Build.VERSION_CODES.S ->
                      if (darkTheme) dynamicDarkColorScheme(context) else dynamicLightColorScheme(context)
                  darkTheme -> DarkColors
                  else -> LightColors
              }

              MaterialTheme(
                  colorScheme = colorScheme,
                  typography = AppTypography,
                  content = content
              )
          }
          EOF

      # ──────────────────────────────────────────────────────
      # 6. Data layer: preferências (tema + projetos persistidos)
      # ──────────────────────────────────────────────────────
      - name: Write PreferencesRepository (theme + saved projects)
        script: |
          set -e
          ROOT="$CM_BUILD_DIR/$APP_DIR"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          DIR="$ROOT/app/src/main/java/$PKG_PATH/data"

          cat > "$DIR/PreferencesRepository.kt" << EOF
          package $PKG.data

          import android.content.Context
          import androidx.datastore.preferences.core.*
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import kotlinx.serialization.Serializable
          import kotlinx.serialization.encodeToString
          import kotlinx.serialization.decodeFromString
          import kotlinx.serialization.json.Json

          private val Context.dataStore by preferencesDataStore(name = "code_ide_prefs")

          enum class AppThemeMode { LIGHT, DARK, SYSTEM }

          @Serializable
          data class SavedProject(
              val name: String,
              val path: String,
              val importedAt: Long = System.currentTimeMillis()
          )

          class PreferencesRepository(private val context: Context) {

              private object Keys {
                  val THEME_MODE = stringPreferencesKey("theme_mode")
                  val PROJECTS_JSON = stringPreferencesKey("projects_json")
                  val LAST_OPEN_PROJECT_PATH = stringPreferencesKey("last_open_project_path")
                  val RUN_IN_BACKGROUND = booleanPreferencesKey("run_in_background")
              }

              val themeMode: Flow<AppThemeMode> = context.dataStore.data.map { prefs ->
                  when (prefs[Keys.THEME_MODE]) {
                      "LIGHT" -> AppThemeMode.LIGHT
                      "DARK" -> AppThemeMode.DARK
                      else -> AppThemeMode.SYSTEM
                  }
              }

              suspend fun setThemeMode(mode: AppThemeMode) {
                  context.dataStore.edit { it[Keys.THEME_MODE] = mode.name }
              }

              val runInBackground: Flow<Boolean> = context.dataStore.data.map {
                  it[Keys.RUN_IN_BACKGROUND] ?: false
              }

              suspend fun setRunInBackground(value: Boolean) {
                  context.dataStore.edit { it[Keys.RUN_IN_BACKGROUND] = value }
              }

              val savedProjects: Flow<List<SavedProject>> = context.dataStore.data.map { prefs ->
                  val json = prefs[Keys.PROJECTS_JSON] ?: "[]"
                  try {
                      Json.decodeFromString<List<SavedProject>>(json)
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              suspend fun addOrUpdateProject(project: SavedProject) {
                  context.dataStore.edit { prefs ->
                      val current = try {
                          Json.decodeFromString<List<SavedProject>>(prefs[Keys.PROJECTS_JSON] ?: "[]")
                      } catch (e: Exception) { emptyList() }
                      val updated = current.filter { it.path != project.path } + project
                      prefs[Keys.PROJECTS_JSON] = Json.encodeToString(updated)
                      prefs[Keys.LAST_OPEN_PROJECT_PATH] = project.path
                  }
              }

              suspend fun removeProject(path: String) {
                  context.dataStore.edit { prefs ->
                      val current = try {
                          Json.decodeFromString<List<SavedProject>>(prefs[Keys.PROJECTS_JSON] ?: "[]")
                      } catch (e: Exception) { emptyList() }
                      prefs[Keys.PROJECTS_JSON] = Json.encodeToString(current.filter { it.path != path })
                  }
              }

              val lastOpenProjectPath: Flow<String?> = context.dataStore.data.map {
                  it[Keys.LAST_OPEN_PROJECT_PATH]
              }
          }
          EOF

      # ──────────────────────────────────────────────────────
      # 7. Data layer: repositório de projetos + servidor local
      # ──────────────────────────────────────────────────────
      - name: Write data layer (ProjectRepository, LocalWebServer)
        script: |
          set -e
          ROOT="$CM_BUILD_DIR/$APP_DIR"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          DIR="$ROOT/app/src/main/java/$PKG_PATH/data"

          cat > "$DIR/ProjectRepository.kt" << EOF
          package $PKG.data

          import android.content.Context
          import org.apache.commons.compress.archivers.zip.ZipFile
          import java.io.File
          import java.io.FileOutputStream

          class ProjectRepository(private val context: Context) {

              private val projectsRoot: File
                  get() = File(context.filesDir, "projects").apply { mkdirs() }

              fun importZip(zipPath: String, projectName: String): File {
                  val destDir = File(projectsRoot, projectName)
                  if (destDir.exists()) destDir.deleteRecursively()
                  destDir.mkdirs()

                  ZipFile(File(zipPath)).use { zip ->
                      val entries = zip.entries
                      while (entries.hasMoreElements()) {
                          val entry = entries.nextElement()
                          val outFile = File(destDir, entry.name)
                          if (entry.isDirectory) {
                              outFile.mkdirs()
                          } else {
                              outFile.parentFile?.mkdirs()
                              zip.getInputStream(entry).use { input ->
                                  FileOutputStream(outFile).use { output -> input.copyTo(output) }
                              }
                          }
                      }
                  }
                  return destDir
              }

              fun importFromAssetsTemplate(templateId: String, projectName: String): File {
                  val destDir = File(projectsRoot, projectName)
                  if (destDir.exists()) destDir.deleteRecursively()
                  destDir.mkdirs()
                  copyAssetDir("templates/\$templateId", destDir)
                  return destDir
              }

              private fun copyAssetDir(assetPath: String, destDir: File) {
                  val assets = context.assets
                  val items = assets.list(assetPath) ?: return
                  if (items.isEmpty()) {
                      destDir.parentFile?.mkdirs()
                      assets.open(assetPath).use { input ->
                          FileOutputStream(destDir).use { output -> input.copyTo(output) }
                      }
                      return
                  }
                  destDir.mkdirs()
                  for (item in items) {
                      val childAssetPath = "\$assetPath/\$item"
                      val childDest = File(destDir, item)
                      val childItems = assets.list(childAssetPath)
                      if (childItems.isNullOrEmpty()) {
                          assets.open(childAssetPath).use { input ->
                              FileOutputStream(childDest).use { output -> input.copyTo(output) }
                          }
                      } else {
                          copyAssetDir(childAssetPath, childDest)
                      }
                  }
              }

              fun fileTree(root: File): List<File> =
                  root.walkTopDown().filter { it != root }.sortedBy { it.path }.toList()

              fun readFile(file: File): String = file.readText()

              fun writeFile(file: File, content: String) = file.writeText(content)

              fun exists(path: String): Boolean = File(path).exists()
          }
          EOF

          cat > "$DIR/LocalWebServer.kt" << EOF
          package $PKG.data

          import fi.iki.elonen.NanoHTTPD
          import java.io.File

          class LocalWebServer(
              port: Int,
              private val rootDir: File
          ) : NanoHTTPD("127.0.0.1", port) {

              override fun serve(session: IHTTPSession): Response {
                  var path = session.uri.removePrefix("/")
                  if (path.isEmpty()) path = "index.html"

                  val file = File(rootDir, path)
                  if (!file.exists() || file.isDirectory) {
                      return newFixedLengthResponse(
                          Response.Status.NOT_FOUND, "text/plain", "404: \$path não encontrado"
                      )
                  }

                  return newChunkedResponse(Response.Status.OK, mimeFor(file.extension), file.inputStream())
              }

              private fun mimeFor(ext: String): String = when (ext.lowercase()) {
                  "html" -> "text/html"
                  "js", "mjs", "jsx", "tsx", "ts" -> "application/javascript"
                  "css" -> "text/css"
                  "json" -> "application/json"
                  "png" -> "image/png"
                  "jpg", "jpeg" -> "image/jpeg"
                  "svg" -> "image/svg+xml"
                  "wasm" -> "application/wasm"
                  else -> "application/octet-stream"
              }
          }
          EOF

      # ──────────────────────────────────────────────────────
      # 8. Application + MainActivity (upload de zip real)
      #    Usa GetContent("*/*") pois muitos file pickers reportam
      #    mimetype genérico para .zip — filtramos pela extensão.
      # ──────────────────────────────────────────────────────
      - name: Write Application and MainActivity
        script: |
          set -e
          ROOT="$CM_BUILD_DIR/$APP_DIR"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          BASE="$ROOT/app/src/main/java/$PKG_PATH"

          cat > "$BASE/CodeIdeApp.kt" << EOF
          package $PKG

          import android.app.Application

          class CodeIdeApp : Application()
          EOF

          cat > "$BASE/MainActivity.kt" << EOF
          package $PKG

          import android.net.Uri
          import android.os.Bundle
          import android.provider.OpenableColumns
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.Surface
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import $PKG.data.AppThemeMode
          import $PKG.data.PreferencesRepository
          import $PKG.ui.IdeRootScreen
          import $PKG.ui.theme.CodeIdeTheme
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()

                  val prefsRepo = PreferencesRepository(applicationContext)

                  setContent {
                      var pickedZipPath by remember { mutableStateOf<String?>(null) }
                      var pickError by remember { mutableStateOf<String?>(null) }
                      val themeMode by prefsRepo.themeMode.collectAsState(initial = AppThemeMode.SYSTEM)
                      val systemDark = isSystemInDarkTheme()

                      // "*/*" porque muitos provedores (Drive, Downloads,
                      // gerenciadores de arquivo) não relatam
                      // application/zip corretamente. Validamos a
                      // extensão depois de copiar para o cache.
                      val pickZipLauncher = rememberLauncherForActivityResult(
                          contract = ActivityResultContracts.GetContent()
                      ) { uri: Uri? ->
                          if (uri == null) return@rememberLauncherForActivityResult
                          val displayName = queryDisplayName(uri) ?: ""
                          if (!displayName.lowercase().endsWith(".zip")) {
                              pickError = "Selecione um arquivo .zip válido"
                              return@rememberLauncherForActivityResult
                          }
                          val copied = copyUriToCache(uri)
                          if (copied == null) {
                              pickError = "Não foi possível ler o arquivo selecionado"
                          } else {
                              pickedZipPath = copied
                          }
                      }

                      CodeIdeTheme(themeMode = themeMode, systemDark = systemDark) {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              IdeRootScreen(
                                  prefsRepo = prefsRepo,
                                  pickedZipPath = pickedZipPath,
                                  onZipConsumed = { pickedZipPath = null },
                                  onRequestZipPick = { pickZipLauncher.launch("*/*") },
                                  pickError = pickError,
                                  onPickErrorShown = { pickError = null }
                              )
                          }
                      }
                  }
              }

              private fun queryDisplayName(uri: Uri): String? {
                  return try {
                      contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          val idx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (idx >= 0 && cursor.moveToFirst()) cursor.getString(idx) else uri.lastPathSegment
                      } ?: uri.lastPathSegment
                  } catch (e: Exception) {
                      uri.lastPathSegment
                  }
              }

              private fun copyUriToCache(uri: Uri): String? {
                  return try {
                      val fileName = "import_\${System.currentTimeMillis()}.zip"
                      val outFile = File(cacheDir, fileName)
                      contentResolver.openInputStream(uri)?.use { input ->
                          FileOutputStream(outFile).use { output -> input.copyTo(output) }
                      } ?: return null
                      outFile.absolutePath
                  } catch (e: Exception) {
                      null
                  }
              }
          }
          EOF

