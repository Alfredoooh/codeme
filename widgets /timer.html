<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Card Cronómetro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 0 16px;
    }

    .card {
      background: #1c1c1e;
      border-radius: 32px;
      padding: 10px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    /* ---------- Preview ---------- */
    .card-preview {
      border-radius: 24px;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #141414;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-wrap {
      position: relative;
      width: 168px;
      height: 168px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-wrap svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: #232323;
      stroke-width: 14;
    }

    .ring-progress {
      fill: none;
      stroke: #2e8bc9;
      stroke-width: 14;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.1s linear, stroke 0.2s;
    }

    .ring-progress.running {
      stroke: #4ec994;
    }

    .time-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .time-main {
      color: #fff;
      font-size: 30px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
    }

    .time-centis {
      color: #555;
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-top: 1px;
    }

    /* ---------- Actions ---------- */
    .card-actions {
      display: flex;
      align-items: center;
      background: #252525;
      border-radius: 50px;
      padding: 5px;
      gap: 6px;
    }

    .btn-primary {
      flex: 1;
      background: #2e8bc9;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      padding: 11px 16px;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 0.1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .btn-primary.is-running {
      background: #4ec994;
    }

    .btn-primary:hover  { background: #2578b0; }
    .btn-primary.is-running:hover { background: #43b483; }
    .btn-primary:active { filter: brightness(0.9); }

    .btn-circle {
      width: 40px;
      height: 40px;
      background: #333;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 15px;
    }

    .btn-circle:hover  { background: #3d3d3d; }
    .btn-circle:active { background: #292929; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-preview">
      <div class="ring-wrap">
        <svg width="168" height="168" viewBox="0 0 168 168">
          <circle class="ring-track" cx="84" cy="84" r="72"></circle>
          <circle class="ring-progress" id="ringProgress" cx="84" cy="84" r="72"
                  stroke-dasharray="452.39" stroke-dashoffset="452.39"></circle>
        </svg>
        <div class="time-display">
          <div class="time-main" id="timeMain">00:00</div>
          <div class="time-centis" id="timeCentis">.00</div>
        </div>
      </div>
    </div>

    <div class="card-actions">
      <button class="btn-primary" id="startStopBtn">
        <i class="fa-solid fa-play"></i>
        Iniciar
      </button>
      <button class="btn-circle" id="resetBtn" title="Repor">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
    </div>
  </div>

  <script>
    var RING_CIRCUMFERENCE = 2 * Math.PI * 72; // 452.39

    var elapsedMs = 0;
    var startTimestamp = 0;
    var running = false;
    var rafId = null;

    var timeMainEl     = document.getElementById('timeMain');
    var timeCentisEl   = document.getElementById('timeCentis');
    var ringProgressEl = document.getElementById('ringProgress');
    var startStopBtn   = document.getElementById('startStopBtn');
    var resetBtn       = document.getElementById('resetBtn');

    function pad2(n) { return n < 10 ? '0' + n : String(n); }

    function formatTime(ms) {
      var totalCentis = Math.floor(ms / 10);
      var centis = totalCentis % 100;
      var totalSeconds = Math.floor(ms / 1000);
      var seconds = totalSeconds % 60;
      var totalMinutes = Math.floor(totalSeconds / 60);
      var minutes = totalMinutes % 60;
      var hours = Math.floor(totalMinutes / 60);

      var main = hours > 0
        ? pad2(hours) + ':' + pad2(minutes) + ':' + pad2(seconds)
        : pad2(minutes) + ':' + pad2(seconds);

      return { main: main, centis: '.' + pad2(centis) };
    }

    function currentElapsed() {
      if (!running) return elapsedMs;
      return elapsedMs + (performance.now() - startTimestamp);
    }

    function render() {
      var ms = currentElapsed();
      var t = formatTime(ms);
      timeMainEl.textContent = t.main;
      timeCentisEl.textContent = t.centis;

      var secCycle = (ms % 60000) / 60000;
      ringProgressEl.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - secCycle);
    }

    function loop() {
      if (!running) return;
      render();
      rafId = requestAnimationFrame(loop);
    }

    function start() {
      running = true;
      startTimestamp = performance.now();

      startStopBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pausar';
      startStopBtn.classList.add('is-running');
      ringProgressEl.classList.add('running');

      loop();
    }

    function pause() {
      running = false;
      elapsedMs = currentElapsed();
      if (rafId) cancelAnimationFrame(rafId);

      startStopBtn.innerHTML = '<i class="fa-solid fa-play"></i> Retomar';
      startStopBtn.classList.remove('is-running');
      ringProgressEl.classList.remove('running');

      render();
    }

    function reset() {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      elapsedMs = 0;
      startTimestamp = 0;

      startStopBtn.innerHTML = '<i class="fa-solid fa-play"></i> Iniciar';
      startStopBtn.classList.remove('is-running');
      ringProgressEl.classList.remove('running');

      render();
    }

    startStopBtn.addEventListener('click', function() {
      if (running) pause(); else start();
    });

    resetBtn.addEventListener('click', reset);

    render();
  </script>
</body>
</html>
