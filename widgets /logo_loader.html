<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Nexa Loader</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
    background: rgb(31, 31, 31);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .loader {
    position: relative;
    width: 128px;
    height: 128px;
  }

  .dot {
    position: absolute;
    width: 5.64px;
    height: 5.64px;
    opacity: 0.25;
    animation: piscar 1.6s ease-in-out infinite;
  }

  @keyframes piscar {
    0%   { opacity: 0.25; }
    50%  { opacity: 1; }
    100% { opacity: 0.25; }
  }

  .dot:nth-child(1)  { left: 28.21px; top: 55.26px; background: rgb(88,148,247);  animation-delay: 0.00s; }
  .dot:nth-child(2)  { left: 42.30px; top: 49.85px; background: rgb(91,150,247);  animation-delay: 0.07s; }
  .dot:nth-child(3)  { left: 35.05px; top: 42.55px; background: rgb(99,155,247);  animation-delay: 0.13s; }
  .dot:nth-child(4)  { left: 42.45px; top: 35.10px; background: rgb(112,164,248); animation-delay: 0.20s; }
  .dot:nth-child(5)  { left: 49.44px; top: 42.51px; background: rgb(130,175,249); animation-delay: 0.27s; }
  .dot:nth-child(6)  { left: 55.21px; top: 29.38px; background: rgb(150,188,250); animation-delay: 0.33s; }
  .dot:nth-child(7)  { left: 67.36px; top: 29.33px; background: rgb(171,201,251); animation-delay: 0.40s; }
  .dot:nth-child(8)  { left: 72.92px; top: 42.55px; background: rgb(193,215,252); animation-delay: 0.47s; }
  .dot:nth-child(9)  { left: 79.96px; top: 35.10px; background: rgb(213,228,253); animation-delay: 0.53s; }
  .dot:nth-child(10) { left: 87.37px; top: 42.55px; background: rgb(230,239,253); animation-delay: 0.60s; }
  .dot:nth-child(11) { left: 79.96px; top: 49.85px; background: rgb(243,247,254); animation-delay: 0.67s; }
  .dot:nth-child(12) { left: 94.05px; top: 55.26px; background: rgb(252,253,254); animation-delay: 0.73s; }
