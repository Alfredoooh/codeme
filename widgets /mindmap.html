<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Card - Mapa Mental</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e5e5e5;
    font-family: -apple-system, sans-serif;
  }

  .card {
    position: relative;
    width: 320px;
    height: 320px;
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 32px;
    box-sizing: border-box;
    overflow: hidden;
  }

  .expand-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #f4f4f4;
    border: 1px solid #d9d9d9;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
  }

  .expand-btn svg {
    width: 14px;
    height: 14px;
  }

  .mindmap-scroll {
    width: 100%;
    height: 100%;
    overflow: auto;
    cursor: grab;
  }

  .mindmap-scroll:active {
    cursor: grabbing;
  }

  .mindmap-canvas {
    position: relative;
    width: 4200px;
    height: 2400px;
  }

  svg.connections {
    position: absolute;
    top: 0;
    left: 0;
    width: 4200px;
    height: 2400px;
    pointer-events: none;
  }

  .node {
    position: absolute;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 2px 5px rgba(0,0,0,0.10);
  }

  .node.root {
    background: #fce38a;
    color: #4a3b00;
    font-size: 15px;
    padding: 14px 26px;
    border-radius: 14px;
  }

  .node.l1 { background: #c9c2f5; color: #2c2470; }
  .node.l2 { background: #f7b2d9; color: #6b0d47; }
  .node.l3 { background: #a3e0d8; color: #0d4a40; }
  .node.l4 { background: #ffd39a; color: #5c3400; }
  .node.l5 { background: #b7dcfe; color: #06304d; }
  .node.l6 { background: #ffb3b3; color: #5c0d0d; }
</style>
</head>
<body>

  <div class="card">
    <div class="expand-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h6v6"></path>
        <path d="M9 21H3v-6"></path>
        <path d="M21 3l-7 7"></path>
        <path d="M3 21l7-7"></path>
      </svg>
    </div>

    <div class="mindmap-scroll" id="scrollArea">
      <div class="mindmap-canvas" id="canvas">
        <svg class="connections" id="lines"></svg>
        <!-- nodes injected by JS -->
      </div>
    </div>
  </div>

<script>
  const canvas = document.getElementById('canvas');
  const linesSvg = document.getElementById('lines');
  const scrollArea = document.getElementById('scrollArea');

  const nodeEls = [];
  const lines = [];

  // approximate node dimensions used for anchor calc (width depends on text, so we measure after render)
  function createNode(x, y, text, cls) {
    const div = document.createElement("div");
    div.className = "node " + cls;
    div.textContent = text;
    div.style.left = x + "px";
    div.style.top = y + "px";
    canvas.appendChild(div);
    nodeEls.push({el: div, x, y, cls});
    return {x, y, el: div};
  }

  function connect(parent, child, side) {
    lines.push({parent, child, side});
  }

  // ---- ROOT ----
  const centerX = 2100, centerY = 1200;
  const root = createNode(centerX, centerY, "IDEIA CENTRAL", "root");

  const branchColors = ["l1","l2","l3","l4","l5","l6"];
  const branchNames = ["Conceituação","Desenvolvimento","Lançamento","Testes","Manutenção","Estratégia"];

  const rightBranches = [0, 1, 2]; // indices going right
  const leftBranches = [3, 4, 5];  // indices going left

  const vGap = 160;      // vertical spacing between branch rows
  const branchOffsetX = 380; // distance from center to branch node
  const subOffsetX = 420;    // distance from branch to sub nodes
  const subVGap = 60;

  function buildSide(indices, direction) {
    // direction: 1 = right, -1 = left
    const startY = centerY - ((indices.length - 1) * vGap) / 2;
    indices.forEach((bi, row) => {
      const by = startY + row * vGap;
      const bx = centerX + direction * branchOffsetX;
      const cls = branchColors[bi % branchColors.length];
      const branch = createNode(bx, by, (bi + 1) + ". " + branchNames[bi], cls);
      connect(root, branch, direction);

      const subCount = 3;
      const subStartY = by - ((subCount - 1) * subVGap) / 2;
      for (let s = 0; s < subCount; s++) {
        const sy = subStartY + s * subVGap;
        const sx = bx + direction * subOffsetX;
        const sub = createNode(sx, sy, "Sub " + (bi + 1) + "." + (s + 1), cls);
        connect(branch, sub, direction);
      }
    });
  }

  buildSide(rightBranches, 1);
  buildSide(leftBranches, -1);

  // after layout, adjust node positions so (x,y) becomes true center via transform,
  // then compute anchor points (left/right edge) for curve drawing
  function drawCurves() {
    linesSvg.innerHTML = "";
    lines.forEach(({parent, child, side}) => {
      const pRect = parent.el.getBoundingClientRect();
      const cRect = child.el.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();

      const pCenterX = pRect.left - canvasRect.left + pRect.width / 2;
      const pCenterY = pRect.top - canvasRect.top + pRect.height / 2;
      const cCenterX = cRect.left - canvasRect.left + cRect.width / 2;
      const cCenterY = cRect.top - canvasRect.top + cRect.height / 2;

      const x1 = side === 1 ? pRect.right - canvasRect.left : pRect.left - canvasRect.left;
      const y1 = pCenterY;
      const x2 = side === 1 ? cRect.left - canvasRect.left : cRect.right - canvasRect.left;
      const y2 = cCenterY;

      const midX = (x1 + x2) / 2;

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const d = `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`;
      path.setAttribute("d", d);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "#d0d0d0");
      path.setAttribute("stroke-width", "2.5");
      linesSvg.appendChild(path);
    });
  }

  // center each node div properly using its own measured size
  nodeEls.forEach(n => {
    n.el.style.transform = "translate(-50%, -50%)";
  });

  // wait a frame so layout/getBoundingClientRect is accurate
  requestAnimationFrame(() => {
    drawCurves();

    // center scroll on root
    const canvasRect = canvas.getBoundingClientRect();
    const rootRect = root.el.getBoundingClientRect();
    const rx = rootRect.left - canvasRect.left + rootRect.width / 2;
    const ry = rootRect.top - canvasRect.top + rootRect.height / 2;
    scrollArea.scrollLeft = rx - scrollArea.clientWidth / 2;
    scrollArea.scrollTop = ry - scrollArea.clientHeight / 2;
  });

  // drag to pan
  let isDown = false, startX, startY, scrollLeft, scrollTop;
  scrollArea.addEventListener('mousedown', (e) => {
    isDown = true;
    startX = e.pageX;
    startY = e.pageY;
    scrollLeft = scrollArea.scrollLeft;
    scrollTop = scrollArea.scrollTop;
  });
  window.addEventListener('mouseup', () => isDown = false);
  scrollArea.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    scrollArea.scrollLeft = scrollLeft - (e.pageX - startX);
    scrollArea.scrollTop = scrollTop - (e.pageY - startY);
  });
</script>

</body>
</html>
