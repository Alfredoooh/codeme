<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Card Gráfico Estatístico</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 0 16px;
    }

    .card {
      background: #1c1c1e;
      border-radius: 32px;
      padding: 10px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    /* ---------- Preview ---------- */
    .card-preview {
      border-radius: 24px;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #141414;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .chart-title {
      color: #e8e8e8;
      font-size: 13px;
      font-weight: 700;
      padding: 14px 16px 0;
      flex-shrink: 0;
    }

    .chart-area {
      flex: 1;
      position: relative;
      min-height: 0;
      padding: 4px 12px 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 16px 14px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #999;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ---------- Actions ---------- */
    .card-actions {
      display: flex;
      align-items: center;
      background: #252525;
      border-radius: 50px;
      padding: 5px;
      gap: 6px;
    }

    .btn-primary {
      flex: 1;
      background: #2e8bc9;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      padding: 11px 16px;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 0.1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .btn-primary:hover  { background: #2578b0; }
    .btn-primary:active { background: #1f6a9e; }

    .btn-circle {
      width: 40px;
      height: 40px;
      background: #2e8bc9;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 15px;
    }

    .btn-circle:hover  { background: #2578b0; }
    .btn-circle:active { background: #1f6a9e; }

    /* ---------- Modal (bottom sheet) ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
      backdrop-filter: blur(2px);
    }

    .modal-overlay.open { display: flex; }

    .modal-sheet {
      background: #1c1c1e;
      width: 100%;
      max-width: 420px;
      border-radius: 28px 28px 0 0;
      padding: 18px 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 85vh;
      overflow-y: auto;
      animation: sheetUp 0.22s ease-out;
    }

    @keyframes sheetUp {
      from { transform: translateY(24px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: #3a3a3a;
      border-radius: 3px;
      margin: 0 auto;
    }

    .modal-title {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
    }

    .modal-field label {
      display: block;
      color: #888;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 8px;
    }

    .modal-field input[type="text"] {
      width: 100%;
      background: #262626;
      border: 1px solid #333;
      color: #eee;
      font-size: 14px;
      border-radius: 12px;
      padding: 10px 12px;
    }

    .modal-field input[type="text"]:focus {
      outline: none;
      border-color: #2e8bc9;
    }

    /* Tipo de gráfico */
    .type-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .type-chip {
      background: #262626;
      border: 1px solid #333;
      color: #888;
      font-size: 17px;
      padding: 12px 0;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .type-chip.active {
      background: #2e8bc9;
      border-color: #2e8bc9;
      color: #fff;
    }

    /* Linhas de dados */
    .data-rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .data-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .data-color {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      flex-shrink: 0;
      border: none;
      cursor: pointer;
      padding: 0;
      background: none;
    }

    .data-label-input {
      flex: 1;
      min-width: 0;
      background: #262626;
      border: 1px solid #333;
      color: #eee;
      font-size: 13px;
      border-radius: 10px;
      padding: 9px 10px;
    }

    .data-label-input:focus { outline: none; border-color: #2e8bc9; }

    .data-value-input {
      width: 64px;
      flex-shrink: 0;
      background: #262626;
      border: 1px solid #333;
      color: #eee;
      font-size: 13px;
      border-radius: 10px;
      padding: 9px 10px;
      text-align: right;
    }

    .data-value-input:focus { outline: none; border-color: #2e8bc9; }

    .data-remove {
      background: none;
      border: none;
      color: #555;
      font-size: 14px;
      cursor: pointer;
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .data-remove:hover { background: #333; color: #e05e5e; }

    .add-row-btn {
      background: none;
      border: 1px dashed #3a3a3a;
      color: #777;
      font-size: 12px;
      font-weight: 600;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color 0.15s, color 0.15s;
    }

    .add-row-btn:hover { border-color: #2e8bc9; color: #2e8bc9; }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-modal-cancel {
      flex: 1;
      background: #262626;
      border: 1px solid #333;
      color: #ccc;
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      border-radius: 14px;
      cursor: pointer;
    }

    .btn-modal-save {
      flex: 1;
      background: #2e8bc9;
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      border-radius: 14px;
      cursor: pointer;
    }

    .btn-modal-save:hover { background: #2578b0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-preview">
      <div class="chart-title" id="chartTitle">Dados</div>
      <div class="chart-area" id="chartArea">
        <canvas id="statCanvas"></canvas>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="card-actions">
      <button class="btn-primary" id="optionsBtn">
        <i class="fa-solid fa-sliders"></i>
        Opções
      </button>
      <button class="btn-circle" title="Copiar">
        <i class="fa-regular fa-copy"></i>
      </button>
      <button class="btn-circle" title="Download">
        <i class="fa-solid fa-arrow-down"></i>
      </button>
    </div>
  </div>

  <!-- Modal de opções -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">Opções do gráfico</div>

      <div class="modal-field">
        <label>Tipo de gráfico</label>
        <div class="type-grid" id="typeGrid"></div>
      </div>

      <div class="modal-field">
        <label>Título</label>
        <input type="text" id="titleInput" />
      </div>

      <div class="modal-field">
        <label>Valores</label>
        <div class="data-rows" id="dataRows"></div>
        <button class="add-row-btn" id="addRowBtn" style="margin-top:8px;">
          <i class="fa-solid fa-plus"></i>
          Adicionar valor
        </button>
      </div>

      <div class="modal-actions">
        <button class="btn-modal-cancel" id="modalCancel">Cancelar</button>
        <button class="btn-modal-save" id="modalSave">Aplicar</button>
      </div>
    </div>
  </div>

  <script>
    // ---------- Paleta ----------
    var PALETTE = ['#2e8bc9', '#e05e5e', '#4ec994', '#f0a500', '#c77dff', '#5ecbe0', '#e0785e', '#8ecc4e'];

    // ---------- Estado aplicado (o que o card mostra) ----------
    // A IA preenche isto ao gerar o widget, consoante o pedido do utilizador.
    var dataset = [
      { label: 'Seg', value: 12 },
      { label: 'Ter', value: 19 },
      { label: 'Qua', value: 8 },
      { label: 'Qui', value: 24 },
      { label: 'Sex', value: 17 }
    ];
    var chartTitleText = 'Vendas da semana';
    var currentChartType = 'bar'; // 'bar' | 'line' | 'area' | 'pie'

    // ---------- Estado pendente (editado dentro do modal, só aplica no "Aplicar") ----------
    var draft = null;

    var CHART_TYPES = [
      { key: 'bar',  icon: 'fa-solid fa-chart-column' },
      { key: 'line', icon: 'fa-solid fa-chart-line' },
      { key: 'area', icon: 'fa-solid fa-chart-area' },
      { key: 'pie',  icon: 'fa-solid fa-chart-pie' }
    ];

    document.getElementById('chartTitle').textContent = chartTitleText;

    function cloneDataset(ds) {
      return ds.map(function(d) { return { label: d.label, value: d.value, color: d.color }; });
    }

    // ---------- Canvas ----------
    var canvas = document.getElementById('statCanvas');
    var ctx = canvas.getContext('2d');
    var chartArea = document.getElementById('chartArea');
    var dpr = Math.max(window.devicePixelRatio || 1, 1);

    var progress = 0;
    var animRAF = null;

    function resizeCanvas() {
      var rect = chartArea.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    function draw(skipAnim) {
      buildLegend();
      if (animRAF) cancelAnimationFrame(animRAF);
      if (skipAnim) {
        progress = 1;
        render();
        return;
      }
      progress = 0;
      var start = null;
      var duration = 480;
      function step(ts) {
        if (!start) start = ts;
        var t = Math.min((ts - start) / duration, 1);
        progress = easeOutCubic(t);
        render();
        if (t < 1) animRAF = requestAnimationFrame(step);
      }
      animRAF = requestAnimationFrame(step);
    }

    function render() {
      var rect = chartArea.getBoundingClientRect();
      var w = rect.width, h = rect.height;
      ctx.clearRect(0, 0, w, h);

      if (!dataset.length) return;

      if (currentChartType === 'bar') renderBar(w, h);
      else if (currentChartType === 'line') renderLine(w, h, false);
      else if (currentChartType === 'area') renderLine(w, h, true);
      else if (currentChartType === 'pie') renderPie(w, h);
    }

    function renderBar(w, h) {
      var padBottom = 22, padTop = 10, padSide = 6;
      var maxVal = Math.max.apply(null, dataset.map(function(d){ return d.value; })) || 1;
      var innerW = w - padSide * 2;
      var innerH = h - padBottom - padTop;
      var gap = 10;
      var barW = (innerW - gap * (dataset.length - 1)) / dataset.length;

      dataset.forEach(function(d, i) {
        var color = d.color || PALETTE[i % PALETTE.length];
        var barH = (d.value / maxVal) * innerH * progress;
        var x = padSide + i * (barW + gap);
        var y = h - padBottom - barH;

        var r = Math.min(6, barW / 2);
        ctx.fillStyle = color;
        roundRectTop(ctx, x, y, barW, barH, r);
        ctx.fill();

        ctx.fillStyle = '#777';
        ctx.font = '10px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(d.label, x + barW / 2, h - 7);
      });
    }

    function roundRectTop(ctx, x, y, w, h, r) {
      if (h <= 0) return;
      r = Math.min(r, w / 2, h);
      ctx.beginPath();
      ctx.moveTo(x, y + h);
      ctx.lineTo(x, y + r);
      ctx.arcTo(x, y, x + r, y, r);
      ctx.lineTo(x + w - r, y);
      ctx.arcTo(x + w, y, x + w, y + r, r);
      ctx.lineTo(x + w, y + h);
      ctx.closePath();
    }

    function renderLine(w, h, filled) {
      var padBottom = 22, padTop = 14, padSide = 10;
      var maxVal = Math.max.apply(null, dataset.map(function(d){ return d.value; })) || 1;
      var minVal = Math.min(0, Math.min.apply(null, dataset.map(function(d){ return d.value; })));
      var innerW = w - padSide * 2;
      var innerH = h - padBottom - padTop;
      var stepX = dataset.length > 1 ? innerW / (dataset.length - 1) : 0;

      function ptAt(i) {
        var d = dataset[i];
        var norm = (d.value - minVal) / (maxVal - minVal || 1);
        var x = padSide + stepX * i;
        var yFull = padTop + innerH - norm * innerH;
        var yBase = padTop + innerH;
        var y = yBase - (yBase - yFull) * progress;
        return { x: x, y: y };
      }

      var color = dataset[0].color || PALETTE[0];

      if (filled) {
        ctx.beginPath();
        ctx.moveTo(padSide, padTop + innerH);
        for (var i = 0; i < dataset.length; i++) {
          var p = ptAt(i);
          ctx.lineTo(p.x, p.y);
        }
        ctx.lineTo(padSide + innerW, padTop + innerH);
        ctx.closePath();
        var grad = ctx.createLinearGradient(0, padTop, 0, padTop + innerH);
        grad.addColorStop(0, color + '55');
        grad.addColorStop(1, color + '05');
        ctx.fillStyle = grad;
        ctx.fill();
      }

      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      for (var j = 0; j < dataset.length; j++) {
        var pp = ptAt(j);
        if (j === 0) ctx.moveTo(pp.x, pp.y); else ctx.lineTo(pp.x, pp.y);
      }
      ctx.stroke();

      for (var k = 0; k < dataset.length; k++) {
        var pk = ptAt(k);
        ctx.beginPath();
        ctx.arc(pk.x, pk.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#141414';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#777';
        ctx.font = '10px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(dataset[k].label, pk.x, h - 7);
      }
    }

    function renderPie(w, h) {
      var cx = w / 2, cy = h / 2 - 4;
      var radius = Math.min(w, h) / 2 - 14;
      var total = dataset.reduce(function(s, d){ return s + Math.max(d.value, 0); }, 0) || 1;

      var startAngle = -Math.PI / 2;
      dataset.forEach(function(d, i) {
        var color = d.color || PALETTE[i % PALETTE.length];
        var slice = (Math.max(d.value, 0) / total) * Math.PI * 2 * progress;
        var endAngle = startAngle + slice;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();

        startAngle = endAngle;
      });

      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.55, 0, Math.PI * 2);
      ctx.fillStyle = '#141414';
      ctx.fill();

      ctx.fillStyle = '#e8e8e8';
      ctx.font = '700 15px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(Math.round(total)), cx, cy);
      ctx.textBaseline = 'alphabetic';
    }

    // ---------- Legenda ----------
    var legend = document.getElementById('legend');
    function buildLegend() {
      legend.innerHTML = dataset.map(function(d, i) {
        var color = d.color || PALETTE[i % PALETTE.length];
        return '<div class="legend-item"><div class="legend-dot" style="background:' + color + '"></div>' + d.label + '</div>';
      }).join('');
    }

    // ---------- Modal: tipo de gráfico ----------
    var typeGrid = document.getElementById('typeGrid');
    CHART_TYPES.forEach(function(t) {
      var chip = document.createElement('div');
      chip.className = 'type-chip';
      chip.innerHTML = '<i class="' + t.icon + '"></i>';
      chip.dataset.key = t.key;
      chip.addEventListener('click', function() {
        draft.type = t.key;
        Array.prototype.forEach.call(typeGrid.children, function(el) {
          el.classList.toggle('active', el.dataset.key === t.key);
        });
      });
      typeGrid.appendChild(chip);
    });

    // ---------- Modal: linhas de dados ----------
    var dataRowsHost = document.getElementById('dataRows');

    function buildDataRows() {
      dataRowsHost.innerHTML = '';
      draft.dataset.forEach(function(d, i) {
        var row = document.createElement('div');
        row.className = 'data-row';

        var colorInput = document.createElement('input');
        colorInput.type = 'color';
        colorInput.className = 'data-color';
        colorInput.value = d.color || PALETTE[i % PALETTE.length];
        colorInput.addEventListener('input', function() {
          d.color = colorInput.value;
        });

        var labelInput = document.createElement('input');
        labelInput.type = 'text';
        labelInput.className = 'data-label-input';
        labelInput.value = d.label;
        labelInput.addEventListener('input', function() {
          d.label = labelInput.value;
        });

        var valueInput = document.createElement('input');
        valueInput.type = 'number';
        valueInput.className = 'data-value-input';
        valueInput.value = d.value;
        valueInput.addEventListener('input', function() {
          d.value = parseFloat(valueInput.value) || 0;
        });

        var removeBtn = document.createElement('button');
        removeBtn.className = 'data-remove';
        removeBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
        removeBtn.addEventListener('click', function() {
          draft.dataset.splice(i, 1);
          buildDataRows();
        });

        row.appendChild(colorInput);
        row.appendChild(labelInput);
        row.appendChild(valueInput);
        row.appendChild(removeBtn);
        dataRowsHost.appendChild(row);
      });
    }

    document.getElementById('addRowBtn').addEventListener('click', function() {
      draft.dataset.push({ label: 'Novo', value: 10 });
      buildDataRows();
    });

    // ---------- Abrir / fechar modal ----------
    var modalOverlay = document.getElementById('modalOverlay');
    var optionsBtn = document.getElementById('optionsBtn');
    var titleInput = document.getElementById('titleInput');
    var modalCancel = document.getElementById('modalCancel');
    var modalSave = document.getElementById('modalSave');

    function openModal() {
      draft = {
        type: currentChartType,
        title: chartTitleText,
        dataset: cloneDataset(dataset)
      };

      titleInput.value = draft.title;

      Array.prototype.forEach.call(typeGrid.children, function(el) {
        el.classList.toggle('active', el.dataset.key === draft.type);
      });

      buildDataRows();
      modalOverlay.classList.add('open');
    }

    function closeModal() {
      modalOverlay.classList.remove('open');
      draft = null;
    }

    optionsBtn.addEventListener('click', openModal);
    modalCancel.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', function(e) {
      if (e.target === modalOverlay) closeModal();
    });

    modalSave.addEventListener('click', function() {
      currentChartType = draft.type;
      chartTitleText = titleInput.value || 'Dados';
      dataset = draft.dataset.filter(function(d) { return d.label.trim() !== ''; });

      document.getElementById('chartTitle').textContent = chartTitleText;
      closeModal();
      draw();
    });

    // ---------- Init ----------
    function init() {
      resizeCanvas();
      buildLegend();
      draw();
    }

    window.addEventListener('resize', function() {
      resizeCanvas();
      draw(true);
    });

    init();
  </script>
</body>
</html>
