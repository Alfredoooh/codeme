Widget para analise do mercado

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Card Mercado</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 0 16px;
    }

    .card {
      background: #1c1c1e;
      border-radius: 32px;
      padding: 10px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    /* ---------- Preview ---------- */
    .card-preview {
      border-radius: 24px;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #141414;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho — par + preço + variação */
    .market-header {
      padding: 14px 16px 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
    }

    .market-pair-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .market-pair {
      color: #e8e8e8;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .market-badge {
      background: #262626;
      color: #888;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 8px;
    }

    .market-price {
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      font-variant-numeric: tabular-nums;
    }

    .market-change {
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .market-change.up   { color: #4ec994; }
    .market-change.down { color: #e05e5e; }

    /* Área do gráfico */
    .chart-area {
      flex: 1;
      position: relative;
      min-height: 0;
      padding: 4px 4px 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Timeframes 1D / 1W / 1M / 1Y */
    .timeframe-row {
      display: flex;
      gap: 4px;
      padding: 8px 12px 12px;
      flex-shrink: 0;
    }

    .tf-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #777;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .tf-btn:hover { color: #bbb; }

    .tf-btn.active {
      background: #262626;
      color: #fff;
    }

    /* ---------- Seletor de moeda (barra de ações) ---------- */
    .card-actions {
      display: flex;
      align-items: center;
      background: #252525;
      border-radius: 50px;
      padding: 5px;
      gap: 6px;
    }

    .currency-select-btn {
      flex: 1;
      background: #2e8bc9;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      padding: 11px 16px;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 0.1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .currency-select-btn:hover  { background: #2578b0; }
    .currency-select-btn:active { background: #1f6a9e; }

    /* ---------- Modal seletor de moeda ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
      backdrop-filter: blur(2px);
    }

    .modal-overlay.open { display: flex; }

    .modal-sheet {
      background: #1c1c1e;
      width: 100%;
      max-width: 420px;
      border-radius: 28px 28px 0 0;
      padding: 18px 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 75vh;
      overflow-y: auto;
      animation: sheetUp 0.22s ease-out;
    }

    @keyframes sheetUp {
      from { transform: translateY(24px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: #3a3a3a;
      border-radius: 3px;
      margin: 0 auto;
    }

    .modal-title {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
    }

    .pair-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .pair-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #232323;
      border: 1px solid transparent;
      color: #ddd;
      font-size: 13px;
      font-weight: 600;
      padding: 12px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .pair-option:hover { background: #282828; }

    .pair-option.active {
      background: #1c3a52;
      border-color: #2e8bc9;
      color: #fff;
    }

    .pair-option-sub {
      color: #777;
      font-size: 11px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-preview">
      <div class="market-header">
        <div class="market-pair-row">
          <div class="market-pair" id="pairLabel">BTC/USD</div>
          <div class="market-badge">cripto</div>
        </div>
        <div class="market-price" id="priceLabel">$—</div>
        <div class="market-change" id="changeLabel"></div>
      </div>
      <div class="chart-area" id="chartArea">
        <canvas id="marketCanvas"></canvas>
      </div>
      <div class="timeframe-row" id="tfRow"></div>
    </div>

    <div class="card-actions">
      <button class="currency-select-btn" id="currencyBtn">
        <i class="fa-solid fa-repeat"></i>
        <span id="currencyBtnLabel">Alterar moeda</span>
      </button>
    </div>
  </div>

  <!-- Modal de seleção de moeda -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">Escolher par</div>
      <div class="pair-list" id="pairList"></div>
    </div>
  </div>

  <script>
    // ---------- Pares disponíveis ----------
    // A IA ajusta esta lista e o par inicial (CURRENT_PAIR) consoante o pedido do utilizador.
    var PAIRS = [
      { key: 'BTCUSD', label: 'BTC/USD', sub: 'Bitcoin', basePrice: 64200, volatility: 0.018, badge: 'cripto' },
      { key: 'ETHUSD', label: 'ETH/USD', sub: 'Ethereum', basePrice: 3180, volatility: 0.022, badge: 'cripto' },
      { key: 'EURUSD', label: 'EUR/USD', sub: 'Euro / Dólar', basePrice: 1.087, volatility: 0.004, badge: 'forex' },
      { key: 'GBPUSD', label: 'GBP/USD', sub: 'Libra / Dólar', basePrice: 1.271, volatility: 0.005, badge: 'forex' },
      { key: 'USDJPY', label: 'USD/JPY', sub: 'Dólar / Iene', basePrice: 156.4, volatility: 0.006, badge: 'forex' },
      { key: 'XAUUSD', label: 'XAU/USD', sub: 'Ouro', basePrice: 2340, volatility: 0.009, badge: 'metal' }
    ];

    var CURRENT_PAIR = 'BTCUSD';

    var TIMEFRAMES = [
      { key: '1D', label: '1D', points: 24,  stepMs: 60 * 60 * 1000 },
      { key: '1W', label: '1W', points: 7,   stepMs: 24 * 60 * 60 * 1000 },
      { key: '1M', label: '1M', points: 30,  stepMs: 24 * 60 * 60 * 1000 },
      { key: '1Y', label: '1Y', points: 12,  stepMs: 30 * 24 * 60 * 60 * 1000 }
    ];

    var currentTF = '1D';
    var seriesCache = {}; // cache por par+timeframe para não regenerar dados a cada troca

    // ---------- Geração de série (simulação determinística por seed) ----------
    function seededRandom(seed) {
      var s = seed % 2147483647;
      if (s <= 0) s += 2147483646;
      return function() {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    function hashKey(str) {
      var h = 0;
      for (var i = 0; i < str.length; i++) {
        h = (h * 31 + str.charCodeAt(i)) | 0;
      }
      return Math.abs(h) || 1;
    }

    function getSeries(pairKey, tfKey) {
      var cacheKey = pairKey + '_' + tfKey;
      if (seriesCache[cacheKey]) return seriesCache[cacheKey];

      var pair = PAIRS.filter(function(p) { return p.key === pairKey; })[0];
      var tf = TIMEFRAMES.filter(function(t) { return t.key === tfKey; })[0];
      var rand = seededRandom(hashKey(cacheKey));

      var points = [];
      var price = pair.basePrice * (0.92 + rand() * 0.1);
      var now = Date.now();

      for (var i = tf.points; i >= 0; i--) {
        var drift = (rand() - 0.48) * pair.volatility;
        price = price * (1 + drift);
        points.push({
          t: now - i * tf.stepMs,
          v: price
        });
      }

      seriesCache[cacheKey] = points;
      return points;
    }

    // ---------- Formatação ----------
    function formatPrice(v, pair) {
      if (pair.badge === 'forex') return v.toFixed(4);
      if (v >= 1000) return '$' + v.toLocaleString('pt-PT', { maximumFractionDigits: 0 });
      return '$' + v.toFixed(2);
    }

    // ---------- Timeframe tabs ----------
    var tfRow = document.getElementById('tfRow');
    TIMEFRAMES.forEach(function(tf) {
      var btn = document.createElement('button');
      btn.className = 'tf-btn' + (tf.key === currentTF ? ' active' : '');
      btn.textContent = tf.label;
      btn.dataset.key = tf.key;
      btn.addEventListener('click', function() {
        currentTF = tf.key;
        Array.prototype.forEach.call(tfRow.children, function(el) {
          el.classList.toggle('active', el.dataset.key === tf.key);
        });
        render();
      });
      tfRow.appendChild(btn);
    });

    // ---------- Canvas ----------
    var canvas = document.getElementById('marketCanvas');
    var ctx = canvas.getContext('2d');
    var chartArea = document.getElementById('chartArea');
    var dpr = Math.max(window.devicePixelRatio || 1, 1);

    var progress = 1;
    var animRAF = null;

    function resizeCanvas() {
      var rect = chartArea.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    function render(skipAnim) {
      if (animRAF) cancelAnimationFrame(animRAF);
      if (skipAnim) {
        progress = 1;
        draw();
        return;
      }
      progress = 0;
      var start = null;
      var duration = 420;
      function step(ts) {
        if (!start) start = ts;
        var t = Math.min((ts - start) / duration, 1);
        progress = easeOutCubic(t);
        draw();
        if (t < 1) animRAF = requestAnimationFrame(step);
      }
      animRAF = requestAnimationFrame(step);
    }

    function draw() {
      var pair = PAIRS.filter(function(p) { return p.key === CURRENT_PAIR; })[0];
      var series = getSeries(CURRENT_PAIR, currentTF);

      var rect = chartArea.getBoundingClientRect();
      var w = rect.width, h = rect.height;
      ctx.clearRect(0, 0, w, h);

      var values = series.map(function(pt) { return pt.v; });
      var maxV = Math.max.apply(null, values);
      var minV = Math.min.apply(null, values);
      var pad = (maxV - minV) * 0.12 || maxV * 0.01;
      maxV += pad; minV -= pad;

      var padSide = 4, padTop = 6, padBottom = 6;
      var innerW = w - padSide * 2;
      var innerH = h - padTop - padBottom;

      var first = values[0];
      var last = values[values.length - 1];
      var isUp = last >= first;
      var color = isUp ? '#4ec994' : '#e05e5e';

      function ptAt(i) {
        var norm = (values[i] - minV) / (maxV - minV || 1);
        var x = padSide + (innerW * i) / (values.length - 1);
        var yFull = padTop + innerH - norm * innerH;
        var yBase = padTop + innerH;
        var y = yBase - (yBase - yFull) * progress;
        return { x: x, y: y };
      }

      // área preenchida com gradiente
      ctx.beginPath();
      ctx.moveTo(padSide, padTop + innerH);
      for (var i = 0; i < values.length; i++) {
        var p = ptAt(i);
        ctx.lineTo(p.x, p.y);
      }
      ctx.lineTo(padSide + innerW, padTop + innerH);
      ctx.closePath();
      var grad = ctx.createLinearGradient(0, padTop, 0, padTop + innerH);
      grad.addColorStop(0, color + '40');
      grad.addColorStop(1, color + '00');
      ctx.fillStyle = grad;
      ctx.fill();

      // linha
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.2;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      for (var j = 0; j < values.length; j++) {
        var pp = ptAt(j);
        if (j === 0) ctx.moveTo(pp.x, pp.y); else ctx.lineTo(pp.x, pp.y);
      }
      ctx.stroke();

      // ponto final
      var lastPt = ptAt(values.length - 1);
      ctx.beginPath();
      ctx.arc(lastPt.x, lastPt.y, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      // ---------- Cabeçalho: preço + variação ----------
      var pctChange = ((last - first) / first) * 100;
      document.getElementById('pairLabel').textContent =
        pair.label.slice(0, 3) + '/' + pair.label.slice(4);
      document.getElementById('priceLabel').textContent = formatPrice(last, pair);

      var changeEl = document.getElementById('changeLabel');
      changeEl.className = 'market-change ' + (pctChange >= 0 ? 'up' : 'down');
      changeEl.innerHTML =
        '<i class="fa-solid fa-caret-' + (pctChange >= 0 ? 'up' : 'down') + '"></i>' +
        (pctChange >= 0 ? '+' : '') + pctChange.toFixed(2) + '% · ' + currentTF;

      var badgeEl = document.querySelector('.market-badge');
      if (badgeEl) badgeEl.textContent = pair.badge;
    }

    // ---------- Modal seletor de moeda ----------
    var modalOverlay = document.getElementById('modalOverlay');
    var currencyBtn = document.getElementById('currencyBtn');
    var pairList = document.getElementById('pairList');

    function buildPairList() {
      pairList.innerHTML = '';
      PAIRS.forEach(function(pair) {
        var opt = document.createElement('div');
        opt.className = 'pair-option' + (pair.key === CURRENT_PAIR ? ' active' : '');
        opt.innerHTML =
          '<span>' + pair.label + '</span>' +
          '<span class="pair-option-sub">' + pair.sub + '</span>';
        opt.addEventListener('click', function() {
          CURRENT_PAIR = pair.key;
          document.getElementById('currencyBtnLabel').textContent = pair.label;
          closeModal();
          render();
        });
        pairList.appendChild(opt);
      });
    }

    function openModal() {
      buildPairList();
      modalOverlay.classList.add('open');
    }

    function closeModal() {
      modalOverlay.classList.remove('open');
    }

    currencyBtn.addEventListener('click', openModal);
    modalOverlay.addEventListener('click', function(e) {
      if (e.target === modalOverlay) closeModal();
    });

    // ---------- Init ----------
    function init() {
      var pair = PAIRS.filter(function(p) { return p.key === CURRENT_PAIR; })[0];
      document.getElementById('currencyBtnLabel').textContent = pair.label;
      resizeCanvas();
      render();
    }

    window.addEventListener('resize', function() {
      resizeCanvas();
      render(true);
    });

    init();
  </script>
</body>
</html>
